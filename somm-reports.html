<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Petrus Sommeliers</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--grn:#5c1a1a;--grn2:#2d0a0a;--gld:#b89650;--crm:#faf7f1;--pink:#f8e8e8;--s:'Inter',sans-serif;--f:'Cormorant Garamond',serif}
body{font-family:var(--s);background:var(--crm);color:#2c2c2c;min-height:100vh}
.tb{background:var(--grn2);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.tb a{color:var(--gld);text-decoration:none;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.tb h2{font-family:var(--f);color:#fff;font-size:18px}
.pg{max-width:900px;margin:0 auto;padding:24px 14px 60px}
.pg>h1{font-family:var(--f);font-size:26px;color:var(--grn);margin-bottom:16px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filters label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888}
.filters input[type="date"]{padding:6px 10px;border:1px solid var(--gld);border-radius:4px;font-family:var(--s);font-size:11px}
.filters select{padding:6px 10px;border:1px solid var(--gld);border-radius:4px;font-family:var(--s);font-size:11px}
.filters .btn{padding:7px 16px;background:var(--grn);color:#fff;border:none;border-radius:4px;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.filters .btn:hover{background:var(--grn2)}
.section{background:#fff;border:1px solid #e8e0d4;border-radius:8px;padding:14px;margin-bottom:12px}
.section h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gld);margin-bottom:10px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:var(--grn2);color:#fff;padding:6px 8px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.tbl td{padding:5px 8px;border-bottom:1px solid #f5f0ea;vertical-align:middle}
.tbl tr:hover td{background:#fdf9f2}
.s-tag{font-size:8px;padding:2px 6px;border-radius:8px;text-transform:uppercase;font-weight:600}
.tag-low{background:#fff3cd;color:#856404}
.tag-86{background:#f8d7da;color:#721c24}
.tag-back{background:#d4edda;color:#155724}
.tag-ok{background:#d4edda;color:#155724}
.tag-chg{background:#f8d7da;color:#721c24}
.summary{margin-top:12px;padding:12px;background:var(--pink);border-radius:6px;font-size:11px;color:var(--grn)}
.summary strong{color:var(--grn2)}
.em{text-align:center;padding:20px;color:#ccc;font-size:11px}
.sm{position:fixed;bottom:20px;right:20px;background:var(--grn);color:var(--crm);padding:10px 16px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .3s;z-index:9999}
.sm.show{opacity:1}
</style>
</head>
<body>
<div class="tb"><a href="sommeliers.html">&larr; Back</a><h2>Petrus</h2><span></span></div>
<div class="pg">
<h1>Reports</h1>
<div class="filters">
  <label>From</label><input type="date" id="dateFrom">
  <label>To</label><input type="date" id="dateTo">
  <label>Type</label>
  <select id="reportType">
    <option value="stock">Stock History</option>
    <option value="deliveries">Deliveries</option>
    <option value="wastages">Wastages</option>
    <option value="transfers">Transfers</option>
  </select>
  <button class="btn" onclick="generate()">Generate</button>
</div>
<div id="output"><div class="em">Select dates and type, then click Generate</div></div>
</div>
<div class="sm" id="sm"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script>
auth.onAuthStateChanged(function(u){
  if(!u){window.location.href='index.html';return;}
  logAccess(u,'page_view','somm-reports.html');
  var today=new Date();
  var from=new Date();from.setDate(today.getDate()-21);
  document.getElementById('dateTo').value=today.toISOString().slice(0,10);
  document.getElementById('dateFrom').value=from.toISOString().slice(0,10);
});

function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});}

function generate(){
  var from=document.getElementById('dateFrom').value;
  var to=document.getElementById('dateTo').value;
  var type=document.getElementById('reportType').value;
  if(!from||!to){alert('Select both dates');return;}
  var output=document.getElementById('output');
  output.innerHTML='<div class="em">Loading...</div>';

  if(type==='stock'){generateStock(from,to);}
  else if(type==='deliveries'){generateDeliveries(from,to);}
  else if(type==='wastages'){generateWastages(from,to);}
  else if(type==='transfers'){generateTransfers(from,to);}
}

function generateStock(from,to){
  // Get all stock items created in range (both pending and restocked)
  db.collection('somm_stock').where('date','>=',from).where('date','<=',to).get().then(function(snap){
    var items=[];snap.forEach(function(doc){items.push(doc.data());});
    items.sort(function(a,b){return a.date>b.date?1:-1;});
    var output=document.getElementById('output');
    if(items.length===0){output.innerHTML='<div class="em">No stock alerts in this period</div>';return;}

    var h='<div class="section"><h3>Stock History</h3>';
    h+='<table class="tbl"><thead><tr><th>Reported</th><th>Section</th><th>Name</th><th>Tag</th><th>Qty</th><th>By</th><th>Status</th><th>Back in stock</th><th>Days out</th></tr></thead><tbody>';
    var totalDays=0;var resolved=0;
    for(var i=0;i<items.length;i++){var it=items[i];
      var tagCls=it.tag==='86'?'tag-86':'tag-low';
      var tagLbl=it.tag==='86'?'86':'Low';
      var status,backDate,daysOut;
      if(it.restocked){
        status='<span class="s-tag tag-back">✓ Resolved</span>';
        backDate=it.restockedDate||'—';
        // Calculate days out of stock
        var d1=new Date(it.date+'T12:00:00');
        var d2=new Date(it.restockedDate+'T12:00:00');
        daysOut=Math.round((d2-d1)/(1000*60*60*24));
        totalDays+=daysOut;
        resolved++;
      }else{
        status='<span class="s-tag '+tagCls+'">Pending</span>';
        backDate='—';
        var d1b=new Date(it.date+'T12:00:00');
        daysOut=Math.round((new Date()-d1b)/(1000*60*60*24));
      }
      h+='<tr><td>'+fmtDate(it.date)+'</td><td>'+it.section+'</td><td>'+it.name+(it.producer?' · '+it.producer:'')+(it.vintage?' '+it.vintage:'')+'</td>';
      h+='<td><span class="s-tag '+tagCls+'">'+tagLbl+'</span></td>';
      h+='<td>'+(it.qty?(it.qty+' '+(it.unit||'')):'—')+'</td>';
      h+='<td>'+it.author+'</td><td>'+status+'</td>';
      h+='<td>'+(backDate!=='—'?fmtDate(backDate):backDate)+'</td>';
      h+='<td>'+daysOut+'d</td></tr>';
    }
    h+='</tbody></table>';
    h+='<div class="summary"><strong>'+items.length+'</strong> total alerts — <strong>'+resolved+'</strong> resolved'+(resolved?' (avg '+Math.round(totalDays/resolved)+' days out)':'')+'  — <strong>'+(items.length-resolved)+'</strong> still pending</div>';
    h+='</div>';
    output.innerHTML=h;
  });
}

function generateDeliveries(from,to){
  db.collection('somm_deliveries').where('date','>=',from).where('date','<=',to).get().then(function(snap){
    var items=[];snap.forEach(function(doc){items.push(doc.data());});
    items.sort(function(a,b){return a.date>b.date?1:-1;});
    var output=document.getElementById('output');
    if(items.length===0){output.innerHTML='<div class="em">No deliveries in this period</div>';return;}
    var h='<div class="section"><h3>Deliveries</h3>';
    h+='<table class="tbl"><thead><tr><th>Date</th><th>Section</th><th>Supplier</th><th>Name</th><th>Qty</th><th>Status</th><th>By</th></tr></thead><tbody>';
    var ok=0,chg=0;
    for(var i=0;i<items.length;i++){var it=items[i];
      var st='—';
      if(it.asInvoice){st='<span class="s-tag tag-ok">✓ OK</span>';ok++;}
      else if(it.changed){st='<span class="s-tag tag-chg">⚠ '+it.changeType+(it.changeDetail?': '+it.changeDetail:'')+'</span>';chg++;}
      h+='<tr><td>'+fmtDate(it.date)+'</td><td>'+it.section+'</td><td>'+it.supplier+'</td><td>'+it.name+(it.producer?' · '+it.producer:'')+(it.vintage?' '+it.vintage:'')+'</td><td>'+it.qty+'</td><td>'+st+'</td><td>'+it.author+'</td></tr>';
    }
    h+='</tbody></table>';
    h+='<div class="summary"><strong>'+items.length+'</strong> deliveries — <strong>'+ok+'</strong> as invoice ✓ — <strong>'+chg+'</strong> with changes ⚠</div></div>';
    output.innerHTML=h;
  });
}

function generateWastages(from,to){
  db.collection('somm_wastages').where('date','>=',from).where('date','<=',to).get().then(function(snap){
    var items=[];snap.forEach(function(doc){items.push(doc.data());});
    items.sort(function(a,b){return a.date>b.date?1:-1;});
    var output=document.getElementById('output');
    if(items.length===0){output.innerHTML='<div class="em">No wastages in this period</div>';return;}
    var h='<div class="section"><h3>Wastages</h3>';
    h+='<table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Name</th><th>Qty</th><th>Unit</th><th>By</th></tr></thead><tbody>';
    for(var i=0;i<items.length;i++){var it=items[i];
      h+='<tr><td>'+fmtDate(it.date)+'</td><td>'+it.type+'</td><td>'+it.name+(it.producer?' · '+it.producer:'')+(it.vintage?' '+it.vintage:'')+'</td><td>'+it.qty+'</td><td>'+it.unit+'</td><td>'+it.author+'</td></tr>';
    }
    h+='</tbody></table>';
    h+='<div class="summary"><strong>'+items.length+'</strong> wastages logged</div></div>';
    output.innerHTML=h;
  });
}

function generateTransfers(from,to){
  db.collection('somm_transfers').where('date','>=',from).where('date','<=',to).get().then(function(snap){
    var items=[];snap.forEach(function(doc){items.push(doc.data());});
    items.sort(function(a,b){return a.date>b.date?1:-1;});
    var output=document.getElementById('output');
    if(items.length===0){output.innerHTML='<div class="em">No transfers in this period</div>';return;}
    var h='<div class="section"><h3>Transfers</h3>';
    h+='<table class="tbl"><thead><tr><th>Date</th><th>To</th><th>Name</th><th>Qty</th><th>Unit</th><th>Received by</th><th>By</th></tr></thead><tbody>';
    for(var i=0;i<items.length;i++){var it=items[i];
      h+='<tr><td>'+fmtDate(it.date)+'</td><td>'+it.destination+'</td><td>'+it.name+'</td><td>'+it.qty+'</td><td>'+it.unit+'</td><td>'+(it.receivedBy||'—')+'</td><td>'+it.author+'</td></tr>';
    }
    h+='</tbody></table>';
    h+='<div class="summary"><strong>'+items.length+'</strong> transfers</div></div>';
    output.innerHTML=h;
  });
}

function msg(t){var el=document.getElementById('sm');el.textContent=t;el.className='sm show';setTimeout(function(){el.className='sm';},1800);}
</script>
</body>
</html>
