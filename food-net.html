<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food — Petrus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Light rosé theme — the inverse of the dark bordeaux/gold look. No gold. */
  --wine:#5c1a1a;          /* deep bordeaux — primary accent & headings */
  --wine-soft:#7d3030;     /* softer bordeaux for secondary text */
  --bg:#fdf6f8;            /* very light pastel rosé page background */
  --bg-soft:#fbeef1;       /* soft pastel rosé for chips/rows */
  --surface:#ffffff;       /* cards */
  --text:#3a2226;          /* body text — dark plum, readable on rosé */
  --border:rgba(92,26,26,0.18);
  --serif:'Cormorant Garamond','Georgia',serif; --sans:'Inter','Segoe UI',sans-serif;
}
body { font-family:var(--sans); background:var(--bg); color:var(--text); min-height:100vh; }

/* ── Back link ── */
.back-link { display:inline-block; color:var(--wine-soft); text-decoration:none; font-size:12px; letter-spacing:1px; text-transform:uppercase; opacity:0.7; }
.back-link:hover { opacity:1; }

.container { max-width:1000px; margin:0 auto; padding:32px 24px 80px; }

/* ── Sections ── */
.section { margin-bottom:56px; }
.section-title { font-family:var(--serif); font-size:34px; color:var(--wine); margin-bottom:6px; }
.section-sub { color:var(--wine-soft); opacity:0.85; font-size:14px; margin-bottom:24px; }

/* ── Menu tabs (filter within the Menus section) ── */
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
/* Dish search box under the tabs */
.fn-search {
  width:100%; max-width:360px; display:block; margin-bottom:24px;
  padding:10px 14px; border:1px solid var(--border); border-radius:20px;
  background:var(--surface); color:var(--text); font-family:var(--sans); font-size:13px; outline:none;
}
.fn-search:focus { border-color:var(--wine); }
.fn-search::placeholder { color:var(--wine-soft); opacity:0.6; }
.tab {
  background:transparent; border:1px solid var(--border); border-radius:20px; color:var(--wine-soft);
  font-family:var(--sans); font-size:12px; letter-spacing:0.5px; padding:8px 16px; cursor:pointer; transition:all 0.2s;
}
.tab:hover { border-color:var(--wine); color:var(--wine); }
.tab.active { background:var(--wine); border-color:var(--wine); color:#fff; font-weight:600; }

/* ── Dish cards ── */
/* Outer container is a plain block; the actual card grid is .dish-grid-inner,
   so we can place diet sub-section headings between grids. */
.dish-grid { display:block; }
.dish-grid-inner { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
.diet-subhead { font-family:var(--serif); font-size:24px; color:var(--wine); margin:30px 0 14px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.diet-subhead:first-child { margin-top:0; }
.dish-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 4px 18px rgba(92,26,26,0.06); cursor:pointer; transition:transform .15s, box-shadow .15s; }
.dish-card:hover { transform:translateY(-2px); box-shadow:0 8px 26px rgba(92,26,26,0.14); }
/* Edit pencil overlaid on the dish image (only shown to editors) */
.dish-media-wrap { position:relative; }
.dish-edit-btn {
  position:absolute; top:10px; right:10px; z-index:3;
  width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
  background:rgba(255,255,255,0.92); color:var(--wine); font-size:15px; line-height:1;
  cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(92,26,26,0.18);
}
.dish-edit-btn:hover { background:#fff; border-color:var(--wine); }

/* ── Dish modal (pop-up detail view) ── */
.dish-modal-overlay { position:fixed; inset:0; z-index:1000; background:rgba(58,34,38,0.55); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
.dish-modal-overlay.open { display:flex; }
.dish-modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:620px; box-shadow:0 20px 60px rgba(58,34,38,0.4); overflow:hidden; position:relative; animation:dishPop .18s ease-out; }
@keyframes dishPop { from { opacity:0; transform:translateY(12px) scale(0.98); } to { opacity:1; transform:none; } }
.dish-modal .dish-media { height:300px; }
.dish-modal .dish-body { padding:24px; }
.dish-modal .dish-name { font-size:30px; }
.dish-modal .dish-desc { font-size:15px; }
/* In the modal all collapsible sections stay open and read like a page. */
.dish-modal .k-list { display:flex; }
.dish-modal .k-toggle { pointer-events:none; }
.dish-modal .k-toggle span { display:none; }
.dish-modal-close { position:absolute; top:12px; right:12px; z-index:2; width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,0.92); color:var(--wine); font-size:18px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.dish-modal-close:hover { background:#fff; border-color:var(--wine); }
.dish-media { width:100%; height:180px; background:var(--bg-soft) center/cover no-repeat; position:relative; }
.dish-media.empty { display:flex; align-items:center; justify-content:center; }
.dish-media.empty::after { content:'PETRUS'; font-family:var(--serif); letter-spacing:4px; color:rgba(92,26,26,0.28); font-size:18px; }
.dish-course { position:absolute; top:10px; left:10px; background:rgba(255,255,255,0.92); border:1px solid var(--border); color:var(--wine); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; padding:4px 10px; border-radius:12px; }
.dish-body { padding:18px; display:flex; flex-direction:column; gap:10px; }
.dish-name { font-family:var(--serif); font-size:22px; color:var(--wine); }
.dish-announce { font-family:var(--serif); font-size:15px; font-style:italic; line-height:1.45; color:var(--wine-soft); border-left:2px solid var(--border); padding-left:10px; }
.dish-desc { font-size:13.5px; line-height:1.5; color:var(--text); opacity:0.9; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { font-size:11px; letter-spacing:0.5px; padding:4px 10px; border-radius:12px; background:var(--bg-soft); border:1px solid var(--border); color:var(--wine-soft); text-transform:capitalize; }
.chip.diet { background:rgba(120,150,90,0.16); border-color:rgba(120,150,90,0.4); color:#5a7a3a; }
.knowledge { margin-top:4px; border-top:1px solid var(--border); }
.k-toggle { width:100%; text-align:left; background:transparent; border:none; color:var(--wine-soft); font-family:var(--sans); font-size:12px; letter-spacing:1px; text-transform:uppercase; padding:12px 0 4px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.k-list { display:none; flex-direction:column; gap:8px; padding:6px 0 4px; }
.k-list.open { display:flex; }
.k-item { font-size:13px; line-height:1.45; color:var(--text); opacity:0.92; }
.k-item b { color:var(--wine); font-weight:600; }
.k-item img { display:block; margin-top:6px; max-width:100%; border-radius:8px; border:1px solid var(--border); }
.setup-line { font-size:12px; color:var(--text); opacity:0.7; }
.setup-line b { color:var(--wine); font-weight:500; }
/* Wine pairing block on each dish card */
.wine-pairing { margin-top:4px; padding-top:10px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:5px; }
.wine-title { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--wine-soft); }
.wine-row { display:flex; gap:8px; font-size:13px; line-height:1.4; }
.wine-row .wine-label { flex:0 0 110px; color:var(--wine); font-weight:600; }
.wine-row .wine-val { color:var(--text); opacity:0.9; }
.wine-vintage { color:var(--wine-soft); font-weight:600; white-space:nowrap; }

/* ── Allergy table ── */
.table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:0 4px 18px rgba(92,26,26,0.06); }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:14px 18px; border-bottom:1px solid rgba(92,26,26,0.10); vertical-align:top; }
th { background:var(--bg-soft); color:var(--wine); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; }
td:first-child { font-family:var(--serif); font-size:18px; color:var(--wine); white-space:nowrap; }
tr:last-child td { border-bottom:none; }

/* ── Suppliers ── */
.supplier-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
.supplier-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; box-shadow:0 4px 18px rgba(92,26,26,0.06); }
.supplier-name { font-family:var(--serif); font-size:24px; color:var(--wine); }
.supplier-loc { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--wine-soft); opacity:0.85; margin:6px 0 14px; }
.supplier-body { font-size:14px; line-height:1.6; color:var(--text); opacity:0.9; }
.supplier-used { margin-top:14px; font-size:12.5px; color:var(--wine-soft); }
.supplier-used b { color:var(--wine); }

/* ── Producer cards & modal ──
   A producer card reuses the dish-card look (image on top, body below) so the
   Producers tab matches the Menu tab. The location sits under the name, and
   the dishes it's used in render as clickable chips that open the dish. */
.prod-loc { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--wine-soft); opacity:0.85; }
.prod-used { margin-top:4px; padding-top:10px; border-top:1px solid var(--border); }
.prod-used-title { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--wine-soft); margin-bottom:8px; }
.prod-dish-links { display:flex; gap:6px; flex-wrap:wrap; }
.prod-dish-link { font-size:12px; letter-spacing:0.3px; padding:5px 11px; border-radius:12px; background:var(--bg-soft); border:1px solid var(--border); color:var(--wine); cursor:pointer; transition:all .15s; }
.prod-dish-link:hover { background:var(--wine); color:#fff; border-color:var(--wine); }

@media (max-width:600px) {
  .section-title { font-size:26px; }
}

/* ── Dish print: selection dialog ── */
.dp-overlay{position:fixed;inset:0;z-index:1200;background:rgba(58,34,38,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:16px}
.dp-overlay.open{display:flex}
.dp-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(58,34,38,.4);overflow:hidden}
.dp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 18px 10px}
.dp-head h2{font-family:var(--serif);font-size:26px;color:var(--wine)}
.dp-sub{font-size:12px;color:var(--wine-soft);opacity:.8;margin-top:2px}
.dp-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 18px 10px;border-bottom:1px solid var(--border)}
.dp-search{flex:1;min-width:150px;padding:8px 12px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--text);font-family:var(--sans);font-size:13px;outline:none}
.dp-search:focus{border-color:var(--wine)}
.dp-all{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--wine);cursor:pointer;white-space:nowrap}
.dp-all input{accent-color:var(--wine)}
.dp-count{font-size:11px;color:var(--wine-soft);white-space:nowrap}
.dp-list{overflow:auto;padding:6px 18px}
.dp-group{font-family:var(--serif);font-size:15px;color:var(--wine);margin:12px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.dp-group:first-child{margin-top:4px}
.dp-item{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:6px;cursor:pointer}
.dp-item:hover{background:var(--bg-soft)}
.dp-item input{accent-color:var(--wine);margin:0}
.dp-item .dn{font-size:13.5px;color:var(--text)}
.dp-item .dc{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--wine-soft);opacity:.7;margin-left:auto}
.dp-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid var(--border)}
.dp-opt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--wine);cursor:pointer}
.dp-opt input{accent-color:var(--wine)}
.dp-btn{padding:9px 16px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--wine);font-family:var(--sans);font-size:12px;letter-spacing:.5px;cursor:pointer;transition:all .2s}
.dp-btn:hover{border-color:var(--wine)}
.dp-btn.primary{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:600}
.dp-btn.primary:disabled{opacity:.45;cursor:default}

/* ── Dish print: the printed training sheets ── */
#dishPrintRoot{display:none}
@media print{
  /* While printing from this page, show only the sheets. */
  body.dish-printing > .container{display:none!important}
  body.dish-printing #dishPrintRoot{display:block}
  body.dish-printing{background:#fff}
  #dishPrintRoot,#dishPrintRoot *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 portrait;margin:14mm}
}
.ds-sheet{break-after:page;page-break-after:always;position:relative;font-family:var(--sans);color:var(--text)}
.ds-sheet:last-child{break-after:auto;page-break-after:auto}
.ds-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--wine);padding-bottom:8px;margin-bottom:14px}
.ds-course{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--wine-soft)}
.ds-name{font-family:var(--serif);font-size:30px;color:var(--wine);line-height:1.1;margin-top:2px}
.ds-menus{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--wine-soft);opacity:.75;margin-top:6px}
.ds-cred{text-align:right;white-space:nowrap}
.ds-cred .t{font-size:8px;letter-spacing:.4px;color:#8a7f6e}
.ds-cred .b{font-family:var(--serif);font-size:13px;color:var(--wine);letter-spacing:2px}
.ds-photo{width:100%;height:230px;object-fit:cover;border-radius:10px;border:1px solid var(--border);margin-bottom:14px}
.ds-announce{font-family:var(--serif);font-size:16px;font-style:italic;line-height:1.5;color:var(--wine-soft);border-left:3px solid var(--border);padding-left:12px;margin-bottom:12px}
.ds-desc{font-size:13.5px;line-height:1.6;margin-bottom:14px}
.ds-sec{margin-bottom:12px;break-inside:avoid}
.ds-sec h3{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--wine);border-bottom:1px solid var(--border);padding-bottom:3px;margin-bottom:6px}
.ds-chips{display:flex;flex-wrap:wrap;gap:6px}
.ds-chip{font-size:11px;letter-spacing:.3px;padding:3px 10px;border-radius:12px;background:var(--bg-soft);border:1px solid var(--border);color:var(--wine-soft)}
.ds-chip.diet{background:rgba(120,150,90,.16);border-color:rgba(120,150,90,.4);color:#5a7a3a}
.ds-k{font-size:13px;line-height:1.5;margin-bottom:5px}
.ds-k b{color:var(--wine)}
.ds-wine{display:flex;gap:10px;font-size:13px;line-height:1.5;padding:2px 0}
.ds-wine .wl{flex:0 0 130px;color:var(--wine);font-weight:600}
.ds-wine .wy{color:var(--wine-soft);font-weight:600}
.ds-setup{font-size:13px;line-height:1.6}
.ds-empty{font-size:13px;color:#999;padding:20px 0}
</style>
</head>
<body>

<div class="container">

  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px;">
    <a class="back-link" href="training.html">&larr; Back</a>
    <div style="display:flex;gap:8px;">
      <a href="food-editor.html" id="editorLink" style="display:none;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--wine-soft);opacity:0.7;text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:7px 14px;transition:all .2s;" onmouseover="this.style.opacity=1;this.style.borderColor='var(--wine)'" onmouseout="this.style.opacity=0.7;this.style.borderColor='var(--border)'">✎ Edit dishes</a>
      <a href="producers-editor.html" id="producerEditorLink" style="display:none;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--wine-soft);opacity:0.7;text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:7px 14px;transition:all .2s;" onmouseover="this.style.opacity=1;this.style.borderColor='var(--wine)'" onmouseout="this.style.opacity=0.7;this.style.borderColor='var(--border)'">✎ Edit producers</a>
      <button type="button" id="printLink" onclick="openDishPrint()" style="display:none;cursor:pointer;font-family:var(--sans);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--wine-soft);opacity:0.7;background:transparent;border:1px solid var(--border);border-radius:6px;padding:7px 14px;transition:all .2s;" onmouseover="this.style.opacity=1;this.style.borderColor='var(--wine)'" onmouseout="this.style.opacity=0.7;this.style.borderColor='var(--border)'">Print / PDF</button>
    </div>
  </div>

  <!-- MENUS -->
  <section class="section">
    <h2 class="section-title" id="fn-section-title">The Menu</h2>
    <p class="section-sub" id="fn-section-sub">Every dish, with descriptions and knowledge points. Filter by menu below.</p>
    <div class="tabs" id="fn-menu-tabs"></div>
    <input type="search" id="fn-search" class="fn-search" placeholder="Search a dish…" oninput="renderDishes()" aria-label="Search a dish">

    <!-- Dishes grid (shown for every menu tab) -->
    <div class="dish-grid" id="fn-dish-grid"></div>

    <!-- Allergy table (shown only when the Allergens tab is selected) -->
    <div class="table-wrap" id="fn-allergy-wrap" style="display:none;">
      <table>
        <thead><tr><th>Dish</th><th>Allergens present</th></tr></thead>
        <tbody id="fn-allergy-tbody"></tbody>
      </table>
    </div>

    <!-- Producers (shown only when the Producers tab is selected) -->
    <!-- Same card grid as the dishes, so a producer looks like a dish card. -->
    <div class="dish-grid-inner" id="supplier-grid" style="display:none;"></div>
  </section>


</div>

<!-- Dish detail pop-up -->
<div class="dish-modal-overlay" id="dish-modal-overlay" onclick="if(event.target===this) closeDishModal()">
  <div class="dish-modal" id="dish-modal" role="dialog" aria-modal="true">
    <button class="dish-modal-close" onclick="closeDishModal()" aria-label="Close">&times;</button>
    <div id="dish-modal-content"></div>
  </div>
</div>

<!-- Dish print: pick which dishes to print, then one training sheet per page (Fiorella only) -->
<div class="dp-overlay" id="dishPrintDialog" role="dialog" aria-modal="true" aria-labelledby="dpHeading">
  <div class="dp-box">
    <div class="dp-head">
      <div>
        <h2 id="dpHeading">Print training sheets</h2>
        <p class="dp-sub">Tick the dishes to print — one sheet per dish.</p>
      </div>
      <button type="button" class="dp-btn" id="dpClose">Close</button>
    </div>
    <div class="dp-tools">
      <input type="search" id="dpSearch" class="dp-search" placeholder="Search a dish…" aria-label="Search dishes to print">
      <label class="dp-all"><input type="checkbox" id="dpAll"> Select all</label>
      <span class="dp-count" id="dpCount">0 selected</span>
    </div>
    <div class="dp-list" id="dpList"></div>
    <div class="dp-actions">
      <label class="dp-opt"><input type="checkbox" id="dpPhotos" checked> Include photos</label>
      <button type="button" class="dp-btn primary" id="dpPrint" disabled>Print selected</button>
    </div>
  </div>
</div>

<!-- Print sheets, filled on demand; shown only when printing -->
<div id="dishPrintRoot"></div>

<!-- Firebase (for live dishes from Firestore) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script src="watermark.js"></script>
<script src="anti-capture.js"></script>
<!-- Local data fallback + shared helpers -->
<script src="food-net/script.js"></script>
<script>
/* ============================================================
   Food — single continuous page in the Petrus site style.
   Reuses data globals from food-net/script.js:
   dishes, menuDefinitions, menuItems, dishImages,
   getMenuDishes, getAvailableMenuDefinitions, isNonAllergenTag.
   Image paths in the data are relative to food-net/, so we
   prefix them here.
   ============================================================ */
const IMG_BASE = 'food-net/';

/* FN_DISHES holds the dishes actually rendered. It is populated from
   Firestore on load; if Firestore is unavailable we fall back to the
   local data bundled in food-net/script.js. Firestore docs carry their
   own `images` (array) and `menus` (array). */
let FN_DISHES = [];
let usingFirestore = false;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Render the Description allowing only safe formatting (bold, italic, line
// breaks, and text colour). Everything else is escaped so no unsafe HTML runs.
function safeDesc(s){
  const raw = String(s==null?'':s);
  // If it looks like plain text (no tags), just escape + keep line breaks.
  if(!/[<]/.test(raw)) return esc(raw).replace(/\n/g,'<br>');
  // Build an element, then walk it keeping only allowed tags/attributes.
  const ALLOWED = { 'B':[], 'STRONG':[], 'I':[], 'EM':[], 'U':[], 'BR':[], 'DIV':[], 'P':[], 'SPAN':['color','font-weight','font-style'], 'FONT':['color'] };
  const tmp = document.createElement('div');
  tmp.innerHTML = raw;
  const clean = (node) => {
    let out = '';
    node.childNodes.forEach(ch => {
      if(ch.nodeType === 3){ out += esc(ch.nodeValue); return; }      // text
      if(ch.nodeType !== 1) return;                                   // skip comments etc.
      const tag = ch.tagName;
      if(!ALLOWED[tag]){ out += clean(ch); return; }                  // drop tag, keep contents
      if(tag === 'BR'){ out += '<br>'; return; }
      // Preserve only whitelisted inline styles (colour / bold / italic).
      const styles = [];
      if(ch.style){
        if(ALLOWED[tag].indexOf('color')>=0 && ch.style.color) styles.push('color:'+ch.style.color);
        if(ALLOWED[tag].indexOf('font-weight')>=0 && ch.style.fontWeight) styles.push('font-weight:'+ch.style.fontWeight);
        if(ALLOWED[tag].indexOf('font-style')>=0 && ch.style.fontStyle) styles.push('font-style:'+ch.style.fontStyle);
      }
      const style = styles.length ? ` style="${esc(styles.join(';'))}"` : '';
      const inner = clean(ch);
      // Treat block tags as line-makers.
      if(tag === 'DIV' || tag === 'P'){ out += inner + '<br>'; }
      else out += `<${tag.toLowerCase()}${style}>${inner}</${tag.toLowerCase()}>`;
    });
    return out;
  };
  return clean(tmp).replace(/(<br>)+$/,''); // trim trailing breaks
}
function fixImg(path){
  if(!path) return '';
  if(/^data:/i.test(path)) return path;                    // uploaded image (data URL)
  if(/^https?:\/\//i.test(path)) return path;              // full URL as-is
  let p = path.replace(/^\.?\//,'');
  if(/^food-net\//.test(p)) return p;                      // already prefixed
  if(/^images\//.test(p)) return IMG_BASE + p;             // images/foo.png
  return IMG_BASE + 'images/' + p;                         // bare file name
}
/* First image for a dish object (Firestore has d.images; local uses dishImages map). */
function firstImage(d){
  if(d && Array.isArray(d.images) && d.images.length) return fixImg(d.images[0]);
  const name = d && d.name;
  const v = (typeof dishImages !== 'undefined' && name) ? dishImages[name] : null;
  if(!v) return '';
  return fixImg(Array.isArray(v) ? v[0] : v);
}
function nonAllergen(tag){
  // Diet + cheese/dairy tags are not allergens.
  return /^(regular|vegetarian|vegan|pescatarian|no seafood|gluten free|pasteurised|unpasteurised|thermised)$/i.test((tag||'').trim());
}

/* ── Menus / dishes ── */
let selectedFN = 'all';

function availableMenus(){
  const base = (typeof getAvailableMenuDefinitions === 'function')
    ? getAvailableMenuDefinitions()
    : (typeof menuDefinitions !== 'undefined' ? menuDefinitions : []);
  // 'allergens' and 'producers' are virtual tabs that show the allergy table /
  // producers list instead of the dish grid.
  return [{id:'all', label:'All dishes'}, ...base,
          {id:'allergens', label:'Allergy reference'},
          {id:'producers', label:'Our producers'}];
}

// Fixed display order of courses within every menu, so dishes always appear
// canapés → amuse bouche → starters → mains → pre dessert → dessert → petit fours.
// Older course names are mapped to their nearest slot so legacy dishes still sort.
const COURSE_ORDER = [
  'Canapé','Amuse bouche','Starter 1','Starter 2',
  'Main course 1','Main course 2','Pre dessert','Dessert','Petit fours'
];
const COURSE_ALIASES = {
  'amuse-bouche':'Amuse bouche',
  'starter fish':'Starter 1','starter meat':'Starter 2','shellfish':'Starter 2',
  'fish':'Main course 1','meat':'Main course 2','vegetarian':'Main course 2',
  'pre-dessert':'Pre dessert','end of service':'Petit fours',
};
function courseRank(course){
  const raw = (course||'').trim();
  const canonical = COURSE_ALIASES[raw.toLowerCase()] || raw;
  const idx = COURSE_ORDER.indexOf(canonical);
  return idx < 0 ? COURSE_ORDER.length : idx; // unknown courses go last
}
// Sort by fixed course order first, then by the dish's own position as a tie-break.
function byCourseThen(posFn){
  return (a,b) => {
    const c = courseRank(a.course) - courseRank(b.course);
    if(c !== 0) return c;
    return posFn(a) - posFn(b);
  };
}

function dishesForMenu(menuId){
  // Never show hidden dishes in Food.
  const visible = FN_DISHES.filter(d => !d.hidden);
  if(menuId === 'all'){
    return visible.slice().sort(byCourseThen(d => d.order || 0));
  }
  // Ordered by course first, then the dish's global `order` (set by dragging in
  // the editor) — so the sequence is consistent across every menu.
  const byOwnMenus = visible.filter(d => Array.isArray(d.menus) && d.menus.indexOf(menuId) >= 0);
  if(byOwnMenus.length){
    return byOwnMenus.sort(byCourseThen(d => d.order || 0));
  }
  // Fallback to the local menuItems map (used only if Firestore data is unavailable).
  const names = (typeof menuItems !== 'undefined' ? menuItems : {})[menuId] || [];
  return names.map(n => visible.find(d => d.name === n)).filter(Boolean);
}

function renderMenuTabs(){
  const tabs = document.getElementById('fn-menu-tabs');
  tabs.innerHTML = availableMenus().map(m =>
    `<button class="tab${m.id===selectedFN?' active':''}" onclick="selectMenuFN('${m.id}')">${esc(m.label)}</button>`
  ).join('');
}

function selectMenuFN(id){ selectedFN = id; renderMenuTabs(); renderDishes(); }

function renderDishes(){
  const grid = document.getElementById('fn-dish-grid');
  const allergyWrap = document.getElementById('fn-allergy-wrap');
  const supplierGrid = document.getElementById('supplier-grid');
  const title = document.getElementById('fn-section-title');
  const sub = document.getElementById('fn-section-sub');

  const searchBox = document.getElementById('fn-search');

  // Allergy reference is its own tab: show the table, hide the dish grid.
  if(selectedFN === 'allergens'){
    grid.style.display = 'none';
    allergyWrap.style.display = 'block';
    supplierGrid.style.display = 'none';
    if(searchBox) searchBox.style.display = 'none';
    if(title) title.textContent = 'Allergy Reference';
    if(sub) sub.textContent = 'Complete allergen listing for every dish.';
    renderAllergies();
    return;
  }
  // Our producers is its own tab too.
  if(selectedFN === 'producers'){
    grid.style.display = 'none';
    allergyWrap.style.display = 'none';
    supplierGrid.style.display = '';
    if(searchBox) searchBox.style.display = 'none';
    if(title) title.textContent = 'Our Producers';
    if(sub) sub.textContent = 'Know who grows and catches our ingredients — these are the stories guests want to hear.';
    renderSuppliers();
    return;
  }
  grid.style.display = '';
  allergyWrap.style.display = 'none';
  supplierGrid.style.display = 'none';
  if(searchBox) searchBox.style.display = 'block';
  if(title) title.textContent = 'The Menu';
  if(sub) sub.textContent = 'Every dish, with descriptions and knowledge points. Filter by menu below.';

  const q = (searchBox ? searchBox.value : '').trim().toLowerCase();
  let list;
  if(q){
    // Search runs across the WHOLE menu (every dish), not just the active tab.
    list = FN_DISHES.filter(d => !d.hidden)
      .filter(d => (d.name||'').toLowerCase().includes(q) || (d.desc||'').toLowerCase().includes(q))
      .sort(byCourseThen(d => d.order || 0));
  } else {
    list = dishesForMenu(selectedFN);
  }
  if(!list.length){
    currentList = [];
    grid.innerHTML = q
      ? `<p style="opacity:.6">No dishes match “${esc(q)}”.</p>`
      : '<p style="opacity:.6">No dishes in this menu yet.</p>';
    return;
  }

  // currentList is the flat sequence of rendered cards (so the modal/pencil
  // index lines up even when a dish appears in more than one diet section).
  currentList = [];
  let html = '';
  const pushCard = (d) => {
    const i = currentList.length;
    currentList.push(d);
    const pencil = canEdit
      ? `<button class="dish-edit-btn" title="Edit this dish" onclick="editDishFromCard(event, ${i})" aria-label="Edit dish">✎</button>`
      : '';
    return `<article class="dish-card" onclick="openDishModal(${i})">
       <div class="dish-media-wrap">${dishMediaHtml(d)}${pencil}</div>
       <div class="dish-body">${dishBodyHtml(d, i)}</div>
     </article>`;
  };
  const gridBlock = (dishes) => `<div class="dish-grid-inner">${dishes.map(pushCard).join('')}</div>`;

  // Diet sub-sections only on A la carte, Lunch, Prestige and Discovery (and not while searching).
  const DIET_SECTIONS = ['Vegetarian','Pescatarian','No seafood','Gluten free'];
  const groupByDiet = !q && ['a_la_carte','lunch','prestige','discovery'].indexOf(selectedFN) >= 0;

  // The diets a dish has FOR THE CURRENT MENU (per-menu model). Falls back to
  // Regular for older dishes that have no dietByMenu entry for this menu.
  const dietsForMenu = (d) => {
    const dbm = d.dietByMenu && d.dietByMenu[selectedFN];
    return Array.isArray(dbm) && dbm.length ? dbm : ['Regular'];
  };
  const hasDietHere = (d, tag) =>
    dietsForMenu(d).some(x => (x||'').trim().toLowerCase() === tag.toLowerCase());

  if(groupByDiet){
    // Regular flow: dishes marked "Regular" for this menu (default for legacy).
    const regular = list.filter(d => hasDietHere(d, 'Regular'));
    if(regular.length) html += gridBlock(regular);
    // Then one sub-section per diet; a dish can appear in several.
    DIET_SECTIONS.forEach(tag => {
      const items = list.filter(d => hasDietHere(d, tag));
      if(!items.length) return;
      html += `<h3 class="diet-subhead">${esc(tag)}</h3>` + gridBlock(items);
    });
  } else {
    html = gridBlock(list);
  }

  grid.innerHTML = html;
}

// Build the wine pairing block from a dish's winePairing object (saved by the
// editor). Collapsible, same look as Knowledge points. Only rows with a value
// are shown; if none, nothing is rendered.
function winePairingBlock(wp, i){
  if(!wp || typeof wp !== 'object') return '';
  const rows = [
    ['Matching wines', wp.matching, wp.matchingVintage],
    ['Connoisseur', wp.connoisseur, wp.connoisseurVintage],
    ['Indulgence', wp.indulgence, wp.indulgenceVintage],
    // Second Indulgence wine (Main course 2). Shown with no label so it reads
    // as a second line under Indulgence.
    ['', wp.indulgence2, wp.indulgence2Vintage],
    ['Non alcoholic', wp.nonAlcoholic, ''],
    ['Lunch wine', wp.lunch, wp.lunchVintage],
  ].filter(([,v]) => v && String(v).trim());
  if(!rows.length) return '';
  const items = rows.map(([label, v, vintage]) => {
    const yr = (vintage && String(vintage).trim()) ? ` <span class="wine-vintage">${esc(String(vintage).trim())}</span>` : '';
    return `<div class="wine-row"><span class="wine-label">${esc(label)}</span><span class="wine-val">${esc(v)}${yr}</span></div>`;
  }).join('');
  return `
    <div class="knowledge">
      <button class="k-toggle" onclick="event.stopPropagation(); toggleSection('wine-${i}')">Wine pairing <span id="wine-${i}-tog">+</span></button>
      <div class="k-list" id="wine-${i}-list">${items}</div>
    </div>`;
}

// Load producers from Firestore; keep the seed if the collection is empty.
function loadProducersFromFirestore(){
  return new Promise((resolve) => {
    if(typeof db === 'undefined'){ resolve(false); return; }
    db.collection('producers').orderBy('order').get()
      .then(snap => {
        if(snap.empty){ resolve(false); return; }
        FN_PRODUCERS = snap.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
        resolve(true);
      })
      .catch(() => {
        // No order field / index: fall back to an unordered read.
        db.collection('producers').get()
          .then(snap => {
            if(snap.empty){ resolve(false); return; }
            FN_PRODUCERS = snap.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
            resolve(true);
          })
          .catch(() => resolve(false));
      });
  });
}

/* ── Data loading: Firestore first, local fallback ── */
function localDishes(){
  // Build FN_DISHES from the bundled data (script.js), attaching images[] and menus[].
  if(typeof dishes === 'undefined') return [];
  const menuItemsLocal = (typeof menuItems !== 'undefined') ? menuItems : {};
  const nameToMenus = {};
  Object.keys(menuItemsLocal).forEach(mid => (menuItemsLocal[mid]||[]).forEach(n => {
    (nameToMenus[n] = nameToMenus[n] || []).push(mid);
  }));
  return dishes.map((d, i) => {
    let imgs = [];
    if(typeof dishImages !== 'undefined' && dishImages[d.name]){
      const v = dishImages[d.name]; imgs = Array.isArray(v) ? v.slice() : [v];
    }
    return Object.assign({}, d, { images: imgs, menus: nameToMenus[d.name] || [], order: i });
  });
}

  renderSuppliers();
}

/* ============================================================
   Dish print — Fiorella only. Pick dishes (checkbox + Select all),
   then print one training sheet per dish.
   ============================================================ */
var dpSelected = {};   // dish id -> true

// Friendly menu label from its id (uses the same definitions the tabs use).
function menuLabel(id){
  var defs = (typeof menuDefinitions !== 'undefined') ? menuDefinitions : [];
  var m = defs.filter(function(x){ return x.id === id; })[0];
  if(m && m.label) return m.label;
  return String(id||'').replace(/_/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

function dpDishes(){
  // All visible dishes, in the same course order used on the page.
  return FN_DISHES.filter(d => !d.hidden)
    .slice()
    .sort(byCourseThen(d => d.order || 0));
}
function dpKey(d){ return d.id || d.docId || d.name; }

function openDishPrint(){
  // Default: nothing ticked; dialog remembers selection within the session.
  document.getElementById('dpSearch').value = '';
  renderDpList();
  document.getElementById('dishPrintDialog').classList.add('open');
}
function closeDishPrint(){ document.getElementById('dishPrintDialog').classList.remove('open'); }
function dishPrintOpen(){ return document.getElementById('dishPrintDialog').classList.contains('open'); }

function renderDpList(){
  var box = document.getElementById('dpList');
  var q = (document.getElementById('dpSearch').value || '').trim().toLowerCase();
  var list = dpDishes().filter(d => !q || (d.name||'').toLowerCase().includes(q) || (d.course||'').toLowerCase().includes(q));
  if(!list.length){ box.innerHTML = '<div class="ds-empty">No dishes match.</div>'; updateDpCount(); return; }
  var html = '', lastCourse = null;
  list.forEach(function(d){
    var course = (d.course||'Other').trim() || 'Other';
    if(course !== lastCourse){ html += '<div class="dp-group">' + esc(course) + '</div>'; lastCourse = course; }
    var k = dpKey(d);
    html += '<label class="dp-item"><input type="checkbox" value="' + esc(k) + '" ' + (dpSelected[k] ? 'checked' : '') + '>' +
      '<span class="dn">' + esc(d.name||'') + '</span><span class="dc">' + esc(d.course||'') + '</span></label>';
  });
  box.innerHTML = html;
  updateDpCount();
}
function selectedCount(){ return Object.keys(dpSelected).filter(function(k){ return dpSelected[k]; }).length; }
function updateDpCount(){
  var n = selectedCount();
  document.getElementById('dpCount').textContent = n + ' selected';
  document.getElementById('dpPrint').disabled = n === 0;
  // "Select all" reflects whether every currently-listed dish is ticked.
  var boxes = document.querySelectorAll('#dpList input[type=checkbox]');
  var all = boxes.length > 0;
  boxes.forEach(function(c){ if(!c.checked) all = false; });
  var allBox = document.getElementById('dpAll');
  allBox.checked = all;
  allBox.indeterminate = !all && n > 0;
}
(function wireDishPrint(){
  var dlg = document.getElementById('dishPrintDialog');
  document.getElementById('dpClose').addEventListener('click', closeDishPrint);
  dlg.addEventListener('click', function(e){ if(e.target === dlg) closeDishPrint(); });
  document.getElementById('dpSearch').addEventListener('input', renderDpList);
  document.getElementById('dpList').addEventListener('change', function(e){
    var c = e.target;
    if(!c.matches('input[type=checkbox]')) return;
    dpSelected[c.value] = c.checked;
    updateDpCount();
  });
  // Select all / none — applies to the dishes currently listed (respects the search filter).
  document.getElementById('dpAll').addEventListener('change', function(e){
    var on = e.target.checked;
    document.querySelectorAll('#dpList input[type=checkbox]').forEach(function(c){
      c.checked = on; dpSelected[c.value] = on;
    });
    updateDpCount();
  });
  document.getElementById('dpPrint').addEventListener('click', doDishPrint);
})();

// Build one training sheet per selected dish, then print.
function doDishPrint(){
  var withPhotos = document.getElementById('dpPhotos').checked;
  var chosen = dpDishes().filter(function(d){ return dpSelected[dpKey(d)]; });
  if(!chosen.length) return;
  var root = document.getElementById('dishPrintRoot');
  root.innerHTML = chosen.map(function(d){ return dishSheetHtml(d, withPhotos); }).join('');
  document.body.classList.add('dish-printing');
  closeDishPrint();
  // Tell anti-capture.js this print is authorised, so it doesn't show the screenshot warning.
  window.petrusAllowPrint = true;
  window.print();
  // Fallback in case 'afterprint' never fires (some browsers): drop the flag shortly after.
  setTimeout(function(){ window.petrusAllowPrint = false; }, 1000);
}
window.addEventListener('afterprint', function(){
  window.petrusAllowPrint = false;
  if(document.body.classList.contains('dish-printing')){
    document.body.classList.remove('dish-printing');
    document.getElementById('dishPrintRoot').innerHTML = '';
  }
});

// One printable training sheet for a dish (uses the same fields as the on-screen card/modal).
function dishSheetHtml(d, withPhotos){
  var menus = (Array.isArray(d.menus) ? d.menus : []).map(menuLabel);
  var img = withPhotos ? firstImage(d) : '';
  var imgUrl = img ? (/^data:/i.test(img) ? img : encodeURI(img)) : '';
  var photo = img ? '<img class="ds-photo" src="' + imgUrl + '" alt="" onerror="this.style.display=\'none\'">' : '';

  var announce = (d.announcement||'').trim();
  var announceBlock = announce ? '<div class="ds-announce">' + esc(announce).replace(/\n/g,'<br>') + '</div>' : '';
  var descBlock = (d.desc && String(d.desc).trim()) ? '<div class="ds-desc">' + safeDesc(d.desc) + '</div>' : '';

  var chips = (d.allergies||[]).map(function(a){ return '<span class="ds-chip' + (nonAllergen(a) ? ' diet' : '') + '">' + esc(a) + '</span>'; }).join('');
  var chipsBlock = chips ? '<div class="ds-sec"><h3>Allergens &amp; diet</h3><div class="ds-chips">' + chips + '</div></div>' : '';

  var setup = (Array.isArray(d.setup) ? d.setup : []).filter(function(s){ return s && s !== 'No Set Up'; });
  var setupBlock = setup.length ? '<div class="ds-sec"><h3>Set up</h3><div class="ds-setup">' + setup.map(esc).join('<br>') + '</div></div>' : '';

  var wp = d.winePairing || {};
  var wineRows = [
    ['Matching wines', wp.matching, wp.matchingVintage],
    ['Connoisseur', wp.connoisseur, wp.connoisseurVintage],
    ['Indulgence', wp.indulgence, wp.indulgenceVintage],
    ['', wp.indulgence2, wp.indulgence2Vintage],
    ['Non alcoholic', wp.nonAlcoholic, ''],
    ['Lunch wine', wp.lunch, wp.lunchVintage]
  ].filter(function(r){ return r[1] && String(r[1]).trim(); });
  var wineBlock = wineRows.length ? '<div class="ds-sec"><h3>Wine pairing</h3>' + wineRows.map(function(r){
    var yr = (r[2] && String(r[2]).trim()) ? ' <span class="wy">' + esc(String(r[2]).trim()) + '</span>' : '';
    return '<div class="ds-wine"><span class="wl">' + esc(r[0]) + '</span><span>' + esc(r[1]) + yr + '</span></div>';
  }).join('') + '</div>' : '';

  var know = (d.knowledge||[]).filter(function(k){ return (k.title||k.text); }).map(function(k){
    return '<div class="ds-k"><b>' + esc(k.title||'') + ':</b> ' + esc(k.text||'') + '</div>';
  }).join('');
  var knowBlock = know ? '<div class="ds-sec"><h3>Knowledge points</h3>' + know + '</div>' : '';

  var menusBlock = menus.length ? '<div class="ds-menus">' + menus.map(esc).join(' &middot; ') + '</div>' : '';

  return '<section class="ds-sheet">' +
    '<div class="ds-head"><div>' +
      (d.course ? '<div class="ds-course">' + esc(d.course) + '</div>' : '') +
      '<div class="ds-name">' + esc(d.name||'') + '</div>' + menusBlock +
    '</div><div class="ds-cred"><div class="t">Automatization made by</div><div class="b">Fiorella A.</div></div></div>' +
    photo + announceBlock + descBlock + chipsBlock + wineBlock + setupBlock + knowBlock +
  '</section>';
}

function loadFromFirestore(){
  return new Promise((resolve) => {
    if(typeof db === 'undefined'){ resolve(false); return; }
    db.collection('dishes').get()
      .then(snap => {
        if(snap.empty){ resolve(false); return; }
        FN_DISHES = snap.docs.map(doc => Object.assign({ id: doc.id }, doc.data()))
          .sort((a,b) => (a.order||0) - (b.order||0));
        usingFirestore = true;
        resolve(true);
      })
      .catch(err => { console.warn('Firestore load failed, using local data:', err && err.message); resolve(false); });
  });
}

document.addEventListener('DOMContentLoaded', () => {
  // Render immediately with local data so the page never looks empty…
  try { FN_DISHES = localDishes(); renderAll(); } catch(e){ console.error('local render error', e); }
  // …then upgrade to Firestore data when it arrives (needs auth to be signed in).
  // Dishes load first; producers load after so their "Used for" chips can
  // resolve dish names from FN_DISHES.
  const tryLoad = () => loadFromFirestore().then(ok => {
    if(ok) renderAll();
    return loadProducersFromFirestore();
  }).then(okProd => { if(okProd) renderSuppliers(); });
  if(typeof auth !== 'undefined'){
    auth.onAuthStateChanged((user) => {
      // Editors see the top links and the per-card pencil.
      canEdit = !!(user && FN_EDITORS.indexOf(user.email) >= 0);
      var w = document.getElementById('editorLink');
      if(w) w.style.display = canEdit ? 'inline-block' : 'none';
      var wp = document.getElementById('producerEditorLink');
      if(wp) wp.style.display = (user && FN_PRODUCER_EDITORS.indexOf(user.email) >= 0) ? 'inline-block' : 'none';
      // Print / PDF of training sheets — Fiorella only.
      var pl = document.getElementById('printLink');
      if(pl) pl.style.display = (user && user.email === 'fiorella@petrus.local') ? 'inline-block' : 'none';
      renderDishes();   // re-render so pencils appear/disappear with the role
      tryLoad();
    });
  } else {
    tryLoad();
  }
});
</script>
