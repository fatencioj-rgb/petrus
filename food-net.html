<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Net — Petrus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:#5c1a1a; --green-dark:#2d0a0a; --gold:#b89650; --gold-light:#d4b87a;
  --cream:#faf7f1; --text:#2c2c2c; --surface:#3a1414; --border:rgba(184,150,80,0.3);
  --serif:'Cormorant Garamond','Georgia',serif; --sans:'Inter','Segoe UI',sans-serif;
}
body { font-family:var(--sans); background:var(--green-dark); color:var(--cream); min-height:100vh; }

/* ── Header ── */
.site-header {
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:20px;
  padding:18px 24px; background:rgba(45,10,10,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.brand { font-family:var(--serif); font-size:26px; font-weight:700; color:var(--gold); letter-spacing:3px; text-transform:uppercase; }
.brand span { display:block; font-family:var(--sans); font-size:10px; font-weight:300; letter-spacing:3px; color:var(--gold-light); opacity:0.8; }
.back-link { margin-left:auto; color:var(--gold-light); text-decoration:none; font-size:12px; letter-spacing:1px; text-transform:uppercase; opacity:0.7; padding:9px 8px; }
.back-link:hover { opacity:1; }

.container { max-width:1000px; margin:0 auto; padding:32px 24px 80px; }

/* ── Sections ── */
.section { margin-bottom:56px; }
.section-title { font-family:var(--serif); font-size:34px; color:var(--gold); margin-bottom:6px; }
.section-sub { color:var(--cream); opacity:0.7; font-size:14px; margin-bottom:24px; }

/* ── Menu tabs (filter within the Menus section) ── */
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
.tab {
  background:transparent; border:1px solid var(--border); border-radius:20px; color:var(--cream);
  font-family:var(--sans); font-size:12px; letter-spacing:0.5px; padding:8px 16px; cursor:pointer; transition:all 0.2s;
}
.tab:hover { border-color:var(--gold); color:var(--gold); }
.tab.active { background:var(--gold); border-color:var(--gold); color:var(--green-dark); font-weight:600; }

/* ── Dish cards ── */
.dish-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
.dish-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
.dish-media { width:100%; height:180px; background:#241010 center/cover no-repeat; position:relative; }
.dish-media.empty { display:flex; align-items:center; justify-content:center; }
.dish-media.empty::after { content:'PETRUS'; font-family:var(--serif); letter-spacing:4px; color:rgba(184,150,80,0.35); font-size:18px; }
.dish-course { position:absolute; top:10px; left:10px; background:rgba(45,10,10,0.8); border:1px solid var(--border); color:var(--gold-light); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; padding:4px 10px; border-radius:12px; }
.dish-body { padding:18px; display:flex; flex-direction:column; gap:10px; }
.dish-name { font-family:var(--serif); font-size:22px; color:var(--gold); }
.dish-desc { font-size:13.5px; line-height:1.5; color:var(--cream); opacity:0.85; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { font-size:11px; letter-spacing:0.5px; padding:4px 10px; border-radius:12px; background:rgba(184,150,80,0.12); border:1px solid var(--border); color:var(--gold-light); text-transform:capitalize; }
.chip.diet { background:rgba(120,170,90,0.15); border-color:rgba(120,170,90,0.4); color:#bfe0a0; }
.knowledge { margin-top:4px; border-top:1px solid var(--border); }
.k-toggle { width:100%; text-align:left; background:transparent; border:none; color:var(--gold-light); font-family:var(--sans); font-size:12px; letter-spacing:1px; text-transform:uppercase; padding:12px 0 4px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.k-list { display:none; flex-direction:column; gap:8px; padding:6px 0 4px; }
.k-list.open { display:flex; }
.k-item { font-size:13px; line-height:1.45; color:var(--cream); opacity:0.9; }
.k-item b { color:var(--gold-light); font-weight:600; }
.k-item img { display:block; margin-top:6px; max-width:100%; border-radius:8px; border:1px solid var(--border); }
.setup-line { font-size:12px; color:var(--cream); opacity:0.6; }
.setup-line b { color:var(--gold-light); font-weight:500; }

/* ── Allergy table ── */
.table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:14px 18px; border-bottom:1px solid rgba(184,150,80,0.15); vertical-align:top; }
th { background:rgba(45,10,10,0.6); color:var(--gold); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; }
td:first-child { font-family:var(--serif); font-size:18px; color:var(--gold-light); white-space:nowrap; }
tr:last-child td { border-bottom:none; }

/* ── Suppliers ── */
.supplier-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
.supplier-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; }
.supplier-name { font-family:var(--serif); font-size:24px; color:var(--gold); }
.supplier-loc { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-light); opacity:0.8; margin:6px 0 14px; }
.supplier-body { font-size:14px; line-height:1.6; color:var(--cream); opacity:0.88; }
.supplier-used { margin-top:14px; font-size:12.5px; color:var(--gold-light); }
.supplier-used b { color:var(--gold); }

@media (max-width:600px) {
  .site-header { flex-wrap:wrap; }
  .back-link { margin-left:0; }
  .section-title { font-size:26px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">Petrus<span>Food Net</span></div>
  <a class="back-link" href="training.html">&larr; Training</a>
</header>

<div class="container">

  <!-- MENUS -->
  <section class="section">
    <h2 class="section-title">The Menu</h2>
    <p class="section-sub">Every dish, with descriptions and knowledge points. Filter by menu below.</p>
    <div class="tabs" id="fn-menu-tabs"></div>
    <div class="dish-grid" id="fn-dish-grid"></div>
  </section>

  <!-- ALLERGENS -->
  <section class="section">
    <h2 class="section-title">Allergy Reference</h2>
    <p class="section-sub">Complete allergen listing for every dish.</p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Dish</th><th>Allergens present</th></tr></thead>
        <tbody id="fn-allergy-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- SUPPLIERS -->
  <section class="section">
    <h2 class="section-title">Our Producers</h2>
    <p class="section-sub">Know who grows and catches our ingredients — these are the stories guests want to hear.</p>
    <div class="supplier-grid" id="supplier-grid"></div>
  </section>

</div>

<!-- Reuse the mirrored data + generators -->
<script src="food-net/script.js"></script>
<script>
/* ============================================================
   Food Net — single continuous page in the Petrus site style.
   Reuses data globals from food-net/script.js:
   dishes, menuDefinitions, menuItems, dishImages,
   getMenuDishes, getAvailableMenuDefinitions, isNonAllergenTag.
   Image paths in the data are relative to food-net/, so we
   prefix them here.
   ============================================================ */
const IMG_BASE = 'food-net/';

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fixImg(path){
  if(!path) return '';
  return IMG_BASE + path.replace(/^\.?\//,'');
}
function firstImage(name){
  const v = (typeof dishImages !== 'undefined') ? dishImages[name] : null;
  if(!v) return '';
  return fixImg(Array.isArray(v) ? v[0] : v);
}
function nonAllergen(tag){
  return typeof isNonAllergenTag === 'function'
    ? isNonAllergenTag(tag)
    : /^(vegetarian|vegan|pasteurised|unpasteurised|thermised)$/i.test((tag||'').trim());
}

/* ── Menus / dishes ── */
let selectedFN = 'all';

function availableMenus(){
  const base = (typeof getAvailableMenuDefinitions === 'function')
    ? getAvailableMenuDefinitions()
    : (typeof menuDefinitions !== 'undefined' ? menuDefinitions : []);
  return [{id:'all', label:'All dishes'}, ...base];
}

function dishesForMenu(menuId){
  if(typeof getMenuDishes === 'function') return getMenuDishes(menuId);
  if(menuId === 'all') return dishes;
  const names = (menuItems||{})[menuId] || [];
  return names.map(n => dishes.find(d => d.name === n)).filter(Boolean);
}

function renderMenuTabs(){
  const tabs = document.getElementById('fn-menu-tabs');
  tabs.innerHTML = availableMenus().map(m =>
    `<button class="tab${m.id===selectedFN?' active':''}" onclick="selectMenuFN('${m.id}')">${esc(m.label)}</button>`
  ).join('');
}

function selectMenuFN(id){ selectedFN = id; renderMenuTabs(); renderDishes(); }

function renderDishes(){
  const grid = document.getElementById('fn-dish-grid');
  const list = dishesForMenu(selectedFN);
  if(!list.length){ grid.innerHTML = '<p style="opacity:.6">No dishes in this menu yet.</p>'; return; }
  grid.innerHTML = list.map((d, i) => {
    const img = firstImage(d.name);
    const media = img
      ? `<div class="dish-media" style="background-image:url('${encodeURI(img)}')"><span class="dish-course">${esc(d.course||'')}</span></div>`
      : `<div class="dish-media empty"><span class="dish-course">${esc(d.course||'')}</span></div>`;
    const chips = (d.allergies||[]).map(a =>
      `<span class="chip${nonAllergen(a)?' diet':''}">${esc(a)}</span>`).join('');
    const setup = Array.isArray(d.setup) ? d.setup.filter(s => s && s!=='No Set Up') : [];
    const setupLine = setup.length ? `<div class="setup-line"><b>Set up:</b> ${esc(setup.join(', '))}</div>` : '';
    const know = (d.knowledge||[]).map(k => {
      const imgs = (k.images||[]).map(im => `<img src="${encodeURI(fixImg('images/'+im))}" alt="${esc(k.title)}" loading="lazy" onerror="this.style.display='none'">`).join('');
      return `<div class="k-item"><b>${esc(k.title)}:</b> ${esc(k.text)}${imgs}</div>`;
    }).join('');
    const knowBlock = know ? `
      <div class="knowledge">
        <button class="k-toggle" onclick="toggleK(${i})">Knowledge points <span id="ktog-${i}">+</span></button>
        <div class="k-list" id="klist-${i}">${know}</div>
      </div>` : '';
    return `
      <article class="dish-card">
        ${media}
        <div class="dish-body">
          <div class="dish-name">${esc(d.name)}</div>
          <div class="dish-desc">${esc(d.desc||'')}</div>
          ${chips ? `<div class="chips">${chips}</div>` : ''}
          ${setupLine}
          ${knowBlock}
        </div>
      </article>`;
  }).join('');
}

function toggleK(i){
  const list = document.getElementById('klist-'+i);
  const tog = document.getElementById('ktog-'+i);
  const open = list.classList.toggle('open');
  tog.textContent = open ? '−' : '+';
}

/* ── Allergens ── */
function renderAllergies(){
  const tbody = document.getElementById('fn-allergy-tbody');
  tbody.innerHTML = dishes.map(d => {
    const chips = (d.allergies||[]).map(a =>
      `<span class="chip${nonAllergen(a)?' diet':''}">${esc(a)}</span>`).join(' ');
    return `<tr><td>${esc(d.name)}</td><td><div class="chips">${chips || '<span style="opacity:.5">—</span>'}</div></td></tr>`;
  }).join('');
}

/* ── Suppliers (hardcoded, from the portal) ── */
const suppliersFN = [
  { name:'Keltic Seafare', loc:'Dingwall, North of Inverness — Est. 1992',
    body:'Founded by Alasdair Hughson, Keltic sources exclusively from the North-West Highland coast of Scotland. They supply lobster, live langoustine and hand-dived scallops — each order hand-packed at their Dingwall factory and delivered within 24 to 36 hours of harvesting, ensuring everything arrives alive and fresh.',
    used:'Isle of Skye Scallops' },
  { name:'Meadowland Smokery', loc:'Colyton, Devon — Est. 2017',
    body:'A family business founded by fish farmer Neil Fuzzard and his son Ben, a chef. They raise fish in enclosures and smoke wild eel following traditional methods. Meadowland supplies over 50 Michelin-starred restaurants across the UK and is prized for a product made with genuine craft rather than industrial scale.',
    used:'Smoked Eel' },
  { name:'Sladesdown Farm', loc:'Dartmoor National Park, South Devon',
    body:'Owned by Daniel and Elaine, both raised on family farms. Originally raising turkey and geese for the holiday season, they have expanded to produce high-quality duck, chicken and pork. All poultry is reared on non-GM, all-natural feed and grazed on wild grasses, vetches and brassicas — giving the birds rich flavour, natural tenderness and exceptional juiciness.',
    used:'Chicken Supreme, Duck & Asparagus Tarte' },
  { name:'Flying Fish Seafoods', loc:'Brixham, Newlyn & Plymouth markets',
    body:'Flying Fish uses dedicated buyers sourcing from the finest British fish markets — Brixham, Newlyn and Plymouth — plus special seafood from Scotland and the Rungis market in Paris. They also support local fishmongers who deliver directly to the door. After years perfecting their logistics, they deliver to restaurants within 48 hours of the catch.',
    used:'Fish and seafood dishes' },
];

function renderSuppliers(){
  document.getElementById('supplier-grid').innerHTML = suppliersFN.map(s => `
    <article class="supplier-card">
      <div class="supplier-name">${esc(s.name)}</div>
      <div class="supplier-loc">${esc(s.loc)}</div>
      <p class="supplier-body">${esc(s.body)}</p>
      <div class="supplier-used"><b>Used for:</b> ${esc(s.used)}</div>
    </article>`).join('');
}

/* ── Init ── */
document.addEventListener('DOMContentLoaded', () => {
  try {
    renderMenuTabs();
    renderDishes();
    renderAllergies();
    renderSuppliers();
  } catch(e){
    console.error('Food Net render error', e);
  }
});
</script>
</body>
</html>
