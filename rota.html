<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota — Petrus</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1a1a1a;
  --bg-card: #242424;
  --bg-cell: #2e2e2e;
  --border: #3a3a3a;
  --text: #e8e8e8;
  --text-muted: #999;
  --gold: #b89650;
  --gold-light: #d4b87a;
  --green-dark: #2d0a0a;
  --header-bg: #1c1c1c;
  --role-management: #2d5a27;
  --role-waiter: #1a4a7a;
  --role-commis: #7a6a1a;
  --role-agency: #555;
  --role-sommelier: #5a1a2d;
  --role-reception: #7a4a1a;
  --shift-full: rgba(100, 180, 255, 0.15);
  --shift-am: rgba(255, 230, 100, 0.15);
  --shift-pm: rgba(180, 130, 255, 0.15);
  --shift-off: rgba(150, 150, 150, 0.1);
  --shift-sick: rgba(255, 100, 100, 0.15);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 13px; }
a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--gold-light); }
button { cursor: pointer; font-family: var(--font); }

/* Header */
.top-bar { background: var(--header-bg); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.top-bar a { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.top-bar h2 { color: #fff; font-size: 16px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

/* Toolbar */
.toolbar { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.week-nav { display: flex; align-items: center; gap: 12px; }
.week-nav button { background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 4px; font-size: 12px; transition: all 0.2s; }
.week-nav button:hover { border-color: var(--gold); color: var(--gold); }
.week-label { font-size: 14px; font-weight: 600; letter-spacing: 1px; min-width: 200px; text-align: center; }
.toolbar-actions { display: flex; gap: 8px; }
.toolbar-actions button { background: var(--bg-cell); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; }
.toolbar-actions button:hover { border-color: var(--gold); color: var(--gold); }

/* Grid Container */
.rota-wrap { padding: 16px; overflow-x: auto; }
.rota-table { width: 100%; border-collapse: collapse; min-width: 700px; }
.rota-table th, .rota-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: center; vertical-align: middle; }
.rota-table th { background: var(--bg-card); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 500; }
.rota-table th.day-col { min-width: 120px; }
.rota-table th.name-col { min-width: 100px; text-align: left; }
.rota-table th.hours-col { min-width: 60px; }

/* Bookings Row */
.booking-row td { background: var(--bg-card); font-size: 11px; }
.booking-row input { background: transparent; border: 1px solid var(--border); color: var(--gold); width: 36px; text-align: center; padding: 2px 4px; border-radius: 3px; font-size: 11px; }
.booking-row input:focus { outline: none; border-color: var(--gold); }
.booking-label { color: var(--text-muted); font-size: 10px; margin: 0 2px; }

/* Role Section Headers */
.role-header td { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #fff; padding: 6px 10px; text-align: left; }
.role-header.management td { background: var(--role-management); }
.role-header.waiter td { background: var(--role-waiter); }
.role-header.commis td { background: var(--role-commis); }
.role-header.agency td { background: var(--role-agency); }
.role-header.sommelier td { background: var(--role-sommelier); }
.role-header.reception td { background: var(--role-reception); }

/* Staff Rows */
.staff-row td { background: var(--bg-cell); }
.staff-row td.name-cell { text-align: left; font-weight: 500; white-space: nowrap; font-size: 12px; }
.staff-row td.hours-cell { font-weight: 600; color: var(--gold); font-size: 12px; }
.staff-row td.shift-cell { cursor: pointer; position: relative; min-height: 32px; transition: background 0.2s; font-size: 12px; }
.staff-row td.shift-cell:hover { outline: 2px solid var(--gold); outline-offset: -2px; }
.staff-row td.shift-cell.readonly { cursor: default; }
.staff-row td.shift-cell.readonly:hover { outline: none; }

/* Shift Colors */
.shift-full { background: var(--shift-full) !important; }
.shift-am { background: var(--shift-am) !important; }
.shift-pm { background: var(--shift-pm) !important; }
.shift-off { background: var(--shift-off) !important; color: var(--text-muted) !important; }
.shift-sick { background: var(--shift-sick) !important; }

/* Tags */
.shift-tag { display: inline-block; font-size: 9px; padding: 1px 4px; border-radius: 3px; margin-left: 3px; background: rgba(184,150,80,0.2); color: var(--gold); vertical-align: middle; }

/* Add Support Button */
.add-support-btn { font-size: 10px; background: none; border: 1px dashed var(--border); color: var(--text-muted); padding: 3px 10px; border-radius: 3px; cursor: pointer; transition: all 0.2s; }
.add-support-btn:hover { border-color: var(--gold); color: var(--gold); }

/* Shift Editor Popup */
.shift-popup { position: fixed; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 200; min-width: 220px; }
.shift-popup .popup-title { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.shift-popup .quick-options { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.shift-popup .quick-opt { background: var(--bg-cell); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
.shift-popup .quick-opt:hover { border-color: var(--gold); color: var(--gold); }
.shift-popup .custom-input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 8px; }
.shift-popup .custom-input:focus { outline: none; border-color: var(--gold); }
.shift-popup .tag-options { display: flex; gap: 4px; margin-bottom: 8px; }
.shift-popup .tag-opt { font-size: 10px; padding: 3px 6px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg-cell); color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
.shift-popup .tag-opt.active { background: rgba(184,150,80,0.2); border-color: var(--gold); color: var(--gold); }
.shift-popup .popup-actions { display: flex; gap: 6px; justify-content: flex-end; }
.shift-popup .popup-actions button { padding: 4px 12px; border-radius: 4px; font-size: 11px; border: 1px solid var(--border); }
.shift-popup .btn-save { background: var(--gold); color: #1a1a1a; border-color: var(--gold); font-weight: 600; }
.shift-popup .btn-clear { background: none; color: var(--text-muted); }
.shift-popup .btn-cancel { background: none; color: var(--text-muted); }

/* Warnings Panel */
.warnings-panel { margin: 16px; padding: 12px 16px; background: rgba(255,180,50,0.08); border: 1px solid rgba(255,180,50,0.2); border-radius: 6px; }
.warnings-panel h4 { font-size: 11px; color: #ffb432; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.warnings-panel ul { list-style: none; padding: 0; }
.warnings-panel li { font-size: 12px; color: #ddd; padding: 3px 0; }
.warnings-panel li::before { content: '⚠️ '; }
.warnings-panel.hidden { display: none; }

/* Print View */
.print-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fff; z-index: 9999; overflow: auto; padding: 20px; color: #000; }
.print-overlay.active { display: block; }
.print-overlay h2 { text-align: center; margin-bottom: 5px; }
.print-overlay .print-sub { text-align: center; color: #666; font-size: 12px; margin-bottom: 20px; }
.print-overlay table { width: 100%; border-collapse: collapse; font-size: 11px; }
.print-overlay th, .print-overlay td { border: 1px solid #ccc; padding: 4px 6px; text-align: center; }
.print-overlay th { background: #f0f0f0; }
.print-overlay .print-actions { text-align: center; margin-top: 20px; }
.print-overlay .print-actions button { padding: 8px 20px; margin: 0 8px; font-size: 13px; cursor: pointer; }

/* Responsive */
@media (max-width: 768px) {
  .toolbar { flex-direction: column; align-items: stretch; }
  .week-nav { justify-content: center; }
  .toolbar-actions { justify-content: center; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="top-bar">
  <a href="operations.html">&larr; Operations</a>
  <h2>ROTA</h2>
  <span></span>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <div class="week-nav">
    <button id="prevWeek">&larr;</button>
    <span class="week-label" id="weekLabel">Loading...</span>
    <button id="nextWeek">&rarr;</button>
  </div>
  <div class="toolbar-actions">
    <button id="duplicateBtn">Duplicate Week</button>
    <button id="exportBtn">Export / Print</button>
  </div>
</div>

<!-- Rota Grid -->
<div class="rota-wrap">
  <table class="rota-table" id="rotaTable">
    <thead id="rotaHead"></thead>
    <tbody id="rotaBody"></tbody>
  </table>
</div>

<!-- Warnings -->
<div class="warnings-panel hidden" id="warningsPanel">
  <h4>Warnings</h4>
  <ul id="warningsList"></ul>
</div>

<!-- Shift Editor Popup (hidden) -->
<div class="shift-popup" id="shiftPopup" style="display:none;"></div>

<!-- Print Overlay -->
<div class="print-overlay" id="printOverlay"></div>

<!-- Firebase + Auth -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script src="guard.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════════
// ROTA — Configuration & State
// ═══════════════════════════════════════════════════════════════════

const DAYS = ['tue','wed','thu','fri','sat'];
const DAY_LABELS = ['Tue','Wed','Thu','Fri','Sat'];

const ROLES = [
  { id: 'management', label: 'Management', color: 'management' },
  { id: 'waiter', label: 'Waiter', color: 'waiter' },
  { id: 'commis', label: 'Commis', color: 'commis' },
  { id: 'agency', label: 'Agency', color: 'agency' },
  { id: 'sommelier', label: 'Sommelier', color: 'sommelier' },
  { id: 'reception', label: 'Reception', color: 'reception' }
];

const DEFAULT_STAFF = {
  management: ['Filippo', 'Francesco'],
  waiter: ['Cain', 'Johnny'],
  commis: ['Tanvir', 'Jose'],
  agency: [],
  sommelier: ['Milena', 'Cristian', 'Fiorella'],
  reception: ['Liza']
};

const QUICK_SHIFTS = ['9:00-23:00', '9:00-17:00', '11:45-CL', '16:00-CL', 'HOL', 'OFF', 'SICK'];
const TAGS = ['KT', 'TBC', 'COMM', 'REC'];
const CL_TIME = 23; // CL = 23:00

let currentWeekStart = getMonday(new Date());
let rotaData = {};
let userIsAdmin = false;
let currentUser = null;
let supportCounters = {}; // track added support staff per role

// ═══════════════════════════════════════════════════════════════════
// DATE UTILITIES
// ═══════════════════════════════════════════════════════════════════

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  date.setDate(diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

function formatWeekLabel(monday) {
  const sat = new Date(monday);
  sat.setDate(sat.getDate() + 5);
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const d1 = monday.getDate();
  const m1 = months[monday.getMonth()];
  const d2 = sat.getDate();
  const m2 = months[sat.getMonth()];
  const y = monday.getFullYear();
  if (m1 === m2) return `${d1} ${m1} - ${d2} ${m1} ${y}`;
  return `${d1} ${m1} - ${d2} ${m2} ${y}`;
}

function weekId(monday) {
  const y = monday.getFullYear();
  const m = String(monday.getMonth() + 1).padStart(2, '0');
  const d = String(monday.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function getDayDate(monday, dayIndex) {
  const d = new Date(monday);
  d.setDate(d.getDate() + dayIndex + 1); // +1 because tue=index0 means +1 from monday
  return d.getDate();
}

// ═══════════════════════════════════════════════════════════════════
// HOURS CALCULATION
// ═══════════════════════════════════════════════════════════════════

function parseShiftHours(shiftStr) {
  if (!shiftStr) return 0;
  const upper = shiftStr.toUpperCase().trim();
  if (['HOL','OFF','SICK',''].includes(upper)) return 0;

  // Extract time portion (ignore tags)
  const timeMatch = upper.match(/^(\d{1,2}:\d{2})\s*-\s*(CL|\d{1,2}:\d{2})/);
  if (!timeMatch) return 0;

  const startParts = timeMatch[1].split(':');
  let endStr = timeMatch[2];

  const startH = parseInt(startParts[0]);
  const startM = parseInt(startParts[1]);
  let endH, endM;

  if (endStr === 'CL') {
    endH = CL_TIME;
    endM = 0;
  } else {
    const endParts = endStr.split(':');
    endH = parseInt(endParts[0]);
    endM = parseInt(endParts[1] || '0');
  }

  const startDec = startH + startM / 60;
  const endDec = endH + endM / 60;
  let gross = endDec - startDec;
  if (gross <= 0) return 0;

  // Break deduction
  const breakHours = gross >= 6 ? 1 : 0.5;
  const net = gross - breakHours;
  return Math.max(0, net);
}

function calcWeeklyHours(personShifts) {
  let total = 0;
  DAYS.forEach(day => {
    const raw = personShifts[day] || '';
    total += parseShiftHours(raw);
  });
  return total;
}

// ═══════════════════════════════════════════════════════════════════
// SHIFT COLOR LOGIC
// ═══════════════════════════════════════════════════════════════════

function getShiftClass(shiftStr) {
  if (!shiftStr) return '';
  const upper = shiftStr.toUpperCase().trim();
  if (upper === 'OFF' || upper === 'HOL') return 'shift-off';
  if (upper === 'SICK') return 'shift-sick';

  const timeMatch = upper.match(/^(\d{1,2}:\d{2})\s*-\s*(CL|\d{1,2}:\d{2})/);
  if (!timeMatch) return '';

  const startParts = timeMatch[1].split(':');
  const startH = parseInt(startParts[0]);
  let endStr = timeMatch[2];
  let endH = endStr === 'CL' ? CL_TIME : parseInt(endStr.split(':')[0]);

  // AM only: ends before 17:00
  if (endH <= 17 && startH < 12) return 'shift-am';
  // PM only: starts at or after 15:00
  if (startH >= 15) return 'shift-pm';
  // Full day otherwise
  return 'shift-full';
}

// ═══════════════════════════════════════════════════════════════════
// VALIDATIONS
// ═══════════════════════════════════════════════════════════════════

function runValidations() {
  const warnings = [];
  const shifts = rotaData.shifts || {};

  DAYS.forEach((day, idx) => {
    const dayLabel = DAY_LABELS[idx];
    let hasManager = { lunch: false, dinner: false };
    let hasSommelier = false;
    let hasOpener = false;

    Object.entries(shifts).forEach(([name, data]) => {
      const shiftStr = (data[day] || '').toUpperCase().trim();
      if (!shiftStr || ['HOL','OFF','SICK'].includes(shiftStr)) return;

      const timeMatch = shiftStr.match(/^(\d{1,2}:\d{2})\s*-\s*(CL|\d{1,2}:\d{2})/);
      if (!timeMatch) return;

      const startParts = timeMatch[1].split(':');
      const startH = parseInt(startParts[0]) + parseInt(startParts[1]) / 60;
      let endStr = timeMatch[2];
      const endH = endStr === 'CL' ? CL_TIME : parseInt(endStr.split(':')[0]) + parseInt((endStr.split(':')[1] || '0')) / 60;

      // Check opener
      if (startH < 9.5) hasOpener = true;

      // Check role coverage
      if (data.role === 'management') {
        if (startH <= 15 && endH >= 11.75) hasManager.lunch = true;
        if (startH <= 23 && endH >= 18) hasManager.dinner = true;
      }
      if (data.role === 'sommelier') hasSommelier = true;
    });

    if (!hasManager.lunch) warnings.push(`No manager during lunch on ${dayLabel}`);
    if (!hasManager.dinner) warnings.push(`No manager during dinner on ${dayLabel}`);
    if (!hasSommelier) warnings.push(`No sommelier scheduled on ${dayLabel}`);
    if (!hasOpener) warnings.push(`No one opening (before 9:30) on ${dayLabel}`);
  });

  // Check 48h/week
  Object.entries(shifts).forEach(([name, data]) => {
    const hours = calcWeeklyHours(data);
    if (hours > 48) warnings.push(`${name} exceeding 48h/week (${hours.toFixed(1)}h)`);
  });

  const panel = document.getElementById('warningsPanel');
  const list = document.getElementById('warningsList');
  if (warnings.length === 0) {
    panel.classList.add('hidden');
  } else {
    panel.classList.remove('hidden');
    list.innerHTML = warnings.map(w => `<li>${w}</li>`).join('');
  }
}

// ═══════════════════════════════════════════════════════════════════
// RENDER TABLE
// ═══════════════════════════════════════════════════════════════════

function renderTable() {
  const thead = document.getElementById('rotaHead');
  const tbody = document.getElementById('rotaBody');

  // Header row
  let headHtml = '<tr><th class="name-col">Staff</th>';
  DAYS.forEach((day, i) => {
    const dateNum = getDayDate(currentWeekStart, i);
    headHtml += `<th class="day-col">${DAY_LABELS[i]} ${dateNum}</th>`;
  });
  headHtml += '<th class="hours-col">Hours</th></tr>';
  thead.innerHTML = headHtml;

  let bodyHtml = '';

  // Bookings row
  const bookings = rotaData.bookings || {};
  bodyHtml += '<tr class="booking-row"><td style="text-align:left;font-weight:500;">Bookings</td>';
  DAYS.forEach(day => {
    const dayBooking = bookings[day] || { lunch: '', dinner: '' };
    const readonlyAttr = userIsAdmin ? '' : 'readonly';
    bodyHtml += `<td>
      <span class="booking-label">L</span><input type="number" class="booking-input" data-day="${day}" data-meal="lunch" value="${dayBooking.lunch || ''}" ${readonlyAttr} min="0" max="99">
      <span class="booking-label">D</span><input type="number" class="booking-input" data-day="${day}" data-meal="dinner" value="${dayBooking.dinner || ''}" ${readonlyAttr} min="0" max="99">
    </td>`;
  });
  bodyHtml += '<td></td></tr>';

  // Role sections
  ROLES.forEach(role => {
    // Section header
    bodyHtml += `<tr class="role-header ${role.color}"><td colspan="${DAYS.length + 2}">${role.label}`;
    if (userIsAdmin) {
      bodyHtml += ` <button class="add-support-btn" onclick="addSupport('${role.id}')">+ Support</button>`;
    }
    bodyHtml += '</td></tr>';

    // Get staff for this role
    const staffList = getStaffForRole(role.id);

    staffList.forEach(name => {
      const personData = (rotaData.shifts && rotaData.shifts[name]) || { role: role.id };
      const weekHours = calcWeeklyHours(personData);
      const readonlyClass = userIsAdmin ? '' : ' readonly';

      bodyHtml += `<tr class="staff-row"><td class="name-cell">${name}</td>`;
      DAYS.forEach(day => {
        const shift = personData[day] || '';
        const colorClass = getShiftClass(shift);
        const displayShift = formatShiftDisplay(shift);
        bodyHtml += `<td class="shift-cell ${colorClass}${readonlyClass}" data-name="${name}" data-day="${day}" data-role="${role.id}">${displayShift}</td>`;
      });
      bodyHtml += `<td class="hours-cell">${weekHours > 0 ? weekHours.toFixed(1) : '-'}</td></tr>`;
    });
  });

  tbody.innerHTML = bodyHtml;

  // Attach cell click listeners
  if (userIsAdmin) {
    document.querySelectorAll('.shift-cell:not(.readonly)').forEach(cell => {
      cell.addEventListener('click', openShiftEditor);
    });
    document.querySelectorAll('.booking-input').forEach(input => {
      input.addEventListener('change', onBookingChange);
    });
  }

  runValidations();
}

function getStaffForRole(roleId) {
  const defaults = [...(DEFAULT_STAFF[roleId] || [])];
  // Add any support staff
  const supports = supportCounters[roleId] || 0;
  for (let i = 1; i <= supports; i++) {
    defaults.push(`Support ${i}`);
  }
  // Also include any names from Firestore that aren't in defaults
  if (rotaData.shifts) {
    Object.entries(rotaData.shifts).forEach(([name, data]) => {
      if (data.role === roleId && !defaults.includes(name)) {
        defaults.push(name);
      }
    });
  }
  return defaults;
}

function formatShiftDisplay(shift) {
  if (!shift) return '';
  // Extract tags
  const tagMatch = shift.match(/\((KT|TBC|COMM|REC)\)/gi);
  const timeStr = shift.replace(/\s*\([^)]*\)/g, '').trim();
  let html = timeStr;
  if (tagMatch) {
    tagMatch.forEach(tag => {
      html += `<span class="shift-tag">${tag.replace(/[()]/g,'')}</span>`;
    });
  }
  return html;
}

function addSupport(roleId) {
  if (!supportCounters[roleId]) supportCounters[roleId] = 0;
  supportCounters[roleId]++;
  renderTable();
}

// ═══════════════════════════════════════════════════════════════════
// SHIFT EDITOR POPUP
// ═══════════════════════════════════════════════════════════════════

let activeCell = null;
let activeTags = [];

function openShiftEditor(e) {
  const cell = e.currentTarget;
  activeCell = cell;
  const name = cell.dataset.name;
  const day = cell.dataset.day;
  const role = cell.dataset.role;
  const currentShift = (rotaData.shifts && rotaData.shifts[name] && rotaData.shifts[name][day]) || '';

  // Parse existing tags
  activeTags = [];
  const tagMatch = currentShift.match(/\((KT|TBC|COMM|REC)\)/gi);
  if (tagMatch) {
    tagMatch.forEach(t => activeTags.push(t.replace(/[()]/g, '').toUpperCase()));
  }
  const timeOnly = currentShift.replace(/\s*\([^)]*\)/g, '').trim();

  const popup = document.getElementById('shiftPopup');
  popup.innerHTML = `
    <div class="popup-title">${name} — ${DAY_LABELS[DAYS.indexOf(day)]}</div>
    <div class="quick-options">
      ${QUICK_SHIFTS.map(s => `<button class="quick-opt" data-shift="${s}">${s}</button>`).join('')}
    </div>
    <input class="custom-input" id="customShiftInput" placeholder="Custom (e.g. 10:00-22:00)" value="${timeOnly}">
    <div class="tag-options">
      ${TAGS.map(t => `<button class="tag-opt${activeTags.includes(t) ? ' active' : ''}" data-tag="${t}">(${t})</button>`).join('')}
    </div>
    <div class="popup-actions">
      <button class="btn-clear" onclick="clearShift()">Clear</button>
      <button class="btn-cancel" onclick="closePopup()">Cancel</button>
      <button class="btn-save" onclick="saveShift()">Save</button>
    </div>
  `;

  // Position popup near the cell
  const rect = cell.getBoundingClientRect();
  let top = rect.bottom + 4;
  let left = rect.left;
  if (top + 250 > window.innerHeight) top = rect.top - 250;
  if (left + 240 > window.innerWidth) left = window.innerWidth - 250;
  popup.style.top = top + 'px';
  popup.style.left = Math.max(10, left) + 'px';
  popup.style.display = 'block';

  // Quick option clicks
  popup.querySelectorAll('.quick-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('customShiftInput').value = btn.dataset.shift;
    });
  });

  // Tag toggle
  popup.querySelectorAll('.tag-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.includes(tag)) {
        activeTags = activeTags.filter(t => t !== tag);
        btn.classList.remove('active');
      } else {
        activeTags.push(tag);
        btn.classList.add('active');
      }
    });
  });

  // Close on outside click
  setTimeout(() => document.addEventListener('click', outsideClickHandler), 10);
}

function outsideClickHandler(e) {
  const popup = document.getElementById('shiftPopup');
  if (!popup.contains(e.target) && e.target !== activeCell) {
    closePopup();
  }
}

function closePopup() {
  document.getElementById('shiftPopup').style.display = 'none';
  document.removeEventListener('click', outsideClickHandler);
  activeCell = null;
  activeTags = [];
}

function saveShift() {
  if (!activeCell) return;
  const name = activeCell.dataset.name;
  const day = activeCell.dataset.day;
  const role = activeCell.dataset.role;
  const input = document.getElementById('customShiftInput').value.trim();

  let fullValue = input;
  if (activeTags.length > 0) {
    fullValue += ' ' + activeTags.map(t => `(${t})`).join(' ');
  }
  fullValue = fullValue.trim();

  // Update data
  if (!rotaData.shifts) rotaData.shifts = {};
  if (!rotaData.shifts[name]) rotaData.shifts[name] = { role: role };
  rotaData.shifts[name][day] = fullValue;

  closePopup();
  renderTable();
  saveToFirestore();
}

function clearShift() {
  if (!activeCell) return;
  const name = activeCell.dataset.name;
  const day = activeCell.dataset.day;
  const role = activeCell.dataset.role;

  if (rotaData.shifts && rotaData.shifts[name]) {
    delete rotaData.shifts[name][day];
  }

  closePopup();
  renderTable();
  saveToFirestore();
}

// ═══════════════════════════════════════════════════════════════════
// BOOKING CHANGE HANDLER
// ═══════════════════════════════════════════════════════════════════

function onBookingChange(e) {
  const day = e.target.dataset.day;
  const meal = e.target.dataset.meal;
  const value = parseInt(e.target.value) || 0;

  if (!rotaData.bookings) rotaData.bookings = {};
  if (!rotaData.bookings[day]) rotaData.bookings[day] = {};
  rotaData.bookings[day][meal] = value;

  saveToFirestore();
}

// ═══════════════════════════════════════════════════════════════════
// FIRESTORE OPERATIONS
// ═══════════════════════════════════════════════════════════════════

async function loadFromFirestore() {
  const docId = weekId(currentWeekStart);
  try {
    const doc = await db.collection('rota_weeks').doc(docId).get();
    if (doc.exists) {
      rotaData = doc.data();
      // Restore support counters from data
      supportCounters = {};
      if (rotaData.shifts) {
        Object.entries(rotaData.shifts).forEach(([name, data]) => {
          if (name.startsWith('Support ')) {
            const num = parseInt(name.replace('Support ', ''));
            if (!isNaN(num) && data.role) {
              supportCounters[data.role] = Math.max(supportCounters[data.role] || 0, num);
            }
          }
        });
      }
    } else {
      rotaData = {
        weekStart: docId,
        weekLabel: formatWeekLabel(currentWeekStart),
        bookings: {},
        shifts: {}
      };
    }
  } catch (err) {
    console.error('Load error:', err);
    rotaData = { weekStart: docId, weekLabel: formatWeekLabel(currentWeekStart), bookings: {}, shifts: {} };
  }
  renderTable();
}

async function saveToFirestore() {
  if (!userIsAdmin) return;
  const docId = weekId(currentWeekStart);
  const userName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0].replace(/\./g, ' ')) : 'Unknown';

  try {
    await db.collection('rota_weeks').doc(docId).set({
      weekStart: docId,
      weekLabel: formatWeekLabel(currentWeekStart),
      bookings: rotaData.bookings || {},
      shifts: rotaData.shifts || {},
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: userName
    }, { merge: true });
  } catch (err) {
    console.error('Save error:', err);
  }
}

// ═══════════════════════════════════════════════════════════════════
// WEEK NAVIGATION
// ═══════════════════════════════════════════════════════════════════

function updateWeekLabel() {
  document.getElementById('weekLabel').textContent = formatWeekLabel(currentWeekStart);
}

function prevWeek() {
  currentWeekStart.setDate(currentWeekStart.getDate() - 7);
  supportCounters = {};
  updateWeekLabel();
  loadFromFirestore();
}

function nextWeek() {
  currentWeekStart.setDate(currentWeekStart.getDate() + 7);
  supportCounters = {};
  updateWeekLabel();
  loadFromFirestore();
}

// ═══════════════════════════════════════════════════════════════════
// DUPLICATE WEEK
// ═══════════════════════════════════════════════════════════════════

async function duplicateWeek() {
  if (!userIsAdmin) return;
  if (!confirm('Copy this week\'s shifts to next week?')) return;

  const nextMonday = new Date(currentWeekStart);
  nextMonday.setDate(nextMonday.getDate() + 7);
  const nextId = weekId(nextMonday);
  const userName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0].replace(/\./g, ' ')) : 'Unknown';

  try {
    await db.collection('rota_weeks').doc(nextId).set({
      weekStart: nextId,
      weekLabel: formatWeekLabel(nextMonday),
      bookings: {},
      shifts: rotaData.shifts || {},
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: userName
    });
    alert('Week duplicated successfully! Navigate to next week to see it.');
  } catch (err) {
    console.error('Duplicate error:', err);
    alert('Failed to duplicate week.');
  }
}

// ═══════════════════════════════════════════════════════════════════
// EXPORT / PRINT VIEW
// ═══════════════════════════════════════════════════════════════════

function showExportView() {
  const overlay = document.getElementById('printOverlay');
  let html = `<h2>Restaurant Petrus — Staff Rota</h2>`;
  html += `<p class="print-sub">${formatWeekLabel(currentWeekStart)}</p>`;
  html += '<table><thead><tr><th>Staff</th>';
  DAYS.forEach((day, i) => {
    html += `<th>${DAY_LABELS[i]} ${getDayDate(currentWeekStart, i)}</th>`;
  });
  html += '<th>Hours</th></tr></thead><tbody>';

  // Bookings row
  html += '<tr style="background:#f5f5f5;font-weight:600;"><td>Bookings</td>';
  DAYS.forEach(day => {
    const b = (rotaData.bookings && rotaData.bookings[day]) || {};
    html += `<td>L:${b.lunch || '-'} / D:${b.dinner || '-'}</td>`;
  });
  html += '<td></td></tr>';

  ROLES.forEach(role => {
    html += `<tr style="background:#ddd;"><td colspan="${DAYS.length + 2}" style="font-weight:600;text-transform:uppercase;">${role.label}</td></tr>`;
    const staffList = getStaffForRole(role.id);
    staffList.forEach(name => {
      const personData = (rotaData.shifts && rotaData.shifts[name]) || { role: role.id };
      const weekHours = calcWeeklyHours(personData);
      html += `<tr><td style="text-align:left;">${name}</td>`;
      DAYS.forEach(day => {
        const shift = personData[day] || '';
        html += `<td>${shift}</td>`;
      });
      html += `<td style="font-weight:600;">${weekHours > 0 ? weekHours.toFixed(1) : '-'}</td></tr>`;
    });
  });

  html += '</tbody></table>';
  html += `<div class="print-actions">
    <button onclick="window.print()">🖨️ Print</button>
    <button onclick="closePrintView()">Close</button>
  </div>`;

  overlay.innerHTML = html;
  overlay.classList.add('active');
}

function closePrintView() {
  document.getElementById('printOverlay').classList.remove('active');
}

// ═══════════════════════════════════════════════════════════════════
// INITIALIZATION
// ═══════════════════════════════════════════════════════════════════

async function init() {
  // Wait for auth
  currentUser = await requireAuth();
  userIsAdmin = await isAdmin(currentUser);

  // Set up week navigation
  updateWeekLabel();
  document.getElementById('prevWeek').addEventListener('click', prevWeek);
  document.getElementById('nextWeek').addEventListener('click', nextWeek);
  document.getElementById('duplicateBtn').addEventListener('click', duplicateWeek);
  document.getElementById('exportBtn').addEventListener('click', showExportView);

  // Hide admin-only buttons if not admin
  if (!userIsAdmin) {
    document.getElementById('duplicateBtn').style.display = 'none';
  }

  // Load data
  await loadFromFirestore();
}

init();
</script>
