<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock — Petrus Sommeliers</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--grn:#5c1a1a;--grn2:#2d0a0a;--gld:#b89650;--crm:#faf7f1;--pink:#f8e8e8;--s:'Inter',sans-serif;--f:'Cormorant Garamond',serif}
body{font-family:var(--s);background:var(--crm);color:#2c2c2c;min-height:100vh}
.tb{background:var(--grn2);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.tb a{color:var(--gld);text-decoration:none;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.tb h2{font-family:var(--f);color:#fff;font-size:18px}
.pg{max-width:960px;margin:0 auto;padding:20px 14px 60px}
.pg>h1{font-family:var(--f);font-size:26px;color:var(--grn);margin-bottom:14px}
/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:6px 14px;border:1px solid rgba(92,26,26,0.2);border-radius:14px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;background:var(--pink);color:var(--grn);transition:all .15s}
.tab:hover{background:#f0d4d4;border-color:var(--grn)}
.tab.on{background:var(--grn);color:#fff;border-color:var(--grn)}
/* Layout */
.stock-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:700px){.stock-layout{grid-template-columns:1fr}}
.carousel-box{background:#fff;border:1px solid #e8e0d4;border-radius:8px;padding:14px}
.carousel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.carousel-header .c-title{font-family:var(--f);font-size:14px;color:var(--grn)}
.carousel-header .c-badge{font-size:9px;background:var(--grn);color:#fff;padding:2px 7px;border-radius:10px}
.carousel-nav{display:flex;gap:6px}
.carousel-nav span{cursor:pointer;font-size:14px;color:var(--gld);user-select:none;padding:0 4px}
.carousel-nav span:hover{color:var(--grn)}
.carousel-item{padding:6px 0;border-bottom:1px solid #f5f0ea;font-size:10px;display:flex;align-items:center;gap:6px}
.carousel-item:last-child{border-bottom:none}
.carousel-item .ci-name{flex:1;font-weight:500;color:var(--grn2)}
.carousel-item .ci-tag{font-size:8px;padding:1px 5px;border-radius:6px;font-weight:600}
.carousel-item .ci-tag.low{background:#fff3cd;color:#856404}
.carousel-item .ci-tag.t86{background:#f8d7da;color:#721c24}
.carousel-item .ci-date{font-size:8px;color:#999}
.expand-btn{display:inline-block;padding:4px 10px;border:1px solid rgba(92,26,26,0.2);border-radius:4px;font-size:8px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;background:var(--pink);color:var(--grn);margin-bottom:10px}
.expand-btn:hover{background:var(--grn);color:#fff}
.full-list{display:none}
.full-list.show{display:block}
/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:var(--grn2);color:#fff;padding:7px 8px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.tbl td{padding:6px 8px;border-bottom:1px solid #f5f0ea;vertical-align:middle}
.tbl tr:hover td{background:#fdf9f2}
.s-tag{font-size:8px;padding:2px 6px;border-radius:8px;text-transform:uppercase;font-weight:600;white-space:nowrap}
.s-tag.low{background:#fff3cd;color:#856404}
.s-tag.t86{background:#f8d7da;color:#721c24}
.s-tag.back{background:#d4edda;color:#155724}
.restock-btn{padding:3px 8px;background:var(--pink);color:var(--grn);border:1px solid rgba(92,26,26,0.2);border-radius:4px;font-size:8px;cursor:pointer}
.restock-btn:hover{background:var(--grn);color:#fff}
.s-remove{background:none;border:none;color:#ccc;font-size:12px;cursor:pointer}
.s-remove:hover{color:#c0392b}
/* Add form */
.add-box{background:#fff;border:1px solid #e8e0d4;border-radius:8px;padding:14px;margin-top:14px}
.add-box h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gld);margin-bottom:10px}
.fields{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.fields input,.fields select{padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:11px;font-family:var(--s);outline:none;flex:1;min-width:0}
.fields input[type="number"]{flex:0 0 50px}
.fields select{flex:0 0 auto}
.fields input:focus{border-color:var(--gld)}
.tag-opts{display:flex;gap:6px;margin-bottom:8px}
.tag-opt{padding:4px 10px;border:1px solid #ddd;border-radius:10px;font-size:9px;cursor:pointer;background:#fff;color:#666}
.tag-opt:hover{border-color:var(--grn);color:var(--grn)}
.tag-opt.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.qty-row{display:none;gap:6px;align-items:center;margin-bottom:8px}
.qty-row.show{display:flex}
.btn-add{padding:6px 18px;background:var(--grn);color:#fff;border:none;border-radius:4px;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.btn-add:hover{background:var(--grn2)}
.em{text-align:center;padding:14px;color:#ccc;font-size:11px}
.sm{position:fixed;bottom:20px;right:20px;background:var(--grn);color:var(--crm);padding:10px 16px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .3s;z-index:9999}
.sm.show{opacity:1}
</style>
</head>
<body>
<div class="tb"><a href="sommeliers.html">&larr; Back</a><h2>Petrus</h2><span></span></div>
<div class="pg">
<h1>Stock</h1>
<div class="tabs" id="tabs"></div>
<button class="expand-btn" id="expandBtn" onclick="toggleFullList()">View all details</button>
<div class="full-list" id="fullList"></div>
<div id="addArea"></div>
<div class="stock-layout">
  <div id="pending86"></div>
  <div id="pendingLow"></div>
</div>
</div>
<div class="sm" id="sm"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script>
var U=null;
var TAB='wine';
var TABS=['wine','bar','supplies','kitchen'];
var KITCHEN_ITEMS=['Ruby Port Cockburn','Madeira Blandys','Bacardi Rum 8y','Prosecco','Kirsh'];
var selTag='';

auth.onAuthStateChanged(function(u){
  if(!u){window.location.href='index.html';return;}
  U=u;logAccess(u,'page_view','somm-stock.html');
  loadStock();
});

// Render tabs immediately
renderTabs();renderAdd();

function setTab(t){TAB=t;renderTabs();renderPending();renderAdd();}

function renderTabs(){
  var h='';
  TABS.forEach(function(t){
    h+='<span class="tab'+(TAB===t?' on':'')+'" onclick="setTab(\''+t+'\')">'+t.charAt(0).toUpperCase()+t.slice(1)+'</span>';
  });
  document.getElementById('tabs').innerHTML=h;
}

// Load all active stock items (not restocked)
var stockItems=[];
function loadStock(){
  db.collection('somm_stock').where('restocked','==',false).get().then(function(snap){
    stockItems=[];
    snap.forEach(function(doc){stockItems.push({id:doc.id,data:doc.data()});});
    renderTabs();renderPending();renderAdd();
  }).catch(function(e){console.error(e);});
}

var carouselPage86=0;
var carouselPageLow=0;
var CAROUSEL_SIZE=10;

function renderPending(){
  var filtered=stockItems.filter(function(it){return it.data.section===TAB;});
  var items86=filtered.filter(function(it){return it.data.tag==='86';});
  var itemsLow=filtered.filter(function(it){return it.data.tag!=='86';});

  // Sort most recent first
  items86.sort(function(a,b){return b.data.date>a.data.date?1:b.data.date<a.data.date?-1:0;});
  itemsLow.sort(function(a,b){return b.data.date>a.data.date?1:b.data.date<a.data.date?-1:0;});

  var expandBtn=document.getElementById('expandBtn');
  var fullArea=document.getElementById('fullList');

  if(filtered.length===0){
    document.getElementById('pending86').innerHTML='';
    document.getElementById('pendingLow').innerHTML='';
    fullArea.innerHTML='';expandBtn.style.display='none';
    return;
  }
  expandBtn.style.display='inline-block';

  // 86 carousel
  document.getElementById('pending86').innerHTML=buildCarousel(items86,'86',carouselPage86,'86');
  // Low carousel
  document.getElementById('pendingLow').innerHTML=buildCarousel(itemsLow,'Low in Stock',carouselPageLow,'low');

  // Full detail list
  renderFullList(filtered,fullArea);
}

function buildCarousel(items,title,page,type){
  if(items.length===0)return '<div class="carousel-box"><div class="carousel-header"><span class="c-title">'+title+' <span class="c-badge">0</span></span></div><div class="em">None</div></div>';
  var totalPages=Math.ceil(items.length/CAROUSEL_SIZE);
  if(page>=totalPages)page=0;
  if(page<0)page=totalPages-1;
  if(type==='86')carouselPage86=page;else carouselPageLow=page;
  var start=page*CAROUSEL_SIZE;
  var pageItems=items.slice(start,start+CAROUSEL_SIZE);

  var h='<div class="carousel-box">';
  h+='<div class="carousel-header"><span class="c-title">'+title+' <span class="c-badge">'+items.length+'</span></span>';
  if(totalPages>1){
    h+='<div class="carousel-nav"><span onclick="carouselNav(\''+type+'\',-1)">&larr;</span><span style="font-size:9px;color:#999">'+(page+1)+'/'+totalPages+'</span><span onclick="carouselNav(\''+type+'\',1)">&rarr;</span></div>';
  }
  h+='</div>';
  for(var i=0;i<pageItems.length;i++){
    var it=pageItems[i].data;
    var tagCls=it.tag==='86'?'t86':'low';
    var tagLbl=it.tag==='86'?'86':'Low';
    h+='<div class="carousel-item">';
    h+='<span class="ci-date">'+it.date.slice(5)+'</span>';
    h+='<span class="ci-name">'+it.name+'</span>';
    if(it.location)h+='<span style="font-size:7px;color:#888">'+it.location+'</span>';
    h+='<span class="ci-tag '+tagCls+'">'+tagLbl+'</span>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function renderFullList(filtered,fullArea){
  var fh='<div style="background:#fff;border:1px solid #e8e0d4;border-radius:8px;padding:14px;margin-bottom:14px">';
  fh+='<table class="tbl"><thead><tr><th>Date</th><th>Product</th>';
  if(TAB==='wine')fh+='<th>Where</th>';
  if(TAB==='bar'||TAB==='kitchen')fh+='<th>Category</th>';
  fh+='<th>Tag</th><th>Qty</th><th>By</th><th>Restock</th><th></th></tr></thead><tbody>';
  for(var i=0;i<filtered.length;i++){
    var it=filtered[i].data;var id=filtered[i].id;
    fh+='<tr><td>'+it.date+'</td><td>'+it.name+'</td>';
    if(TAB==='wine')fh+='<td>'+(it.location||'')+'</td>';
    if(TAB==='bar'||TAB==='kitchen')fh+='<td>'+(it.category||'')+'</td>';
    var tagCls2=it.tag==='86'?'t86':'low';
    fh+='<td><span class="s-tag '+tagCls2+'">'+(it.tag==='86'?'86':'Low')+'</span></td>';
    fh+='<td>'+(it.qty?(it.qty+' '+(it.unit||'')):'—')+'</td>';
    fh+='<td>'+(it.author||'')+'</td>';
    fh+='<td><input type="date" id="redate_'+id+'" value="'+new Date().toISOString().slice(0,10)+'" style="font-size:9px;padding:2px 4px;border:1px solid #ddd;border-radius:3px;width:100px"><button class="restock-btn" onclick="restockItem(\''+id+'\')">✓ Back in stock</button> <button class="restock-btn" onclick="discontinueItem(\''+id+'\')" style="color:#721c24;border-color:#f8d7da">✗ No longer available</button></td>';
    fh+='<td><button class="s-remove" onclick="removeItem(\''+id+'\')">&times;</button></td>';
    fh+='</tr>';
  }
  fh+='</tbody></table></div>';
  fullArea.innerHTML=fh;
}

function carouselNav(type,dir){
  if(type==='86')carouselPage86+=dir;else carouselPageLow+=dir;
  renderPending();
}

function toggleFullList(){
  var el=document.getElementById('fullList');
  var btn=document.getElementById('expandBtn');
  if(el.classList.contains('show')){el.classList.remove('show');btn.textContent='View all details';}
  else{el.classList.add('show');btn.textContent='Hide details';}
}

function renderAdd(){
  var area=document.getElementById('addArea');
  var h='<div class="add-box"><h3>Add '+TAB+' stock alert</h3>';
  h+='<div class="fields">';
  h+='<input type="date" id="stk_date" value="'+new Date().toISOString().slice(0,10)+'" onchange="checkDay(this)" style="width:110px;flex:0 0 110px">';
  if(TAB==='wine'){
    h+='<input type="text" id="stk_name" placeholder="Product">';
  }else if(TAB==='bar'){
    h+='<input type="text" id="stk_cat" placeholder="Category">';
    h+='<input type="text" id="stk_name" placeholder="Product">';
  }else if(TAB==='supplies'){
    h+='<input type="text" id="stk_name" placeholder="Product">';
  }else if(TAB==='kitchen'){
    h+='<select id="stk_name"><option value="">Name...</option>';
    for(var k=0;k<KITCHEN_ITEMS.length;k++){h+='<option value="'+KITCHEN_ITEMS[k]+'">'+KITCHEN_ITEMS[k]+'</option>';}
    h+='<option value="__other">Other...</option></select>';
    h+='<input type="text" id="stk_name_other" placeholder="Other..." style="display:none">';
    h+='<input type="text" id="stk_note" placeholder="Notes (optional)">';
  }
  // Tag buttons inline
  h+='<span class="tag-opt'+(selTag==='low-stock'?' on':'')+'" onclick="pickTag(\'low-stock\',this)">Low in stock</span>';
  h+='<span class="tag-opt'+(selTag==='86'?' on':'')+'" onclick="pickTag(\'86\',this)">86</span>';
  // Wine 86: location + remove + assign ALL in same row
  if(TAB==='wine'){
    h+='<select id="stk_location" style="display:'+(selTag==='86'?'inline-block':'none')+'"><option value="">Where...</option><option value="BTG">BTG</option><option value="BTB">BTB</option><option value="BTG + BTB">BTG + BTB</option><option value="Wine Pairing">Wine Pairing</option><option value="Everywhere">Everywhere</option></select>';
    h+='<label style="font-size:8px;color:#888;display:'+(selTag==='86'?'flex':'none')+';align-items:center;gap:3px;cursor:pointer" id="removeLabel"><input type="checkbox" id="stk_remove_list">Remove from list</label>';
    h+='<select id="stk_assign" style="font-size:9px;padding:2px 5px;border:1px solid #ddd;border-radius:4px;display:'+(selTag==='86'?'inline-block':'none')+'"><option value="">Assign...</option><option value="Fiorella">Fiorella</option><option value="Christian">Christian</option><option value="Milena">Milena</option><option value="First in">First in</option></select>';
  }
  h+='</div>';
  h+='<div class="qty-row'+(selTag==='low-stock'?' show':'')+'" id="qtyRow"><input type="number" id="stk_qty" placeholder="Qty" style="flex:0 0 50px" min="0"><select id="stk_unit"><option value="uni">uni</option><option value="btl">btl</option></select></div>';
  // Low-stock + Wine: "Do we need to remove?" row
  if(TAB==='wine'){
    h+='<div class="qty-row'+(selTag==='low-stock'?' show':'')+'" id="removeRow" style="gap:8px;align-items:center;flex-wrap:wrap">';
    h+='<span style="font-size:9px;color:#666;font-weight:500">Do we need to remove?</span>';
    h+='<span class="tag-opt" id="removeYes" onclick="toggleRemoveOpt(true)" style="font-size:8px;padding:3px 8px">Yes</span>';
    h+='<span class="tag-opt" id="removeNo" onclick="toggleRemoveOpt(false)" style="font-size:8px;padding:3px 8px">No</span>';
    h+='<select id="stk_low_location" style="display:none;font-size:9px;padding:2px 5px;border:1px solid #ddd;border-radius:4px"><option value="">In...</option><option value="BTG">BTG</option><option value="BTB">BTB</option><option value="BTG + BTB">BTG + BTB</option><option value="Wine Pairing">Wine Pairing</option><option value="Everywhere">Everywhere</option></select>';
    h+='<select id="stk_low_assign" style="display:none;font-size:9px;padding:2px 5px;border:1px solid #ddd;border-radius:4px"><option value="">Assign...</option><option value="Fiorella">Fiorella</option><option value="Christian">Christian</option><option value="Milena">Milena</option><option value="First in">First in</option></select>';
    h+='</div>';
  }
  h+='<button class="btn-add" onclick="addItem()">Add</button>';
  h+='</div>';
  area.innerHTML=h;
  // Kitchen other toggle
  if(TAB==='kitchen'){
    var sel=document.getElementById('stk_name');
    if(sel)sel.onchange=function(){
      var o=document.getElementById('stk_name_other');
      if(o)o.style.display=sel.value==='__other'?'inline-block':'none';
    };
  }
}

var lowRemove=false;
function pickTag(tag,el){
  var opts=document.querySelectorAll('.tag-opt');
  for(var i=0;i<opts.length;i++){
    if(opts[i].id==='removeYes'||opts[i].id==='removeNo')continue;
    opts[i].classList.remove('on');
  }
  var loc=document.getElementById('stk_location');
  var rem=document.getElementById('removeLabel');
  var asgn=document.getElementById('stk_assign');
  var removeRow=document.getElementById('removeRow');
  if(selTag===tag){
    selTag='';lowRemove=false;
    document.getElementById('qtyRow').classList.remove('show');
    if(loc)loc.style.display='none';if(rem)rem.style.display='none';if(asgn)asgn.style.display='none';
    if(removeRow)removeRow.classList.remove('show');
  } else {
    el.classList.add('on');selTag=tag;lowRemove=false;
    if(tag==='low-stock'){
      document.getElementById('qtyRow').classList.add('show');
      if(loc)loc.style.display='none';if(rem)rem.style.display='none';if(asgn)asgn.style.display='none';
      if(removeRow)removeRow.classList.add('show');
    } else {
      document.getElementById('qtyRow').classList.remove('show');
      if(loc)loc.style.display='inline-block';if(rem)rem.style.display='flex';if(asgn)asgn.style.display='inline-block';
      if(removeRow)removeRow.classList.remove('show');
    }
  }
}

function toggleRemoveOpt(yes){
  lowRemove=yes;
  var yBtn=document.getElementById('removeYes');
  var nBtn=document.getElementById('removeNo');
  var locEl=document.getElementById('stk_low_location');
  var asgnEl=document.getElementById('stk_low_assign');
  if(yBtn)yBtn.classList.toggle('on',yes);
  if(nBtn)nBtn.classList.toggle('on',!yes);
  if(locEl)locEl.style.display=yes?'inline-block':'none';
  if(asgnEl)asgnEl.style.display=yes?'inline-block':'none';
}

function addItem(){
  var date=document.getElementById('stk_date').value;
  var author=U.displayName||U.email.split('@')[0].replace(/\./g,' ');
  var item={section:TAB,date:date,author:author,tag:selTag||'low-stock',restocked:false,restockedDate:'',qty:'',unit:'',name:'',producer:'',vintage:'',category:'',notes:'',location:''};

  if(TAB==='wine'){
    item.name=(document.getElementById('stk_name')||{}).value||'';
    if(selTag==='86'){
      item.location=(document.getElementById('stk_location')||{}).value||'';
    }
  }else if(TAB==='bar'){
    item.category=(document.getElementById('stk_cat')||{}).value||'';
    item.name=(document.getElementById('stk_name')||{}).value||'';
  }else if(TAB==='supplies'){
    item.name=(document.getElementById('stk_name')||{}).value||'';
  }else if(TAB==='kitchen'){
    var sel=document.getElementById('stk_name');
    item.name=sel?sel.value:'';
    if(item.name==='__other')item.name=(document.getElementById('stk_name_other')||{}).value||'';
    item.notes=(document.getElementById('stk_note')||{}).value||'';
  }
  if(!item.name){msg('Name required');return;}
  // Validation: Wine 86 must have "Where" selected
  if(TAB==='wine'&&selTag==='86'){
    var loc=(document.getElementById('stk_location')||{}).value;
    if(!loc){msg('Select where (BTG, BTB, etc.)');return;}
  }
  // Validation: Wine low-stock with "Remove=Yes" must have assign
  if(TAB==='wine'&&selTag==='low-stock'&&lowRemove){
    var lowAssignVal=(document.getElementById('stk_low_assign')||{}).value;
    if(!lowAssignVal){msg('Select who to assign the removal to');return;}
  }
  // Validation: Wine 86 with "Remove from list" checked must have assign
  if(TAB==='wine'&&selTag==='86'){
    var removeChk2=document.getElementById('stk_remove_list');
    if(removeChk2&&removeChk2.checked){
      var assignVal2=(document.getElementById('stk_assign')||{}).value;
      if(!assignVal2){msg('Select who to assign the removal to');return;}
    }
  }
  if(selTag==='low-stock'){
    item.qty=(document.getElementById('stk_qty')||{}).value||'';
    item.unit=(document.getElementById('stk_unit')||{}).value||'';
  }
  item.createdAt=firebase.firestore.FieldValue.serverTimestamp();
  db.collection('somm_stock').add(item).then(function(){
    // If Wine + 86: "Remove from Wine List" checkbox creates a task
    if(TAB==='wine'&&selTag==='86'){
      var removeChk=document.getElementById('stk_remove_list');
      if(removeChk&&removeChk.checked){
        var assignEl=document.getElementById('stk_assign');
        var assignee=assignEl?assignEl.value:'';
        db.collection('somm_duties').add({
          text:'Remove "'+item.name+'" from Wine List'+(item.location?' ('+item.location+')':''),
          author:author,assignee:assignee,date:date,done:false,
          createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }
    // If Wine + low-stock + "Yes" remove: create a task
    if(TAB==='wine'&&selTag==='low-stock'&&lowRemove){
      var lowLoc=(document.getElementById('stk_low_location')||{}).value||'';
      var lowAssign=(document.getElementById('stk_low_assign')||{}).value||'';
      db.collection('somm_duties').add({
        text:'Remove "'+item.name+'" from Wine List'+(lowLoc?' ('+lowLoc+')':''),
        author:author,assignee:lowAssign,date:date,done:false,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    selTag='';lowRemove=false;loadStock();msg('Added');
  }).catch(function(e){console.error(e);msg('Error');});
}

function restockItem(id){
  var dateEl=document.getElementById('redate_'+id);
  var restockDate=dateEl?dateEl.value:new Date().toISOString().slice(0,10);
  db.collection('somm_stock').doc(id).update({
    restocked:true,
    restockedDate:restockDate,
    restockedBy:U.displayName||U.email.split('@')[0].replace(/\./g,' ')
  }).then(function(){loadStock();msg('Back in stock ✓');});
}

function discontinueItem(id){
  db.collection('somm_stock').doc(id).update({
    restocked:true,
    discontinued:true,
    restockedDate:new Date().toISOString().slice(0,10),
    restockedBy:U.displayName||U.email.split('@')[0].replace(/\./g,' ')
  }).then(function(){loadStock();msg('Marked as no longer available');});
}

function removeItem(id){
  db.collection('somm_stock').doc(id).delete().then(function(){loadStock();msg('Removed');});
}

function msg(t){var el=document.getElementById('sm');el.textContent=t;el.className='sm show';setTimeout(function(){el.className='sm';},1800);}
function checkDay(el){var d=new Date(el.value+'T12:00:00').getDay();if(d===0||d===1){msg('Closed on Sun/Mon');el.value=new Date().toISOString().slice(0,10);}}
</script>
</body>
