<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings — Petrus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#5c1a1a;--green-dark:#2d0a0a;--gold:#b89650;--gold-light:#d4b87a;--cream:#faf7f1;--border:#e0d6c8;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter','Segoe UI',sans-serif}
body{font-family:var(--sans);background:var(--cream);color:#2c2c2c;line-height:1.5}
.topbar{background:var(--green-dark);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar a{color:var(--gold-light);text-decoration:none;font-size:13px;letter-spacing:1px}
.topbar .title{font-family:var(--serif);font-size:20px;color:var(--gold);letter-spacing:2px}
.page{max-width:1100px;margin:0 auto;padding:30px 24px 60px}
.page-header{text-align:center;margin-bottom:24px}
.page-header h1{font-family:var(--serif);font-size:2rem;color:var(--green-dark);letter-spacing:2px;margin-bottom:2px}
.page-header .label-bookings{font-size:0.7rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
</style>
<style>
/* Upload */
.upload-col{display:flex;flex-direction:column;gap:8px;max-width:420px;margin-bottom:16px}
.upload-print-row{display:flex;gap:10px;align-items:stretch}
.upload-box{flex:1;border:2px dashed var(--border);border-radius:8px;padding:12px 16px;background:white;cursor:pointer;transition:border-color 0.2s,background 0.2s;text-align:center;display:flex;align-items:center;justify-content:center}
.upload-box:hover{border-color:var(--gold);background:#fdf9f2}
.upload-box p{font-size:0.78rem;color:var(--green-dark);font-weight:500}
.upload-box input[type="file"]{display:none}
.upload-status{font-size:0.72rem;color:var(--gold);font-weight:500}
/* Print dropdown */
.print-menu{position:relative}
.print-main-btn{height:100%;border:1px solid #f0c0c0;background:#f8d7da;color:#5c1a1a;padding:0 22px;border-radius:8px;font-family:var(--sans);font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.print-main-btn:hover{background:#f0c0c0}
.print-options{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:white;border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,0.12);z-index:200;min-width:110px;overflow:hidden}
.print-options.open{display:block}
.print-size-group{padding:4px 0;border-bottom:1px solid var(--border)}
.print-size-group:last-child{border-bottom:none}
.print-size-label{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--gold);padding:6px 16px 3px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.print-size-label span{font-weight:500;color:#aaa;text-transform:none;letter-spacing:0}
.print-options button{display:inline-block;width:auto;text-align:left;border:none;background:white;padding:6px 14px;font-family:var(--sans);font-size:0.74rem;color:var(--green-dark);cursor:pointer;transition:background 0.15s}
.print-options button:hover{background:#f8d7da;color:#5c1a1a}
/* Saved list collapsible */
.saved-toggle{background:none;border:1px solid var(--border);border-radius:5px;padding:5px 12px;font-size:0.68rem;font-family:var(--sans);color:var(--green-dark);cursor:pointer;align-self:flex-start;text-align:left;transition:all 0.2s}
.saved-toggle:hover{border-color:var(--gold);background:#fdf9f2}
.saved-drawer{display:none;padding:6px 0 2px;text-align:left}
.saved-drawer.open{display:block}
.saved-item{display:inline-block;padding:4px 9px;font-size:0.66rem;font-family:var(--sans);background:white;border:1px solid var(--border);border-radius:4px 0 0 4px;cursor:pointer;color:var(--green-dark);transition:all 0.2s}
.saved-item:hover{border-color:var(--gold);color:var(--green)}
.saved-item-wrap{display:inline-flex;margin:3px 5px 3px 0}
.saved-item-delete{padding:4px 7px;font-size:0.78rem;font-family:var(--sans);background:#f5f0ea;border:1px solid var(--border);border-left:none;border-radius:0 4px 4px 0;cursor:pointer;color:#999;transition:all 0.2s}
.saved-item-delete:hover{background:#5c1a1a;color:white;border-color:#5c1a1a}
/* Header fields — all four on one line */
.header-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 14px;background:white;border:1px solid var(--border);border-radius:6px;margin-bottom:12px}
.lock-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:5px;font-family:var(--sans);font-size:0.82rem;text-align:center;margin-bottom:8px;outline:none;background:var(--cream)}
.lock-input:focus{border-color:var(--gold)}
.btn-unlock{padding:8px 20px;background:var(--green-dark);color:var(--gold-light);border:none;border-radius:5px;font-family:var(--sans);font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:background 0.2s}
.btn-unlock:hover{background:var(--green)}
.lock-error{margin-top:6px;font-size:0.72rem;color:#c0392b;min-height:16px}
.upload-box{border:2px dashed var(--border);border-radius:8px;padding:18px;background:white;cursor:pointer;transition:border-color 0.2s,background 0.2s}
.upload-box:hover{border-color:var(--gold);background:#fdf9f2}
.upload-box p{font-size:0.82rem;color:var(--green-dark);font-weight:500}
.upload-box input[type="file"]{display:none}
.upload-status{margin-top:8px;font-size:0.78rem;color:var(--gold);font-weight:500}
.saved-item{display:inline-block;padding:5px 10px;font-size:0.7rem;font-family:var(--sans);background:white;border:1px solid var(--border);border-radius:4px 0 0 4px;cursor:pointer;color:var(--green-dark);transition:all 0.2s}
.saved-item:hover{border-color:var(--gold);color:var(--green)}
.saved-item-wrap{display:inline-flex;margin:4px 6px 0 0}
.saved-item-delete{padding:5px 8px;font-size:0.8rem;font-family:var(--sans);background:#f5f0ea;border:1px solid var(--border);border-left:none;border-radius:0 4px 4px 0;cursor:pointer;color:#999;transition:all 0.2s}
.saved-item-delete:hover{background:#5c1a1a;color:white;border-color:#5c1a1a}
.sec-badge{font-size:0.65rem;font-weight:700;padding:2px 6px;border-radius:3px;cursor:pointer;border:none;font-family:var(--sans);letter-spacing:0.5px;transition:all 0.2s}
.sec-badge.s1{background:#2d7d46;color:white}
.sec-badge.s2{background:#1a4a7a;color:white}
.sec-badge.kt{background:#b89650;color:white}
.sec-badge.s0{background:#ccc;color:#666}
.star-badge{font-size:0.85rem;padding:1px 5px;border-radius:3px;cursor:pointer;border:1px solid var(--border);background:var(--cream);color:#ccc;font-family:var(--sans);transition:all 0.2s;min-width:22px;text-align:center}
.star-badge.active{background:#fff8e1;color:#d4a017;border-color:#d4a017}

/* Form */
.form-area{display:none}
.form-area.visible{display:block}
.field-group{display:flex;flex-direction:column;gap:3px}
.field-group label{font-size:0.6rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--green)}
.field-group input,.field-group select{padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-family:var(--sans);font-size:0.74rem;background:var(--cream)}

/* Table */
.reservations-container{background:white;border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:14px;overflow-x:auto}
.res-table-edit{width:100%;border-collapse:collapse;font-size:0.68rem;table-layout:auto}
.res-table-edit th{background:var(--green-dark);color:white;padding:5px 4px;text-align:left;font-size:0.55rem;text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap}
.res-table-edit td{padding:4px 3px;border-bottom:1px solid var(--border);vertical-align:middle}
.res-table-edit input,.res-table-edit select{padding:3px 5px;border:1px solid var(--border);border-radius:3px;font-size:0.66rem;font-family:var(--sans);background:var(--cream)}
.res-table-edit input.narrow{width:32px;min-width:28px}
.res-table-edit input.med{width:55px}
/* Fixed-width columns (short predictable content) */
.res-table-edit .r-time{width:62px;min-width:62px;max-width:62px}
.res-table-edit .r-pax{width:32px;min-width:32px;max-width:32px}
.res-table-edit .r-table{width:28px;min-width:28px;max-width:28px}
.res-table-edit .r-vvalue{width:48px;min-width:48px;max-width:48px}
/* Auto-sizing text inputs — min width set, grow with content */
.res-table-edit .r-name{min-width:100px;width:100px}
.res-table-edit .r-occpos{min-width:60px;width:60px}
.res-table-edit .r-vcode{min-width:72px;width:72px;white-space:nowrap}
.res-table-edit .r-notes{min-width:160px;width:160px}
/* Selects keep a fixed comfortable width */
.res-table-edit .r-occasion{min-width:90px;width:90px}
.res-table-edit .r-menu{min-width:88px;width:88px}
.res-table-edit .r-vprovider{min-width:72px;width:72px}
.res-table-edit .r-allergypos{min-width:60px;width:60px}
/* Allergy textarea grows vertically, fixed horizontal */
.res-table-edit .r-voucher{min-width:80px;width:80px}
.res-table-edit .r-allergy{min-width:140px;font-size:0.64rem;font-family:var(--sans);padding:3px 5px;border:1px solid var(--border);border-radius:3px;background:var(--cream);resize:vertical;line-height:1.3;width:100%;min-height:30px}
.res-table-edit .r-vprovider{width:80px;font-size:0.64rem}
.res-table-edit .r-notes{min-width:260px}
.res-table-edit .r-menu{min-width:95px}
.drag-handle{cursor:grab;color:#bbb;font-size:1rem;padding:0 4px;user-select:none}
.drag-handle:active{cursor:grabbing}
tr.dragging{opacity:0.4;background:#f0e8d8}
tr.drag-over td{border-top:2px solid var(--gold)}
.btn-remove-row{background:none;border:none;color:#ccc;font-size:1rem;cursor:pointer;padding:2px 5px}
.btn-remove-row:hover{color:var(--green)}
</style>
<style>
/* Actions */
.actions{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.btn{border:none;padding:9px 18px;border-radius:5px;font-family:var(--sans);font-weight:500;cursor:pointer;font-size:0.8rem;transition:background 0.2s}
.btn-add{background:var(--green);color:white}
.btn-add:hover{background:var(--green-dark)}
.btn-clear{background:#e8e3dc;color:#666}
.btn-clear:hover{background:#ddd6cc}

/* Print Index — hidden, only used for the full print options panel if needed */
.print-index{display:none}
.print-btn-row{display:flex;gap:8px;flex-wrap:wrap}
.print-btn-item{border:1px solid var(--border);background:var(--cream);padding:10px 20px;border-radius:5px;font-family:var(--sans);font-size:0.8rem;font-weight:500;cursor:pointer;transition:all 0.2s;color:var(--green-dark)}
.print-btn-item:hover{border-color:var(--gold);background:white;color:var(--green)}

/* Print area */
.print-area{display:none}
.print-page{width:100%;background:white;padding:6mm;font-size:7pt;line-height:1.2;page-break-after:always;page-break-inside:avoid}
.print-page h2{font-family:var(--serif);font-size:11pt;text-align:center;margin-bottom:0;color:var(--green-dark)}
.print-page .p-service{text-align:center;font-size:9pt;font-weight:700;margin-bottom:4px;color:var(--green)}
.print-header-info{display:flex;justify-content:space-between;border-bottom:1.5px solid var(--green-dark);padding-bottom:3px;margin-bottom:4px;font-weight:600;font-size:7pt}
.print-table{width:100%;border-collapse:collapse;font-size:6.5pt;table-layout:auto;empty-cells:show}
.print-table th{background:var(--green-dark);color:white;padding:2px 3px;text-align:left;font-weight:600;text-transform:uppercase;font-size:5.5pt;white-space:nowrap;border-right:0.5px solid rgba(255,255,255,0.3)}
.print-table th:last-child{border-right:none}
.print-table td{padding:2px 3px;border-bottom:1px solid #999;border-right:0.5px solid #ccc;vertical-align:top;white-space:nowrap;min-height:14px}
.print-table td:last-child{border-right:none}
.print-table td.col-time{white-space:nowrap}
.print-table td.col-pax{white-space:nowrap;width:3%}
.print-table td.col-name{white-space:nowrap}
.print-table td.col-pos{width:2%;white-space:nowrap}
.print-table td.col-tbl{width:3%;white-space:nowrap}
.print-table .allergy-cell{background:#f8d7da;color:#5c1a1a;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact;white-space:pre}
.print-table .notes-cell{white-space:normal;word-wrap:break-word;overflow-wrap:break-word;max-width:200px}
.print-table tr:nth-child(even){background:#f9f6f0}
.print-table .occasion-cell{background:#ffe4c4;color:#5c1a1a;-webkit-print-color-adjust:exact;print-color-adjust:exact;white-space:nowrap}
.menu-summary{margin-top:5px;padding:3px 8px;border:1.5px solid var(--gold);border-radius:3px;font-size:6.5pt;font-weight:600}
.menu-summary span{margin-right:10px}
.allergy-summary{margin-top:4px;padding:3px 8px;border:1.5px solid var(--green);border-radius:3px;font-size:6.5pt}
.allergy-summary-title{font-weight:700;color:var(--green);margin-bottom:2px;font-size:7pt}
.allergy-summary-table{width:100%;border-collapse:collapse;font-size:6pt}
.allergy-summary-table td{padding:1px 4px;border-bottom:0.5px solid var(--border)}

/* Print All - A4 quad layout */
.print-all-page{width:210mm;height:297mm;background:white;padding:0;margin:0}
.quad-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:100%;height:100%;gap:0}
.quad-cell{padding:4mm;font-size:6pt;line-height:1.2;border:0.5px dashed #ccc;overflow:hidden;position:relative}
.quad-cell:empty{border:none}
.quad-cell h2{font-family:var(--serif);font-size:9pt;text-align:center;margin-bottom:0;color:var(--green-dark)}
.quad-cell .p-service{text-align:center;font-size:7.5pt;font-weight:700;margin-bottom:3px;color:var(--green)}
.quad-cell .print-header-info{display:flex;justify-content:space-between;border-bottom:1px solid var(--green-dark);padding-bottom:2px;margin-bottom:3px;font-weight:600;font-size:5.5pt}
.quad-cell .print-table{font-size:5.5pt}
.quad-cell .print-table th{padding:1.5px 2px;font-size:4.5pt}
.quad-cell .print-table td{padding:1.5px 2px;font-size:5.5pt}
.quad-cell .menu-summary{font-size:5.5pt;padding:2px 5px;margin-top:3px}
.quad-cell .menu-summary span{margin-right:8px}
.quad-cell .allergy-summary{font-size:5.5pt;padding:2px 5px;margin-top:2px}
.quad-cell .allergy-summary-title{font-size:6pt}
.quad-cell .allergy-summary-table{font-size:5pt}
.quad-cell .allergy-summary-table td{padding:1px 3px}

/* Print Triple - divided in sections on page */
.print-triple-page{width:100%;background:white;padding:0;margin:0;box-sizing:border-box}
.triple-cell{padding:3mm 4mm;font-size:6.5pt;line-height:1.25;border-bottom:0.5px dashed #999;overflow:hidden;height:50%;box-sizing:border-box}
.triple-cell:last-child{border-bottom:none}
.triple-cell:empty{border-bottom:none;padding:0;height:0}
.triple-cell.page-break{page-break-before:always;border-bottom:none}
.triple-cell h2{font-family:var(--serif);font-size:10pt;text-align:center;margin-bottom:0;color:var(--green-dark)}
.triple-cell .p-service{text-align:center;font-size:8pt;font-weight:700;margin-bottom:3px;color:var(--green)}
.triple-cell .print-header-info{display:flex;justify-content:space-between;border-bottom:1px solid var(--green-dark);padding-bottom:2px;margin-bottom:3px;font-weight:600;font-size:6.5pt}
.triple-cell .print-table{font-size:6.5pt;width:100%;table-layout:auto;border-collapse:collapse}
.triple-cell .print-table th{padding:2px 3px;font-size:5.5pt;text-align:left;white-space:nowrap;background:none;color:#333;font-weight:700;border-bottom:1.5px solid #333;text-transform:uppercase}
.triple-cell .print-table td{padding:2px 3px;font-size:6.5pt;text-align:left;border-bottom:1px solid #999}
.triple-cell .menu-summary{font-size:6pt;padding:2px 5px;margin-top:4px}
.triple-cell .menu-summary span{margin-right:10px}
.triple-cell .allergy-summary{font-size:6pt;padding:2px 5px;margin-top:3px}
.triple-cell .allergy-summary-title{font-size:6.5pt}
.triple-cell .allergy-summary-table{font-size:5.5pt;width:100%;table-layout:auto}
.triple-cell .allergy-summary-table td{padding:1px 3px}

/* Station Sheet (highlighter grid per section) */
.station-page{width:100%;background:white;padding:4mm;box-sizing:border-box;page-break-after:always}
.station-page:last-child{page-break-after:auto}
.station-page h2{font-family:var(--serif);font-size:11pt;text-align:center;margin-bottom:0;color:var(--green-dark)}
.station-page .p-service{text-align:center;font-size:8pt;font-weight:700;margin-bottom:2px;color:var(--green);text-transform:uppercase;letter-spacing:1px}
.station-page .station-meta{text-align:center;font-size:7pt;color:#555;margin-bottom:5px}
.station-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:6.5pt}
.station-table th,.station-table td{border:0.75px solid #333;padding:2px 3px;text-align:center;vertical-align:middle;overflow:hidden}
.station-table .row-label{background:#efe7d8;font-weight:700;text-align:left;text-transform:uppercase;font-size:6pt;letter-spacing:0.3px;color:var(--green-dark);width:54px;white-space:nowrap}
.station-table .row-sublabel{font-weight:400;font-style:italic;text-transform:none;color:#666;font-size:6pt}
/* the option column (STILL/SPARK/TAP, BTG/BTB/PAIR/NA/NO) */
.station-table .opt-col{background:#f7f1e6;font-weight:600;text-align:left;text-transform:uppercase;font-size:5.5pt;letter-spacing:0.2px;color:#555;width:38px;white-space:nowrap}
.station-table .tbl-num{background:#f6e6d6;font-weight:700;font-size:9pt;color:var(--green-dark);height:20px}
.station-table .tbl-num.blank{background:#fafafa;color:#bbb}
.station-table .guest{font-size:6pt;font-weight:600;height:16px;white-space:nowrap}
.station-table .pax{font-size:6pt;color:#555;height:13px}
/* the highlight cells — empty boxes to mark by hand */
.station-table .mark{height:15px}
/* mark cells in option rows get a bit more height to highlight comfortably */
.station-table td.mark{height:16px}
</style>
<style>
@media print{
    body{background:white;padding:0;margin:0}
    .topbar,.page-header,.header-fields,.upload-col,.form-area,.print-index{display:none !important}
    .print-area{display:none !important}
    .print-area.print-active{display:block !important}
    .print-page{margin:0;padding:5mm}
    .print-all-page{margin:0;padding:0}
    .print-triple-page{margin:0;padding:0;width:100%;overflow:visible}
    .quad-cell{border:0.5px dashed #ddd}
    .triple-cell{border-bottom:0.5px dashed #ddd;overflow:hidden}
    .triple-cell:last-child{border-bottom:none}
    .triple-cell.page-break{page-break-before:always;border-bottom:none}
    .station-page{margin:0}
    /* @page size/margin is set dynamically per print target via #printOrientationStyle */
}
@media(max-width:700px){
    .header-fields{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="topbar">
    <a href="operations.html">&larr; Back</a>
    <span class="title">Petrus</span>
    <span></span>
</div>
<div class="page">
    <div class="page-header">
        <h1>Bookings</h1>
    </div>

    <!-- ROW 1: Service | Date | Covers | Tables all on one line -->
    <div class="header-fields">
        <div class="field-group">
            <label>Service</label>
            <select id="service"><option value="LUNCH">LUNCH</option><option value="DINNER">DINNER</option></select>
        </div>
        <div class="field-group">
            <label>Date</label>
            <input type="date" id="serviceDate">
        </div>
        <div class="field-group">
            <label>Covers</label>
            <input type="number" id="covers" min="0" placeholder="—">
        </div>
        <div class="field-group">
            <label>Tables</label>
            <input type="number" id="tables" min="0" placeholder="—">
        </div>
    </div>

    <!-- ROW 2: upload + print (left column) -->
    <div class="upload-col">
        <div class="upload-print-row">
            <div class="upload-box" onclick="document.getElementById('csvFile').click()">
                <p>&#8593; Upload CSV</p>
                <input type="file" id="csvFile" accept=".csv" onchange="handleCSV(event)">
            </div>
            <!-- Print dropdown: choose paper size, then target -->
            <div class="print-menu">
                <button class="print-main-btn" id="printMainBtn" onclick="togglePrintMenu()">Print ▾</button>
                <div class="print-options" id="printOptions">
                    <div class="print-size-group">
                        <div class="print-size-label">Statement <span>5.5×8.5"</span></div>
                        <button onclick="printBOH('statement');hidePrintMenu()">BOH</button>
                        <button onclick="printFOH('statement');hidePrintMenu()">FOH</button>
                        <button onclick="printStationSheet('statement');hidePrintMenu()">Station Sheet</button>
                    </div>
                    <div class="print-size-group">
                        <div class="print-size-label">A4 <span>178×243mm</span></div>
                        <button onclick="printBOH('a4');hidePrintMenu()">BOH</button>

<script>
document.getElementById('serviceDate').valueAsDate = new Date();

// === AUTO LOAD ===
autoLoadBooking();
document.getElementById('serviceDate').addEventListener('change', function() { updateSaveButton(); });
document.getElementById('service').addEventListener('change', function() { updateSaveButton(); });

// Salon sections
var SECTION_1_TABLES = ['1','2','3','4','5','6','7','8','18'];
var SECTION_2_TABLES = ['9','10','11','12','14','15','16','17'];
var KT_TABLES = ['800'];

// === NAME FORMATTING ===
function toTitleCase(str) {
    if (!str) return '';
    str = str.toLowerCase();
    // Capitalize after start, space, or hyphen
    str = str.replace(/(?:^|\s|-)\S/g, function(c) { return c.toUpperCase(); });
    // Capitalize after an apostrophe ONLY for prefixes like O'Brien / D'Angelo
    // (single letter before the apostrophe). Leave possessives like "Chris's" alone.
    str = str.replace(/(^|\s)([a-z])'(\w)/gi, function(m, pre, letter, next) {
        return pre + letter.toUpperCase() + "'" + next.toUpperCase();
    });
    return str;
}

// === CSV ===
function handleCSV(event) {
    var file = event.target.files[0];
    if (!file) return;
    // Try to extract date from filename
    // Format: MM-DD-YYYY (OpenTable US format, e.g. 06-08-2026 = August 6)
    var dateMatch = file.name.match(/(\d{2})-(\d{2})-(\d{4})/);
    if (dateMatch) {
        // MM-DD-YYYY → YYYY-MM-DD for input
        document.getElementById('serviceDate').value = dateMatch[3]+'-'+dateMatch[1]+'-'+dateMatch[2];
    }
    if (/dinner/i.test(file.name)) document.getElementById('service').value = 'DINNER';
    else if (/lunch/i.test(file.name)) document.getElementById('service').value = 'LUNCH';
    var reader = new FileReader();
    reader.onload = function(e) {
        var rows = parseCSV(e.target.result);
        var existingCount = document.querySelectorAll('#resBody tr').length;
        if (existingCount > 0) {
            // There's already data — offer to merge (keep manual edits) or replace
            var doMerge = confirm(
                'This service already has ' + existingCount + ' reservation(s).\n\n' +
                'OK = Merge (add new guests, update table/time/pax from CSV, keep your manual edits to notes, allergies, occasion, voucher).\n\n' +
                'Cancel = Replace everything with the CSV.'
            );
            if (doMerge) { mergeFromCSV(rows); return; }
        }
        populateFromCSV(rows);
        document.getElementById('uploadStatus').textContent = rows.length + ' reservations loaded';
    };
    reader.readAsText(file);
}

function parseCSV(text) {
    var lines = text.split('\n');
    var headers = parseCSVLine(lines[0]);
    var rows = [];
    for (var i = 1; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        var values = parseCSVLine(line);
        var row = {};
        headers.forEach(function(h, idx) {
            row[h.trim().replace(/"/g,'')] = (values[idx]||'').replace(/"/g,'').trim();
        });
        rows.push(row);
    }
    return rows;
}
function parseCSVLine(line) {
    var result = [], current = '', inQuotes = false;
    for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += c;
    }
    result.push(current);
    return result;
}

// === EXTRACTORS ===
function extractMenu(notes) {
    if (!notes) return '';
    var found = [];
    var pat = /Menu\s+([\w\s\u00C0-\u024F]+?)\s+at\s+P/gi;
    var m;
    while ((m = pat.exec(notes)) !== null) {
        var n = m[1].trim().toLowerCase();
        if (n.indexOf('prestige') >= 0) found.push('Prestige');
        else if (n.indexOf('discovery') >= 0) found.push('Discovery');
        else if (n.indexOf('la carte') >= 0 || n.indexOf('alc') >= 0) found.push('ALC');
        else if (n.indexOf('lunch') >= 0) found.push('Lunch Menu');
    }
    if (found.length === 0) {
        if (/\bPST\b/.test(notes) || /\bprestige\b/i.test(notes)) found.push('Prestige');
        if (/\bdiscovery\b/i.test(notes)) found.push('Discovery');
        if (/\bALC\b/.test(notes) || /[a\u00e0] la carte/i.test(notes) || /\bALC\s+Menu\b/i.test(notes) || /\bA la carte Menu\b/i.test(notes)) found.push('ALC');
        if (/\blunch menu\b/i.test(notes) || /\bLM\b/.test(notes)) found.push('Lunch Menu');
    }
    return found.filter(function(v,i,a){return a.indexOf(v)===i;}).join(', ');
}

function extractAllergies(notes) {
    if (!notes) return '';
    var hasNoDiet = /no diet/i.test(notes);
    var found = [];

    // First: try to capture compound expressions like "Pescatarian (Halal)" or "Vegetarian (no egg)"
    var compoundPatterns = [
        /(\bpescatarian\b|\bpesci\b|\bpesce\b|\bpesc\b)\s*\([^)]+\)/gi,
        /(\bvegetarian\b|\bveggie\b|\bveggy\b|\bveg\b)\s*\([^)]+\)/gi,
        /(\bvegan\b|\bvgn\b)\s*\([^)]+\)/gi,
        /(\bhalal\b)\s*\([^)]+\)/gi,
        /(\bkosher\b)\s*\([^)]+\)/gi,
        /(\bgluten\s*free\b|\bGF\b)\s*\([^)]+\)/gi,
        /(\bdairy\s*free\b|\bDF\b)\s*\([^)]+\)/gi
    ];
    var hasCompound = false;
    compoundPatterns.forEach(function(pat) {
        var matches = notes.match(pat);
        if (matches) {
            matches.forEach(function(m) {
                var normalized = m
                    .replace(/\bpesci\b|\bpesce\b|\bpesc\b/i, 'Pescatarian')
                    .replace(/\bveggie\b|\bveggy\b|\bveg\b/i, 'Vegetarian')
                    .replace(/\bvgn\b/i, 'Vegan');
                normalized = normalized.charAt(0).toUpperCase() + normalized.slice(1);
                if (found.indexOf(normalized) < 0) found.push(normalized);
                hasCompound = true;
            });
        }
    });

    // Capture "Nx [allergy]" patterns like "1x shellfish and peanuts allergy"
    var nxPattern = notes.match(/(\d+)\s*x\s+([\w\s]+?)(?:\s+allergy|\s+intolerance)?(?:\/|,|;|\.|$)/gi);
    if (nxPattern) {
        nxPattern.forEach(function(m) {
            var parts = m.match(/(\d+)\s*x\s+([\w\s]+?)(?:\s+allergy|\s+intolerance)?(?:\/|,|;|\.|$)/i);
            if (parts && parts[2]) {
                var items = parts[2].trim().split(/\s+and\s+|\s*&\s*/i);
                items.forEach(function(item) {
                    item = item.trim().replace(/\s+allergy$/i,'').replace(/\s+intolerance$/i,'');
                    if (item && !/^no\s*diet$/i.test(item)) {
                        var label = parts[1] + 'x ' + item.charAt(0).toUpperCase() + item.slice(1);
                        if (found.indexOf(label) < 0) found.push(label);
                    }
                });
            }
        });
    }

    // Standard single-keyword detection
    var patterns = [
        {r:/shellfish/i,l:'Shellfish'},
        {r:/peanut/i,l:'Peanut'},
        {r:/\bnut\b|nut allergy|nuts\b/i,l:'Nut'},
        {r:/gluten|coeliac|celiac|\bGF\b/i,l:'Gluten Free'},
        {r:/dairy|\bDF\b/i,l:'Dairy Free'},
        {r:/\bvegan\b|\bvgn\b/i,l:'Vegan'},
        {r:/\bvegetarian\b|\bveggie\b|\bveggy\b|\bveg\b/i,l:'Vegetarian'},
        {r:/\bpescatarian\b|\bpesci\b|\bpesce\b|\bpesc\b/i,l:'Pescatarian'},
        {r:/\bhalal\b/i,l:'Halal'},
        {r:/\bkosher\b/i,l:'Kosher'},
        {r:/lactose/i,l:'Lactose'},
        {r:/\begg\b|egg allergy/i,l:'Egg'},
        {r:/\bsoy\b|\bsoya\b/i,l:'Soy'},
        {r:/no pork/i,l:'No Pork'},
        {r:/\bprawn\b|prawn allergy/i,l:'Prawn'},
        {r:/\bcrab\b/i,l:'Crab'},
        {r:/\blobster\b/i,l:'Lobster'},
        {r:/\bsesame\b/i,l:'Sesame'},
        {r:/\bmustard\b/i,l:'Mustard'},
        {r:/\bsulphite\b|\bsulfite\b/i,l:'Sulphite'},
        {r:/\blupin\b/i,l:'Lupin'},
        {r:/\bmollusc\b|\bmollusk\b/i,l:'Mollusc'},
        {r:/\bwheat\b/i,l:'Wheat'},
        {r:/\bfish allergy\b/i,l:'Fish Allergy'}
    ];
    
    // Only add standard labels if not already covered by compound or Nx matches
    patterns.forEach(function(p) {
        if (p.r.test(notes)) {
            var alreadyCovered = found.some(function(f) {
                return f.toLowerCase().indexOf(p.l.toLowerCase()) >= 0 ||
                       f.toLowerCase().indexOf(p.l.split(' ')[0].toLowerCase()) >= 0;
            });
            if (!alreadyCovered) found.push(p.l);
        }
    });
    
    // Catch "does not eat X" / "doesn't eat X" / "cannot eat X"
    var m1 = notes.match(/(\d+|one|two|three)\s*(?:x\s*)?(?:guest|party|person|pax|of the party)?\s*(?:does not|doesn'?t|cannot|can'?t)\s+eat\s+([\w\s]+?)(?:\.|,|;|$)/gi);
    if (m1) {
        m1.forEach(function(match) {
            var numMatch = match.match(/^(\d+|one|two|three)/i);
            var foodMatch = match.match(/(?:eat)\s+([\w\s]+?)(?:\.|,|;|$)/i);
            if (foodMatch) {
                var num = numMatch ? numMatch[1] : '1';
                if (/one/i.test(num)) num = '1';
                if (/two/i.test(num)) num = '2';
                if (/three/i.test(num)) num = '3';
                var label = num + 'x does not eat ' + foodMatch[1].trim();
                if (found.indexOf(label) < 0) found.push(label);
            }
        });
    }
    if (!m1 || m1.length === 0) {
        var m2 = notes.match(/(?:does not|doesn'?t|cannot|can'?t)\s+eat\s+([\w\s]+?)(?:\.|,|;|$)/gi);
        if (m2) {
            m2.forEach(function(match) {
                var foodMatch = match.match(/(?:eat)\s+([\w\s]+?)(?:\.|,|;|$)/i);
                if (foodMatch) {
                    var label = 'Does not eat ' + foodMatch[1].trim();
                    if (found.indexOf(label) < 0) found.push(label);
                }
            });
        }
    }
    // "no beef" / "no lamb" style (but not "no diet")
    var noFood = notes.match(/\bno\s+(beef|lamb|pork|fish|seafood|chicken|meat|red meat|alcohol|onion|garlic|spice|mushroom|tomato|pepper|cream|butter|sugar)\b/gi);
    if (noFood) {
        noFood.forEach(function(nf) {
            var item = nf.replace(/^no\s+/i, '').trim();
            var label = 'No ' + item.charAt(0).toUpperCase() + item.slice(1).toLowerCase();
            if (found.indexOf(label) < 0) found.push(label);
        });
    }
    
    if (/FOOD & DRINK PREFERENCES:.*Allergy/i.test(notes) && found.length===0) found.push('Allergy (check notes)');
    if (hasNoDiet && found.length===0) return '';

    // Dedupe: exact case-insensitive duplicates
    var deduped = found.filter(function(v,i,a){
        return a.findIndex(function(x){ return x.toLowerCase() === v.toLowerCase(); }) === i;
    });

    // Remove entries that are redundant substrings of a richer entry.
    // e.g. "No Seafood" is redundant when "1x No seafood" is already present.
    deduped = deduped.filter(function(v){
        var vCore = v.toLowerCase().replace(/^\d+x\s*/, '').trim();
        return !deduped.some(function(other){
            if (other === v) return false;
            var oCore = other.toLowerCase().replace(/^\d+x\s*/, '').trim();
            // other is "richer" (has qty prefix or is longer) and contains v's core
            var otherHasQty = /^\d+x\s/i.test(other);
            var vHasQty = /^\d+x\s/i.test(v);
            if (oCore === vCore && otherHasQty && !vHasQty) return true; // drop the plain one
            return false;
        });
    });

    return deduped.join(', ');
}
function extractOccasion(notes) {
    if (!notes) return '';
    var occ = [];

    // First get detail from VISIT NOTES (usually more specific)
    var visitDetail = '';
    var vm = notes.match(/VISIT NOTES:\s*(.*?)(?=SPECIAL EVENTS|GENERAL NOTES|FOOD & DRINK|GUEST REQUESTS|\d{5,}|$)/i);
    if (vm) {
        var vt = vm[1];
        // "Keiko's birthday" / "John's 50th birthday"
        var vBday = vt.match(/([\w']+'s\s+(?:\d+\w*\s*)?birthday)/i);
        if (vBday) visitDetail = toTitleCase(vBday[1]);
        // "5-year wedding anniversary" / "wedding anniversary"
        var vAnniv = vt.match(/(\d+[\w-]*\s*(?:year\s+)?(?:wedding\s+)?anniversary)/i);
        if (!visitDetail && vAnniv) visitDetail = toTitleCase(vAnniv[1]);
        // "Raphael's birthday" style
        if (!visitDetail) {
            var vName = vt.match(/([\w]+'s)\s+(birthday|anniversary|celebration|engagement|graduation|retirement|promotion|honeymoon|wedding)/i);
            if (vName) visitDetail = toTitleCase(vName[1] + ' ' + vName[2]);
        }
        // Honeymoon / wedding without possessive name
        if (!visitDetail && /honeymoon/i.test(vt)) visitDetail = 'Honeymoon';
        if (!visitDetail && /wedding/i.test(vt) && !/anniversary/i.test(vt)) visitDetail = 'Wedding';
    }

    // Then check SPECIAL EVENTS field
    var sp = notes.match(/SPECIAL EVENTS:\s*(.*?)$/im);
    if (sp && sp[1].trim()) {
        var raw = sp[1].trim();

        // If it's just a generic label AND we have visit detail, use visit detail
        if (/^(birthday|anniversary|special occasion|celebration)\s*$/i.test(raw) && visitDetail) {
            occ.push(visitDetail);
        } else {
            // Try to extract specific detail from SPECIAL EVENTS itself
            // "50th Wedding Anniversary"
            var anniv = raw.match(/(\d+\w*\s*(?:wedding\s+)?anniversary)/i);
            if (anniv) { occ.push(toTitleCase(anniv[1])); }
            // "John's Birthday" / "John's 30th Birthday"
            else {
                var bday = raw.match(/([\w']+'s\s*(?:\d+\w*\s*)?birthday)/i);
                if (bday) { occ.push(toTitleCase(bday[0])); }
                else if (/birthday/i.test(raw)) {
                    // Generic "Birthday" - use visit detail if available
                    occ.push(visitDetail || 'Birthday');
                }
                else if (/anniversary/i.test(raw)) {
                    occ.push(visitDetail || 'Anniversary');
                }
            }
            // Congratulations with name
            if (/congratulations/i.test(raw)) {
                var congName = raw.match(/congratulations\s+(?:to\s+)?(\w+)/i);
                occ.push(congName ? 'Congrats ' + toTitleCase(congName[1]) : 'Congratulations');
            }
            // Other specific types
            if (/engagement/i.test(raw) && !occ.some(function(o){return /engagement/i.test(o);})) occ.push('Engagement');
            if (/promotion/i.test(raw) && !occ.some(function(o){return /promotion/i.test(o);})) occ.push('Promotion');
            if (/graduation/i.test(raw) && !occ.some(function(o){return /graduation/i.test(o);})) occ.push('Graduation');
            if (/retirement/i.test(raw) && !occ.some(function(o){return /retirement/i.test(o);})) occ.push('Retirement');
            if (/honeymoon/i.test(raw) && !occ.some(function(o){return /honeymoon/i.test(o);})) occ.push('Honeymoon');
            if (/wedding/i.test(raw) && !occ.some(function(o){return /wedding|anniversary/i.test(o);})) occ.push('Wedding');
            if (/proposal/i.test(raw) && !occ.some(function(o){return /proposal/i.test(o);})) occ.push('Proposal');
            if (/reunion/i.test(raw) && !occ.some(function(o){return /reunion/i.test(o);})) occ.push('Reunion');
            if (/farewell/i.test(raw) && !occ.some(function(o){return /farewell/i.test(o);})) occ.push('Farewell');
            if (/hen\s*(do|party|night)/i.test(raw)) occ.push('Hen Party');
            if (/stag\s*(do|party|night)/i.test(raw)) occ.push('Stag Party');
            if (/welcome/i.test(raw) && !occ.some(function(o){return /welcome/i.test(o);})) occ.push('Welcome');
            if (/baby\s*shower/i.test(raw)) occ.push('Baby Shower');
            if (/celebration/i.test(raw) && occ.length === 0) occ.push('Celebration');
            // "Special Occasion" generic — use visit detail or leave generic
            if (/special occasion/i.test(raw) && occ.length === 0) {
                occ.push(visitDetail || 'Special Occasion');
            }
            // Fallback: if nothing matched but there's meaningful text, use it
            if (occ.length === 0 && raw.length > 2) occ.push(toTitleCase(raw));
        }
    } else if (visitDetail) {
        // No SPECIAL EVENTS field but found detail in visit notes
        occ.push(visitDetail);
    }

    // Final fallback: scan the WHOLE notes for an occasion keyword when nothing
    // was captured from SPECIAL EVENTS or VISIT NOTES (e.g. it lives in
    // GUEST REQUESTS: "40th birthday present for my husband")
    if (occ.length === 0) {
        var scan = [
            {r:/\bbirthday\b/i, l:'Birthday'},
            {r:/\banniversary\b/i, l:'Anniversary'},
            {r:/\bengagement\b/i, l:'Engagement'},
            {r:/\bgraduation\b/i, l:'Graduation'},
            {r:/\bretirement\b/i, l:'Retirement'},
            {r:/\bhoneymoon\b/i, l:'Honeymoon'},
            {r:/\bproposal\b/i, l:'Proposal'},
            {r:/\bwedding\b/i, l:'Wedding'},
            {r:/\bbaby\s*shower\b/i, l:'Baby Shower'},
            {r:/\bcelebrat/i, l:'Celebration'}
        ];
        for (var si = 0; si < scan.length; si++) {
            if (scan[si].r.test(notes)) { occ.push(scan[si].l); break; }
        }
    }

    return occ.filter(function(v,i,a){return a.indexOf(v)===i;}).join(', ');
}

// Split occasion into type (Birthday, Anniversary, etc.) and detail (70th Linda, etc.)
function extractOccasionType(notes) {
    var full = extractOccasion(notes);
    if (!full) return '';
    // Known types
    var types = ['Birthday','Anniversary','Engagement','Promotion','Graduation','Retirement','Honeymoon','Wedding','Proposal','Reunion','Farewell','Hen Party','Stag Party','Welcome','Baby Shower','Celebration','Congratulations','Special Occasion'];
    var found = [];
    for (var i=0; i<types.length; i++) {
        if (full.toLowerCase().indexOf(types[i].toLowerCase()) >= 0) found.push(types[i]);
    }
    return found.length > 0 ? found.join(', ') : full;
}

function extractOccasionDetail(notes) {
    var full = extractOccasion(notes);
    if (!full) return '';

    // If the full string already contains a possessive name, extract it cleanly
    // e.g. "Kerry's Birthday" → "Kerry's", "70th Wedding Anniversary" → "70th"
    // e.g. "Amit's Birthday" → "Amit's"
    var nameMatch = full.match(/([\w']+'s)\s+/i);
    if (nameMatch) return nameMatch[1];

    // Relationship + optional age from the raw notes, e.g.
    // "40th birthday present for my husband" → "Husband's 40th"
    // "anniversary for my wife" → "Wife's"
    if (notes) {
        var relRe = /\b(husband|wife|partner|boyfriend|girlfriend|mum|mother|dad|father|son|daughter|sister|brother|friend|colleague|boss)\b/i;
        var rel = notes.match(relRe);
        if (rel) {
            var relWord = rel[1].charAt(0).toUpperCase() + rel[1].slice(1).toLowerCase();
            // Look for an ordinal age near the occasion word (e.g. 40th, 21st, 50th)
            var ageM = notes.match(/(\d+(?:st|nd|rd|th))\b/i);
            if (ageM) return relWord + "'s " + ageM[1].toLowerCase();
            return relWord + "'s";
        }
    }

    var numMatch = full.match(/(\d+[\w-]*)\s+/i);
    if (numMatch) return numMatch[1];

    var congMatch = full.match(/Congrats\s+(\w+)/i);
    if (congMatch) return congMatch[1];

    // No detail found in the derived occasion string — try to get a first name
    // from VISIT NOTES (e.g. "It's Amit's birthday") and combine with the type
    if (!notes) return '';
    var vm = notes.match(/VISIT NOTES:\s*(.*?)(?=SPECIAL EVENTS|GENERAL NOTES|FOOD & DRINK|GUEST REQUESTS|\d{5,}|$)/i);
    if (vm) {
        var vt = vm[1];
        // "Amit's birthday" → possessive name
        var vPoss = vt.match(/([\w]+'s)\s+(?:birthday|anniversary|celebration|engagement|graduation|retirement|wedding|proposal)/i);
        if (vPoss) return vPoss[1];
        // "birthday for Amit" / "anniversary for John"
        var vFor = vt.match(/(?:birthday|anniversary|celebration|engagement)\s+for\s+(\w+)/i);
        if (vFor) return toTitleCase(vFor[1]) + "'s";
        // "Celebrating Amit" style
        var vCelebrating = vt.match(/celebrating\s+(\w+)/i);
        if (vCelebrating) return toTitleCase(vCelebrating[1]) + "'s";
    }
    // Also check SPECIAL EVENTS for a name before a known occasion word
    var se = notes.match(/SPECIAL EVENTS:\s*(.*?)$/im);
    if (se) {
        var raw = se[1].trim();
        var sePoss = raw.match(/([\w]+'s)\s+(?:birthday|anniversary|celebration|engagement|graduation|retirement|wedding|proposal)/i);
        if (sePoss) return sePoss[1];
    }
    return '';
}

function extractVoucher(notes) {
    if (!notes) return '';
    var code = extractVoucherCode(notes);
    var val = extractVoucherValue(notes);
    if (code && val) return code + ' - ' + val;
    return code || val || '';
}

function extractVoucherCode(notes) {
    if (!notes) return '';
    var allMatches = notes.match(/[A-Za-z0-9]{7,}/g);
    if (!allMatches) return '';
    for (var i = 0; i < allMatches.length; i++) {
        var code = allMatches[i];
        var digitCount = (code.match(/\d/g) || []).length;
        var hasLetter = /[A-Za-z]/.test(code);
        var isWord = /^[A-Za-z]+$/.test(code);
        if (digitCount >= 5 && hasLetter && !isWord) {
            return cleanVoucherCode(code);
        }
    }
    return '';
}

// Strip a leading word (e.g. a name accidentally glued to the code like
// "Ramsay4378853JUTFH5" → "4378853JUTFH5"). The real code starts at the
// first block of digits.
function cleanVoucherCode(code) {
    // If the code starts with letters immediately followed by digits, and the
    // leading letter run looks like a word (>=3 letters), drop it.
    var m = code.match(/^([A-Za-z]{3,})(\d.*)$/);
    if (m) return m[2];
    return code;
}

function extractVoucherValue(notes) {
    if (!notes) return '';
    var valMatch = notes.match(/[£€]\s*(\d+)\/checked/i);
    if (valMatch) return valMatch[1];
    return '';
}

// Format a money value with a single £ symbol regardless of whether the
// stored value already includes one (prevents "££118").
function fmtMoney(val) {
    if (val === undefined || val === null) return '';
    var s = String(val).trim();
    if (!s) return '';
    s = s.replace(/^[£€\s]+/, '').trim(); // strip any leading currency symbols
    if (!s) return '';
    return '\u00a3' + s;
}

function extractNotes(notes) {
    if (!notes) return '';
    var parts = [];
    var gr = notes.match(/GUEST REQUESTS:\s*(.*?)(?=VISIT NOTES|SPECIAL EVENTS|GENERAL NOTES|\d{5,}|$)/i);
    if (gr && gr[1].trim()) {
        var req = gr[1].trim().replace(/Voucher:\s*\S+/i, '').trim();
        if (req) parts.push(req);
    }
    var raw = parts.join('; ');

    // Clean out anything already captured in other columns
    var hasVoucher = !!(extractVoucherCode(notes) || extractVoucherValue(notes));
    var hasAllergy = !!extractAllergies(notes);
    var hasOccasion = !!extractOccasion(notes);

    return cleanNotes(raw, hasVoucher, hasAllergy, hasOccasion);
}

// Remove sentences/phrases from the free-text notes that duplicate data
// already shown in the Voucher, Allergy, or Occasion columns.
function cleanNotes(text, hasVoucher, hasAllergy, hasOccasion) {
    if (!text) return '';

    // Split into sentence-like fragments so we can drop whole redundant ones
    var fragments = text.split(/(?:\.\s+|;\s*|\n)/);

    var kept = fragments.filter(function(frag) {
        var f = frag.trim();
        if (!f) return false;
        var low = f.toLowerCase();

        // Drop voucher-related lines if the voucher is already captured
        if (hasVoucher && /voucher|gift\s*card|redeem|experience\s+voucher|virgin\s+experience/i.test(low)) {
            // But keep it if it carries a real condition worth noting (e.g. expiry)
            if (!/valid until|expir|before the|day of this booking/i.test(low)) return false;
            return false; // expiry is not actionable for service; drop it
        }

        // Drop dietary/seafood lines already captured as an allergy
        if (hasAllergy && /(do(?:es)?n?'?t?\s+not\s+eat|cannot eat|can'?t eat|nothing from the sea|no seafood|no sea food|from the sea|allerg|intoleran|pescatarian|vegetarian|vegan)/i.test(low)) {
            return false;
        }

        // Drop occasion lines already captured (birthday/anniversary present etc.)
        if (hasOccasion && /(birthday|anniversary|engagement|graduation|retirement|honeymoon|wedding|proposal|celebration)\b.*(present|gift|surprise|celebrat|for (?:my|his|her|their))/i.test(low)) {
            return false;
        }

        return true;
    });

    return kept.join('. ').replace(/\.\s*\./g, '.').trim();
}

function populateFromCSV(rows) {

        addRow(time, pax, name, table, extractMenu(notesRaw), extractOccasionType(notesRaw), extractAllergies(notesRaw), extractNotes(notesRaw), '', '', '', extractVoucherCode(notesRaw), extractVoucherValue(notesRaw), extractOccasionDetail(notesRaw));

// Normalize a name for matching: lowercase, trim, collapse spaces, strip star
function normName(n) {
    return (n || '').toLowerCase().replace(/\u2605/g, '').replace(/\s+/g, ' ').trim();
}

// === MERGE FROM CSV (match by name) ===
// - Existing guest (same name): update table/time/pax/menu from CSV, keep the
//   manual fields (allergy, occasion detail+type, notes, section, star, voucher).
// - New guest: add a fresh cleaned row at the end.
// - Guest no longer in the CSV: kept as-is, reported for review.
function mergeFromCSV(rows) {
    // Index existing rows by normalized name
    var existingByName = {};
    document.querySelectorAll('#resBody tr').forEach(function(tr) {
        var nm = normName(tr.querySelector('.r-name').value);
        if (nm) existingByName[nm] = tr;
    });

    var csvNames = {};
    var added = 0, updated = 0;

    rows.forEach(function(row) {
        var time = row['TIME'] || '';
        var pax = parseInt(row['PARTY SIZE'] || row['PAX'] || '0');
        var name = toTitleCase(row['GUEST'] || row['NAME'] || '');
        var table = row['TABLE'] || '';
        var notesRaw = row['NOTES AND TAGS'] || '';
        var nm = normName(name);
        if (nm) csvNames[nm] = true;

        var tr = existingByName[nm];
        if (tr) {
            // Update only the CSV-driven fields; preserve manual edits
            var timeEl = tr.querySelector('.r-time');
            var paxEl = tr.querySelector('.r-pax');
            var tableEl = tr.querySelector('.r-table');
            var menuEl = tr.querySelector('.r-menu');
            var changedThis = false;
            if (time && timeEl.value !== time) { timeEl.value = time; changedThis = true; }
            if (pax && String(pax) !== paxEl.value) { paxEl.value = pax; changedThis = true; }
            if (table && tableEl.value.trim() !== table) {
                tableEl.value = table;
                updateSectionBadge(tableEl);
                changedThis = true;
            }
            // Menu: only fill if CSV has one and the cell is empty (don't overwrite a manual pick)
            var csvMenu = extractMenu(notesRaw);
            if (csvMenu && !menuEl.value) {
                var opt = Array.from(menuEl.options).find(function(o){ return o.value === csvMenu.split(', ')[0]; });
                if (opt) { menuEl.value = opt.value; changedThis = true; }
            }
            if (changedThis) updated++;
        } else {
            // New guest — add cleaned row
            addRow(time, pax, name, table, extractMenu(notesRaw), extractOccasionType(notesRaw), extractAllergies(notesRaw), extractNotes(notesRaw), '', '', '', extractVoucherCode(notesRaw), extractVoucherValue(notesRaw), extractOccasionDetail(notesRaw));
            added++;
        }
    });

    // Find existing guests no longer present in the CSV (possible cancellations)
    var removed = [];
    Object.keys(existingByName).forEach(function(nm) {
        if (!csvNames[nm]) {
            var nameVal = existingByName[nm].querySelector('.r-name').value.trim();
            if (nameVal) removed.push(nameVal);
        }
    });

    recalc();
    document.getElementById('formArea').classList.add('visible');
    updateSaveButton();

    var msg = 'Merged: ' + added + ' new, ' + updated + ' updated';
    if (removed.length) {
        msg += ' — ' + removed.length + ' no longer in CSV (kept): ' + removed.join(', ');
    }
    var status = document.getElementById('uploadStatus');
    status.textContent = msg;
}

// Toggle section badge manually (S1 → S2 → KT → S1)
function toggleSection(btn) {
    var currentSec = btn.textContent.trim();
    if (currentSec === 'S1') {
        btn.textContent = 'S2';
        btn.className = 'sec-badge s2';
    } else if (currentSec === 'S2') {
        btn.textContent = 'KT';
        btn.className = 'sec-badge kt';
    } else {
        btn.textContent = 'S1';
        btn.className = 'sec-badge s1';
    }
}

// Update section badge when table number is edited manually
function updateSectionBadge(tableInput) {
    var tr = tableInput.closest('tr');

    var tbl = tableInput.value.trim();
    if (KT_TABLES.indexOf(tbl) >= 0) {

    } else if (SECTION_2_TABLES.indexOf(tbl) >= 0) {
        btn.textContent = 'S2'; btn.className = 'sec-badge s2';

}

// Format allergy text with line breaks for print
function formatAllergyPrint(allergy) {
    if (!allergy) return '';
    return allergy.replace(/\n/g, '<br>').replace(/,\s*/g, '<br>');
}

// Format time with am/pm for print
function formatTimePrint(time, service) {
    if (!time) return '';
    // If already has am/pm, return as-is
    if (/am|pm/i.test(time)) return time;
    // Parse hour
    var match = time.match(/(\d{1,2}):(\d{2})/);
    if (!match) return time;
    var h = parseInt(match[1]);
    var m = match[2];
    // If 24h format (13-23), convert to 12h
    if (h >= 13) return (h-12)+':'+m+' pm';
    if (h === 12) return '12:'+m+' pm';
    if (h === 0) return '12:'+m+' am';
    // If 1-11, determine am/pm by service
    if (service === 'DINNER') return h+':'+m+' pm';
    if (service === 'LUNCH') {
        if (h >= 7 && h < 12) return h+':'+m+' am';
        return h+':'+m+' pm';
    }
    return h+':'+m+' pm';
}

// Helper: filter rows by section, respecting manual override
function filterBySection(rows, sectionNum) {
    var tables = sectionNum === 1 ? SECTION_1_TABLES : SECTION_2_TABLES;
    var secLabel = 'S' + sectionNum;
    return rows.filter(function(r) {
        if (r.section === 'S1') return sectionNum === 1;
        if (r.section === 'S2') return sectionNum === 2;
        return tables.indexOf(r.table) >= 0;
    });
}
function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// === DRAG TO REORDER ===
var dragRow = null;
function enableDrag(tr) {
    // Only start drag from the handle
    var handle = tr.querySelector('.drag-handle');
    if (handle) {
        handle.addEventListener('mousedown', function() { tr.draggable = true; });
        handle.addEventListener('mouseup', function() { tr.draggable = false; });
    }
    tr.addEventListener('dragstart', function(e) {
        dragRow = tr; tr.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
    });
    tr.addEventListener('dragend', function() {
        tr.classList.remove('dragging');
        tr.draggable = false;
        document.querySelectorAll('#resBody tr').forEach(function(r){r.classList.remove('drag-over');});
        dragRow = null;
    });
    tr.addEventListener('dragover', function(e) {
        e.preventDefault(); if (dragRow && dragRow !== tr) tr.classList.add('drag-over');
    });
    tr.addEventListener('dragleave', function() { tr.classList.remove('drag-over'); });
    tr.addEventListener('drop', function(e) {
        e.preventDefault(); tr.classList.remove('drag-over');
        if (dragRow && dragRow !== tr) {
            var tbody = document.getElementById('resBody');
            var rows = Array.from(tbody.querySelectorAll('tr'));
            var fromIdx = rows.indexOf(dragRow), toIdx = rows.indexOf(tr);
            if (fromIdx < toIdx) tbody.insertBefore(dragRow, tr.nextSibling);
            else tbody.insertBefore(dragRow, tr);
        }
    });
}
// === GATHER ALL ROWS DATA ===
function gatherRows() {

        el.classList.remove('print-active');
        el.style.display = 'none';
    });
    // Activate the target
    var target = document.getElementById(id);
    target.style.display = 'block';
    target.classList.add('print-active');
}

function setPrintOrientation(rows, cols) {
    // Remove any existing print-orientation style
    var existing = document.getElementById('printOrientationStyle');
    if (existing) existing.remove();
    
    // Hide other print areas when doing individual prints
    showPrintArea('printArea');
    
    // Determine orientation: FOH (cols >= 9) = landscape, BOH = portrait
    var useLandscape = cols >= 9;
    var pageSize = useLandscape ? '8.5in 5.5in' : '5.5in 8.5in';
    
    var style = document.createElement('style');
    style.id = 'printOrientationStyle';
    style.textContent = '@page{size:'+pageSize+';margin:2mm}';
    document.head.appendChild(style);
}

// Build every station page that applies for the day's bookings.
function buildAllStationPages(info, rows) {

    var kt = rows.filter(function(r) {
        return r.section === 'KT' || KT_TABLES.indexOf((r.table || '').trim()) >= 0;
    });

    if (s1.length > 0) pages.push(buildStationHTML(info, s1, 'SECTION 1'));
    if (s2.length > 0) pages.push(buildStationHTML(info, s2, 'SECTION 2'));
    if (kt.length > 0) pages.push(buildKTStationHTML(info, kt));
    return pages;
}

// Shared row builders for a station grid given a set of columns.
// A column is either a table object {label, guest, pax} or null (blank walk-in).
function stationRowBuilders(cols, headLabel) {
    var hl = headLabel || 'Table';
    function headRow() {
        var h = '<tr><th class="row-label">' + hl + '</th><th class="opt-col"></th>';
        cols.forEach(function(c) {
            if (c === null) h += '<td class="tbl-num blank">—</td>';
            else h += '<td class="tbl-num">' + esc(c.label) + '</td>';
        });
        return h + '</tr>';
    }
    function guestRow() {
        var h = '<tr><th class="row-label row-sublabel">Guest</th><th class="opt-col"></th>';
        cols.forEach(function(c) {
            h += '<td class="guest">' + esc(c ? (c.guest || '') : '') + '</td>';
        });
        return h + '</tr>';
    }
    function paxRow() {
        var h = '<tr><th class="row-label row-sublabel">Pax</th><th class="opt-col"></th>';
        cols.forEach(function(c) {
            h += '<td class="pax">' + (c && c.pax ? c.pax : '') + '</td>';
        });
        return h + '</tr>';
    }
    function markRow(label) {
        var h = '<tr><th class="row-label">' + label + '</th><th class="opt-col"></th>';
        cols.forEach(function() { h += '<td class="mark"></td>'; });
        return h + '</tr>';
    }
    function optionGroup(label, opts) {
        var out = '';
        opts.forEach(function(o, idx) {
            var h = '<tr>';
            if (idx === 0) h += '<th class="row-label" rowspan="' + opts.length + '">' + label + '</th>';
            h += '<th class="opt-col">' + o + '</th>';
            cols.forEach(function() { h += '<td class="mark"></td>'; });
            out += h + '</tr>';
        });
        return out;
    }
    return { headRow: headRow, guestRow: guestRow, paxRow: paxRow, markRow: markRow, optionGroup: optionGroup };
}

function stationPageWrap(info, sectionLabel, metaText, body) {
    return '<div class="station-page">' +
        '<h2>PETRUS</h2>' +
        '<div class="p-service">' + sectionLabel + ' \u2014 ' + info.service + '</div>' +
        '<div class="station-meta">' + info.dateStr + '  \u00b7  ' + metaText + '</div>' +
        '<table class="station-table">' + body + '</table>' +
    '</div>';
}

// Standard section station sheet (S1 / S2)
function buildStationHTML(info, sectionRows, sectionLabel) {
    var BLANK_WALKINS = 4;

    var byTable = {};
    sectionRows.forEach(function(r) {
        var t = (r.table || '').trim();
        if (!t) return;
        if (!byTable[t]) byTable[t] = { pax: 0, names: [] };
        byTable[t].pax += parseInt(r.pax) || 0;
        if (r.name) byTable[t].names.push(r.name.split(' ')[0]);
    });
    var tables = Object.keys(byTable).sort(function(a, b) {
        return (parseInt(a) || 0) - (parseInt(b) || 0);
    });

    var cols = tables.map(function(t) {
        return { label: t, guest: byTable[t].names.join(' / '), pax: byTable[t].pax };
    });
    for (var b = 0; b < BLANK_WALKINS; b++) cols.push(null);

    var R = stationRowBuilders(cols);
    var body = R.headRow() + R.guestRow() + R.paxRow()
        + R.markRow('Canapés')
        + R.optionGroup('Water', ['Still', 'Spark', 'Tap'])
        + R.optionGroup('Wine', ['BTG', 'BTB', 'Pair', 'NA', 'No']);

    return stationPageWrap(info, sectionLabel, tables.length + ' tables occupied', body);
}

// Kitchen Table station sheet: columns are seats P1..P[pax], no Canapés row.
function buildKTStationHTML(info, ktRows) {
    // Total covers on the Kitchen Table
    var seats = 0, names = [];
    ktRows.forEach(function(r) {
        seats += parseInt(r.pax) || 0;
        if (r.name) names.push(r.name.split(' ')[0]);
    });
    if (seats < 1) seats = ktRows.length || 1;

    var cols = [];
    for (var i = 1; i <= seats; i++) {
        cols.push({ label: 'P' + i, guest: '', pax: '' });
    }

    var R = stationRowBuilders(cols, 'Seat');
    // No guest/pax per-seat header (we don't know seat assignment) — just seat label.
    var body = R.headRow()
        + R.optionGroup('Water', ['Still', 'Spark', 'Tap'])
        + R.optionGroup('Wine', ['BTG', 'BTB', 'Pair', 'NA', 'No']);

    var meta = seats + ' covers' + (names.length ? ' \u00b7 ' + names.join(', ') : '');
    return stationPageWrap(info, 'KITCHEN TABLE', meta, body);
}

        if (r.allergy && r.allergy.trim()) allergyList.push({name:r.name||'Guest',table:r.table,pax:r.pax,allergies:r.allergy});
        var starName = (r.star ? '\u2605 ' : '') + esc(r.name);
        var occClass = r.occasion ? 'occasion-cell' : '';
        html += '<tr><td>'+formatTimePrint(r.time,info.service)+'</td><td>'+esc(r.pax)+'</td><td style="white-space:nowrap"><strong>'+starName+'</strong></td><td>'+esc(r.table)+'</td><td>'+esc(r.menu)+'</td><td class="'+occClass+'">'+esc(r.occasion)+'</td><td>'+esc(r.occasionPos||'')+'</td><td class="'+(r.allergy?'allergy-cell':'')+'">'+formatAllergyPrint(r.allergy)+'</td><td></td><td>'+esc(r.voucherProvider||'')+'</td><td>'+esc(r.voucherCode||r.voucher||'')+'</td><td>'+esc(fmtMoney(r.voucherValue))+'</td><td class="notes-cell">'+esc(r.notes)+'</td></tr>';
    });
    for (var i=0;i<3;i++) html += '<tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td></td><td></td><td></td></tr>';

    var mp = [];
    Object.keys(menuCount).forEach(function(n){if(menuCount[n]>0)mp.push('<span>'+n+': '+menuCount[n]+'</span>');});
    var menuHTML = mp.length ? '<div class="menu-summary">'+mp.join('')+'</div>' : '';

    var allergyHTML = '';
    if (allergyList.length) {
        var ar = allergyList.map(function(a){return '<tr><td><strong>'+esc(a.name)+'</strong></td><td>Tbl '+esc(a.table)+'</td><td class="allergy-cell">'+formatAllergyPrint(a.allergies)+'</td></tr>';}).join('');
        allergyHTML = '<div class="allergy-summary"><div class="allergy-summary-title">ALLERGIES</div><table class="allergy-summary-table">'+ar+'</table></div>';
    }

    return '<h2>PETRUS</h2><div class="p-service">RECEPTION \u2014 '+info.service+'</div><div class="print-header-info"><span>'+info.dateStr+'</span><span>Cvrs: '+info.covers+'</span><span>Tbls: '+info.tables+'</span></div><table class="print-table"><thead><tr><th>Time</th><th>Pax</th><th>Name</th><th>Tbl</th><th>Menu</th><th colspan="2">Occasion</th><th colspan="2">Allergy / Req</th><th colspan="3">Pre Payment</th><th>Notes</th></tr></thead><tbody>'+html+'</tbody></table>'+menuHTML+allergyHTML;
}

// === SAVE / LOAD BOOKINGS (Firestore) ===
function getBookingKey() {
    var date = document.getElementById('serviceDate').value;
    var service = document.getElementById('service').value;
    return date + '_' + service;
}

function saveBooking() {
    var key = getBookingKey();
    var data = {
        service: document.getElementById('service').value,
        date: document.getElementById('serviceDate').value,
        covers: document.getElementById('covers').value,
        tables: document.getElementById('tables').value,
        rows: gatherRows(),
        savedAt: new Date().toISOString(),
        savedBy: (auth.currentUser && auth.currentUser.displayName) || 'unknown'
    };
    document.getElementById('saveStatus').textContent = 'Saving...';
    db.collection('bookings').doc(key).set(data).then(function() {
        document.getElementById('saveStatus').textContent = 'Saved \u2713';
        setTimeout(function(){ document.getElementById('saveStatus').textContent = ''; }, 3000);
        updateSavedList();
        updateSaveButton();
    }).catch(function(err) {
        document.getElementById('saveStatus').textContent = 'Error: ' + err.message;
        console.error('Save error:', err);
    });
}

function updateSaveButton() {
    var key = getBookingKey();
    db.collection('bookings').doc(key).get().then(function(doc) {
        var btn = document.getElementById('saveBtn');
        if (doc.exists) {
            btn.textContent = 'Update';
            btn.style.background = '#5c1a1a';
        } else {
            btn.textContent = 'Save';
            btn.style.background = '#5c1a1a';
        }
    });
}

function loadBooking(key) {
    db.collection('bookings').doc(key).get().then(function(doc) {
        if (!doc.exists) return;
        var data = doc.data();
        document.getElementById('service').value = data.service;
        document.getElementById('serviceDate').value = data.date;
        document.getElementById('covers').value = data.covers;
        document.getElementById('tables').value = data.tables;
        var tbody = document.getElementById('resBody');
        tbody.innerHTML = '';
        data.rows.forEach(function(r) {
            addRow(r.time, r.pax, r.name, r.table, r.menu, r.occasion, r.allergy, r.notes, r.voucher||r.voucherCode||"", r.visits, r.allergyPos||"", r.voucherCode||r.voucher||"", r.voucherValue||"", r.occasionPos||"", r.star||"", r.voucherProvider||"");
        });
        document.getElementById('formArea').classList.add('visible');
        updateSaveButton();
    });
}

function updateSavedList() {
    var container = document.getElementById('savedList');
    var toggle = document.getElementById('savedToggle');
    if (!container) return;
    db.collection('bookings').orderBy('date', 'desc').limit(20).get().then(function(snapshot) {
        if (snapshot.empty) {
            container.innerHTML = '<span style="color:#999;font-size:0.68rem;padding:4px 0;display:block">No saved bookings</span>';
            if (toggle) toggle.textContent = 'Saved bookings ▾';
            return;
        }
        var html = '';
        snapshot.forEach(function(doc) {
            var data = doc.data();
            var dateObj = new Date(data.date + 'T00:00:00');
            var label = dateObj.toLocaleDateString('en-GB', {weekday:'short',day:'2-digit',month:'short'}) + ' \u2014 ' + data.service + ' (' + data.rows.length + ')';
            html += '<span class="saved-item-wrap">';
            html += '<button class="saved-item" onclick="loadBooking(\'' + doc.id + '\')">' + label + '</button>';
            html += '<button class="saved-item-delete" onclick="deleteBooking(\'' + doc.id + '\')" title="Delete">\u00d7</button>';
            html += '</span>';
        });
        container.innerHTML = html;
        if (toggle) toggle.textContent = 'Saved bookings (' + snapshot.size + ') ▾';
    });
}

function deleteBooking(key) {
    if (!confirm('Delete this saved booking?')) return;
    db.collection('bookings').doc(key).delete().then(function() {
        updateSavedList();
        updateSaveButton();
    });
}

function toggleSavedDrawer() {
    var drawer = document.getElementById('savedDrawer');
    var toggle = document.getElementById('savedToggle');
    var isOpen = drawer.classList.contains('open');
    drawer.classList.toggle('open', !isOpen);
    // Update arrow
    var text = toggle.textContent.replace(/[▾▴]/g, '').trim();
    toggle.textContent = text + (isOpen ? ' ▾' : ' ▴');
}

function togglePrintMenu() {
    document.getElementById('printOptions').classList.toggle('open');
}
function hidePrintMenu() {
    document.getElementById('printOptions').classList.remove('open');
}
// Close the print dropdown when clicking elsewhere
document.addEventListener('click', function(e) {
    var menu = document.querySelector('.print-menu');
    if (menu && !menu.contains(e.target)) hidePrintMenu();
});

// Auto-load if there's a saved booking for today's date and service
function autoLoad() {
    updateSavedList();
}

function autoLoadBooking() {
    var key = getBookingKey();
    db.collection('bookings').doc(key).get().then(function(doc) {
        if (doc.exists) {
            var data = doc.data();
            document.getElementById('service').value = data.service;
            document.getElementById('serviceDate').value = data.date;
            document.getElementById('covers').value = data.covers;
            document.getElementById('tables').value = data.tables;
            var tbody = document.getElementById('resBody');
            tbody.innerHTML = '';
            data.rows.forEach(function(r) {
                addRow(r.time, r.pax, r.name, r.table, r.menu, r.occasion, r.allergy, r.notes, r.voucher||r.voucherCode||"", r.visits, r.allergyPos||"", r.voucherCode||r.voucher||"", r.voucherValue||"", r.occasionPos||"", r.star||"", r.voucherProvider||"");
            });
            document.getElementById('formArea').classList.add('visible');
        }
        updateSaveButton();
        updateSavedList();
    });
}

// === FILE DRAG & DROP ===
var uploadBox = document.querySelector('.upload-box');
uploadBox.addEventListener('dragover', function(e){e.preventDefault();uploadBox.style.borderColor='var(--gold)';});
uploadBox.addEventListener('dragleave', function(){uploadBox.style.borderColor='var(--border)';});
uploadBox.addEventListener('drop', function(e){
    e.preventDefault(); uploadBox.style.borderColor='var(--border)';
    var file = e.dataTransfer.files[0];
    if (file && file.name.endsWith('.csv')) {
        document.getElementById('csvFile').files = e.dataTransfer.files;
        handleCSV({target:{files:[file]}});
    }
});

// Load saved booking on page load
autoLoad();

// === AUTO-SIZE INPUTS ===
// A hidden span mirrors the input font so we can measure text width accurately
var _sizer = document.createElement('span');
_sizer.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-size:0.66rem;font-family:Inter,"Segoe UI",sans-serif;padding:0 5px;pointer-events:none';
document.body.appendChild(_sizer);

var AUTO_SIZE_SELECTORS = ['.r-name', '.r-occpos', '.r-vcode', '.r-notes', '.r-allergypos'];
var AUTO_SIZE_MIN = { 'r-name': 100, 'r-occpos': 60, 'r-vcode': 72, 'r-notes': 160, 'r-allergypos': 60 };
var AUTO_SIZE_MAX = { 'r-name': 260, 'r-occpos': 200, 'r-vcode': 180, 'r-notes': 420, 'r-allergypos': 200 };

function measure(text) {
    _sizer.textContent = text || '';
    return _sizer.offsetWidth;
}

// Size every input in a column to match the WIDEST content in that column,
// so all rows share one uniform width per column.
function sizeColumn(cls) {
    var inputs = document.querySelectorAll('#resBody .' + cls);
    if (!inputs.length) return;
    var widest = AUTO_SIZE_MIN[cls] || 60;
    inputs.forEach(function(inp) {
        var w = measure(inp.value || inp.placeholder || '') + 12;
        if (w > widest) widest = w;
    });
    var maxW = AUTO_SIZE_MAX[cls] || 400;
    widest = Math.min(widest, maxW);
    inputs.forEach(function(inp) { inp.style.width = widest + 'px'; });
}

// Kept for callers that pass a single input — resize its whole column.
function sizeInput(input) {
    var cls = input.className.split(' ').find(function(c){ return c.indexOf('r-') === 0; });
    if (cls) sizeColumn(cls);
}

function sizeAllAutoInputs() {
    AUTO_SIZE_SELECTORS.forEach(function(sel) { sizeColumn(sel.replace('.', '')); });
}

// Delegate: listen on the tbody for any input event on auto-size fields
document.getElementById('resBody').addEventListener('input', function(e) {
    var input = e.target;
    if (AUTO_SIZE_SELECTORS.some(function(sel){ return input.matches(sel); })) {
        sizeInput(input);
    }
});

// Strip any leading £/€ the user types in the money field — the column is
// already labelled £, and this prevents a stored "£118" from doubling up.
document.getElementById('resBody').addEventListener('blur', function(e) {
    if (e.target && e.target.matches('.r-vvalue')) {
        e.target.value = e.target.value.replace(/^[£€\s]+/, '').trim();
    }
}, true);

// Re-size all after rows are loaded (autoLoadBooking / loadBooking call addRow)
// Patch addRow to size new inputs after insertion
var _origAddRow = addRow;
addRow = function() {
    _origAddRow.apply(this, arguments);
    // Size all columns after the DOM settles so widths stay uniform
    setTimeout(sizeAllAutoInputs, 0);
};
</script>
