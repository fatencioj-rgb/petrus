<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrus — Front of House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #5c1a1a;
  --green-dark: #2d0a0a;
  --gold: #b89650;
  --gold-light: #d4b87a;
  --cream: #faf7f1;
  --white: #ffffff;
  --text: #2c2c2c;
  --serif: 'Cormorant Garamond', 'Georgia', serif;
  --sans: 'Inter', 'Segoe UI', sans-serif;
}

body {
  font-family: var(--sans);
  background: var(--green-dark);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.container {
  text-align: center;
  max-width: 500px;
  width: 100%;
}

.logo { margin-bottom: 8px; }
.logo h1 {
  font-family: var(--serif);
  font-size: 52px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 4px;
  text-transform: uppercase;
}

.subtitle {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 300;
  color: var(--gold-light);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 50px;
  opacity: 0.85;
}

.divider {
  width: 60px;
  height: 1px;
  background: var(--gold);
  margin: 0 auto 40px;
  opacity: 0.5;
}

/* ── Navigation Buttons ───────────────────────────────────────── */
.nav-buttons {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.nav-btn {
  display: block;
  width: 100%;
  padding: 16px 24px;
  background: transparent;
  border: 1px solid rgba(184, 150, 80, 0.3);
  border-radius: 6px;
  color: var(--cream);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  text-decoration: none;
  transition: all 0.3s ease;
  cursor: pointer;
}

.nav-btn:hover {
  background: rgba(184, 150, 80, 0.1);
  border-color: var(--gold);
  color: var(--gold);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(184, 150, 80, 0.15);
}

.nav-btn:active { transform: translateY(0); }

/* ── User Status ──────────────────────────────────────────────── */
.user-status {
  margin-bottom: 30px;
  font-size: 12px;
  color: var(--gold-light);
  opacity: 0.8;
  display: none;
}

.user-status span { font-weight: 500; }

.user-status a {
  color: var(--gold-light);
  margin-left: 12px;
  opacity: 0.7;
  font-size: 11px;
  cursor: pointer;
}

.user-status a:hover { opacity: 1; }

/* ── Login Modal ──────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-box {
  background: var(--cream);
  border-radius: 12px;
  padding: 40px;
  text-align: center;
  min-width: 320px;
  max-width: 380px;
  width: 90%;
  box-shadow: 0 12px 60px rgba(0, 0, 0, 0.3);
  border: 1px solid var(--gold-light);
  transform: translateY(20px);
  transition: transform 0.3s ease;
}

.modal-overlay.active .modal-box {
  transform: translateY(0);
}

.modal-title {
  font-family: var(--serif);
  font-size: 24px;
  color: var(--green);
  margin-bottom: 24px;
}

.modal-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #d4b87a;
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 14px;
  text-align: center;
  outline: none;
  background: #fff;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}

.modal-input:focus {
  border-color: var(--green);
}

.modal-input::placeholder {
  color: #aaa;
}

.modal-error {
  color: #c0392b;
  font-size: 12px;
  margin-bottom: 12px;
  min-height: 18px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 8px;
}

.btn-primary {
  padding: 11px 32px;
  background: var(--green);
  color: var(--cream);
  border: none;
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-primary:hover { background: var(--green-dark); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-secondary {
  padding: 11px 32px;
  background: transparent;
  color: #888;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.2s;
}

.btn-secondary:hover { border-color: #aaa; color: #555; }

.footer {
  margin-top: 60px;
  font-size: 10px;
  color: rgba(184, 150, 80, 0.4);
  letter-spacing: 1px;
}

/* ── Notes panel (above the buttons) ───────────────────────────── */
#notesPanel { margin-bottom: 28px; text-align: left; }
.note-card {
  background: rgba(184,150,80,0.07);
  border: 1px solid rgba(184,150,80,0.28);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 10px;
}
.note-text { color: var(--cream); font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
.note-meta { display:flex; align-items:center; gap:8px; margin-top: 12px; flex-wrap: wrap; }
.note-pill {
  display:inline-block; font-size: 10px; letter-spacing: 0.5px;
  color: var(--green-dark); background: var(--gold-light);
  border-radius: 20px; padding: 3px 10px; opacity: 0.9;
}
.note-actions { margin-left:auto; display:flex; gap:8px; }
.note-actions button {
  background: transparent; border: 1px solid rgba(184,150,80,0.3);
  color: var(--gold-light); border-radius: 6px; padding: 4px 12px;
  font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase;
  cursor: pointer; transition: all .2s;
}
.note-actions button:hover { border-color: var(--gold); color: var(--gold); }
.note-actions button.del:hover { border-color:#e08a7a; color:#e08a7a; }
.note-empty { color: var(--gold-light); font-size: 12px; opacity: 0.6; text-align:center; padding: 6px 0; }
.note-editor { margin-top: 10px; }
.note-editor textarea {
  width:100%; min-height:60px; padding:12px 14px; border-radius:8px;
  border:1px solid rgba(184,150,80,0.3); background: rgba(0,0,0,0.15);
  color: var(--cream); font-family: var(--sans); font-size: 14px;
  outline:none; resize: vertical; line-height:1.5;
}
.note-editor textarea:focus { border-color: var(--gold); }
.note-editor-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
.note-add-btn {
  width:100%; background: transparent; border:1px dashed rgba(184,150,80,0.4);
  color: var(--gold-light); border-radius:8px; padding:10px; cursor:pointer;
  font-size:12px; letter-spacing:1px; text-transform:uppercase; transition:all .2s;
}
.note-add-btn:hover { border-color: var(--gold); color: var(--gold); }
.btn-save-note {
  background: var(--gold); color: var(--green-dark); border:none;
  border-radius:6px; padding:8px 18px; font-size:12px; letter-spacing:1px;
  text-transform:uppercase; font-weight:600; cursor:pointer;
}
.btn-cancel-note {
  background: transparent; color: var(--gold-light); border:1px solid rgba(184,150,80,0.3);
  border-radius:6px; padding:8px 18px; font-size:12px; letter-spacing:1px;
  text-transform:uppercase; cursor:pointer;
}

@media (max-width: 600px) {
  .logo h1 { font-size: 38px; }
  .subtitle { font-size: 11px; margin-bottom: 36px; }
  .nav-btn { padding: 14px 20px; font-size: 12px; }
  .modal-box { padding: 30px 24px; min-width: unset; }
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <h1>Petrus</h1>
  </div>
  <p class="subtitle">Front of House</p>

  <!-- User status (shown when logged in) -->
  <div class="user-status" id="userStatus">
    Logged in as <span id="userName"></span>
    <a onclick="handleLogout()">Logout</a>
  </div>

  <div class="divider"></div>

  <!-- Notes panel (shown above the buttons, visible to everyone) -->
  <div id="notesPanel" style="display:none;"></div>

  <!-- Navigation (hidden until logged in) -->
  <nav class="nav-buttons" id="navButtons" style="display:none;">
    <a href="training.html" class="nav-btn" data-section="training">Training</a>
    <a href="sommeliers.html" class="nav-btn" data-section="sommeliers">Sommeliers</a>
    <a href="operations.html" class="nav-btn" data-section="operations">Operations</a>
    <a href="admin.html" class="nav-btn" data-section="admin">Admin</a>
  </nav>

  <!-- Login prompt (shown when NOT logged in) -->
  <div id="loginPrompt" style="display:none;">
    <p style="color:var(--gold-light);font-size:13px;margin-bottom:24px;opacity:0.8;">Sign in to access the site</p>
    <form id="loginForm" onsubmit="return submitDirectLogin(event)" style="max-width:320px;margin:0 auto;display:flex;flex-direction:column;gap:12px;text-align:left;">
      <input type="text" id="directUser" placeholder="User" autocomplete="username" autocapitalize="none"
        style="width:100%;padding:14px 16px;background:transparent;border:1px solid rgba(184,150,80,0.3);border-radius:6px;color:var(--cream);font-family:var(--sans);font-size:14px;outline:none;">
      <input type="password" id="directCode" placeholder="Password" autocomplete="current-password"
        style="width:100%;padding:14px 16px;background:transparent;border:1px solid rgba(184,150,80,0.3);border-radius:6px;color:var(--cream);font-family:var(--sans);font-size:14px;outline:none;">
      <div id="directError" style="color:#e08a7a;font-size:12px;min-height:16px;"></div>
      <button type="submit" id="directBtn"
        style="width:100%;padding:14px 24px;background:var(--gold);color:var(--green-dark);border:none;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;">Enter</button>
      <p style="margin-top:16px;font-size:12px;color:#8a8a8a;text-align:center;line-height:1.5;">Lately I've been making some changes to the website that may affect your login. If you have any trouble, please contact me. — Fiorella</p>
    </form>
  </div>

  <div class="footer">
    &copy; 2026 — Internal Use Only
  </div>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <div class="modal-title">Team Login</div>
    <input type="text" class="modal-input" id="loginName" placeholder="Your name" autocomplete="off">
    <input type="password" class="modal-input" id="loginCode" placeholder="Personal code">
    <div class="modal-error" id="loginError"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="loginBtn" onclick="handleLogin()">Enter</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs (compat mode for simplicity with GitHub Pages) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>

<script>
// ── Page State ────────────────────────────────────────────────────
let pendingPage = null;

// ── Auth State Listener ───────────────────────────────────────────
auth.onAuthStateChanged((user) => {
  const status = document.getElementById('userStatus');
  const nav = document.getElementById('navButtons');
  const loginPrompt = document.getElementById('loginPrompt');
  const notesPanel = document.getElementById('notesPanel');

  if (user) {
    const displayName = user.displayName || user.email.split('@')[0].replace(/\./g, ' ');
    document.getElementById('userName').textContent = displayName;
    status.style.display = 'block';
    loginPrompt.style.display = 'none';
    logAccess(user, 'page_view', 'index.html');

    // All section buttons are shown to everyone. Access is enforced on the
    // target page itself (a restricted screen appears if not allowed).
    nav.style.display = 'flex';
    nav.querySelectorAll('.nav-btn').forEach(btn => { btn.style.display = 'block'; });

    // Notes panel: visible to everyone; editing controls appear for managers.
    notesPanel.style.display = 'block';
    initNotes(user);
  } else {
    status.style.display = 'none';
    nav.style.display = 'none';
    notesPanel.style.display = 'none';
    loginPrompt.style.display = 'block';
  }
});

// ── Modal Functions ───────────────────────────────────────────────
function quickLogin(name){
  document.getElementById('loginModal').classList.add('active');
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginName').value = name;
  document.getElementById('loginName').style.display = 'none';
  document.getElementById('loginCode').value = '';
  setTimeout(() => document.getElementById('loginCode').focus(), 100);
}

function openModal() {
  document.getElementById('loginModal').classList.add('active');
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginName').value = '';
  document.getElementById('loginName').style.display = 'block';
  document.getElementById('loginCode').value = '';
  setTimeout(() => document.getElementById('loginName').focus(), 100);
}

function closeModal() {
  document.getElementById('loginModal').classList.remove('active');
  document.getElementById('loginName').style.display = 'block';
}

async function handleLogin() {
  const name = document.getElementById('loginName').value.trim();
  const code = document.getElementById('loginCode').value;
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  if (!name || !code) {
    errorEl.textContent = 'Please enter your name and code.';
    return;
  }

  btn.disabled = true;
  btn.textContent = '...';
  errorEl.textContent = '';

  const result = await petrusLogin(name, code);

  btn.disabled = false;
  btn.textContent = 'Enter';

  if (result.success) {
    closeModal();
  } else {
    errorEl.textContent = result.error;
  }
}

async function handleLogout() {
  await petrusLogout();
}

// ── Direct login (user + password on the intro screen) ────────────
async function submitDirectLogin(event) {
  if (event) event.preventDefault();
  const user = document.getElementById('directUser').value.trim();
  const code = document.getElementById('directCode').value;
  const errorEl = document.getElementById('directError');
  const btn = document.getElementById('directBtn');

  if (!user || !code) {
    errorEl.textContent = 'Enter your user and password.';
    return false;
  }

  btn.disabled = true;
  btn.textContent = '...';
  errorEl.textContent = '';

  const result = await petrusLogin(user, code);

  btn.disabled = false;
  btn.textContent = 'Enter';

  if (!result.success) {
    errorEl.textContent = result.error;
  }
  return false;
}

// ── Keyboard shortcuts ────────────────────────────────────────────
document.getElementById('loginCode').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleLogin();
});
document.getElementById('loginName').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginCode').focus();
});
document.getElementById('loginModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('loginModal')) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ══ Notes panel ═══════════════════════════════════════════════════
// Everyone signed-in can read. Fiorella & Milena can add/edit.
// Only Fiorella can delete. Each note shows a subtle author · date pill.
let NOTES_USER = null;
function isManager(user){ return user && (user.email==='fiorella@petrus.local' || user.email==='milena@petrus.local'); }
function isFiorella(user){ return user && user.email==='fiorella@petrus.local'; }
function escNote(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(ts){
  try {
    const d = ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : null);
    if(!d) return '';
    return d.toLocaleDateString(undefined, { day:'numeric', month:'short' });
  } catch(e){ return ''; }
}

function initNotes(user){
  NOTES_USER = user;
  renderNotes();
}

function renderNotes(){
  const panel = document.getElementById('notesPanel');
  const manager = isManager(NOTES_USER);
  const canDelete = isFiorella(NOTES_USER);
  db.collection('notes').orderBy('createdAt','desc').get().then(snap => {
    let html = '';
    if(snap.empty){
      html += '<div class="note-empty">No notes right now.</div>';
    } else {
      snap.forEach(doc => {
        const n = doc.data();
        const when = fmtDate(n.updatedAt || n.createdAt);
        const author = escNote(n.author || 'Team');
        const pill = `<span class="note-pill">${author}${when ? ' · ' + when : ''}</span>`;
        const actions = (manager || canDelete) ? `<div class="note-actions">
            ${manager ? `<button onclick="editNote('${doc.id}')">Edit</button>` : ''}
            ${canDelete ? `<button class="del" onclick="deleteNote('${doc.id}')">Delete</button>` : ''}
          </div>` : '';
        html += `<div class="note-card">
          <div class="note-text">${escNote(n.text||'')}</div>
          <div class="note-meta">${pill}${actions}</div>
        </div>`;
      });
    }
    // Managers get an "add note" control at the bottom.
    if(manager){
      html += `<button class="note-add-btn" id="noteAddBtn" onclick="showNoteEditor()">+ Add note</button>
        <div class="note-editor" id="noteEditor" style="display:none;">
          <textarea id="noteInput" placeholder="Write a note for the team…"></textarea>
          <div class="note-editor-actions">
            <button class="btn-cancel-note" onclick="cancelNoteEditor()">Cancel</button>
            <button class="btn-save-note" id="noteSaveBtn" onclick="saveNewNote()">Save</button>
          </div>
        </div>`;
    }
    panel.innerHTML = html;
  }).catch(err => {
    panel.innerHTML = '<div class="note-empty">Could not load notes.</div>';
    console.error('notes load error', err);
  });
}

function showNoteEditor(){
  document.getElementById('noteAddBtn').style.display = 'none';
  const ed = document.getElementById('noteEditor');
  ed.style.display = 'block';
  ed.removeAttribute('data-edit-id');
  document.getElementById('noteInput').value = '';
  document.getElementById('noteInput').focus();
}
function cancelNoteEditor(){
  renderNotes();
}

function saveNewNote(){
  const ed = document.getElementById('noteEditor');
  const text = document.getElementById('noteInput').value.trim();
  if(!text) return;
  const editId = ed.getAttribute('data-edit-id');
  const author = (NOTES_USER.displayName) || NOTES_USER.email.split('@')[0].replace(/\./g,' ');
  const authorName = author.charAt(0).toUpperCase() + author.slice(1);
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const btn = document.getElementById('noteSaveBtn');
  btn.disabled = true; btn.textContent = '…';
  let op;
  if(editId){
    op = db.collection('notes').doc(editId).update({ text, author: authorName, authorEmail: NOTES_USER.email, updatedAt: now });
  } else {
    op = db.collection('notes').add({ text, author: authorName, authorEmail: NOTES_USER.email, createdAt: now, updatedAt: now });
  }
  op.then(() => renderNotes())
    .catch(err => { btn.disabled=false; btn.textContent='Save'; alert('Could not save: ' + err.message); });
}

function editNote(id){
  db.collection('notes').doc(id).get().then(doc => {
    if(!doc.exists) return;
    showNoteEditor();
    const ed = document.getElementById('noteEditor');
    ed.setAttribute('data-edit-id', id);
    document.getElementById('noteInput').value = doc.data().text || '';
    document.getElementById('noteInput').focus();
  });
}

function deleteNote(id){
  if(!confirm('Delete this note?')) return;
  db.collection('notes').doc(id).delete().then(() => renderNotes())
    .catch(err => alert('Could not delete: ' + err.message));
}
</script>
</body>
</html>
