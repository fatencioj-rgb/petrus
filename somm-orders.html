<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Log — Petrus Sommeliers</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--grn:#5c1a1a;--grn2:#2d0a0a;--gld:#b89650;--crm:#faf7f1;--pink:#f8e8e8;--s:'Inter',sans-serif;--f:'Cormorant Garamond',serif}
body{font-family:var(--s);background:var(--crm);color:#2c2c2c;min-height:100vh}
.tb{background:var(--grn2);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.tb a{color:var(--gld);text-decoration:none;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.tb h2{font-family:var(--f);color:#fff;font-size:18px}
.pg{max-width:800px;margin:0 auto;padding:20px 14px 60px}
.pg>h1{font-family:var(--f);font-size:26px;color:var(--grn);margin-bottom:4px}
.dr{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.dr input[type="date"]{padding:6px 10px;border:1px solid var(--gld);border-radius:5px;font-family:var(--s);font-size:12px}
.dr .dl{font-size:11px;color:#888;flex:1}
.dr .bt{padding:4px 10px;border:1px solid var(--gld);border-radius:4px;background:transparent;color:var(--grn);font-size:9px;cursor:pointer;text-transform:uppercase}
.dr .bt:hover{background:var(--gld);color:#fff}
.wa-btn{width:28px;height:28px;border-radius:50%;background:#25D366;border:none;cursor:pointer;font-size:11px;color:#fff}
.wa-btn:hover{background:#1da851}
/* View toggle */
.view-tog{display:flex;border:1px solid rgba(92,26,26,0.2);border-radius:4px;overflow:hidden;margin-bottom:16px;width:fit-content}
.view-tog button{padding:5px 16px;border:none;font-size:9px;font-family:var(--s);font-weight:600;cursor:pointer;background:var(--pink);color:var(--grn);letter-spacing:.5px}
.view-tog button.on{background:var(--grn);color:#fff}
/* Summary cards */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
@media(max-width:550px){.summary-grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e8e0d4;border-radius:8px;padding:14px}
.card-title{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--gld);margin-bottom:8px;font-weight:600}
.card-count{font-family:var(--f);font-size:28px;color:var(--grn)}
.card-sub{font-size:10px;color:#999;margin-top:2px}
.card-list{margin-top:8px;font-size:11px}
.card-list div{padding:3px 0;border-bottom:1px solid #f9f5ef;display:flex;align-items:center;gap:6px}
.card-list div:last-child{border-bottom:none}
.card-list .name{flex:1}
.card-list .tag{font-size:8px;padding:1px 5px;border-radius:6px;font-weight:600}
.tag-low{background:#fff3cd;color:#856404}
.tag-86{background:#f8d7da;color:#721c24}
.tag-ok{background:#d4edda;color:#155724}
/* Weekly */
.week-header{font-family:var(--f);font-size:16px;color:var(--grn);margin-bottom:12px}
.week-section{background:#fff;border:1px solid #e8e0d4;border-radius:8px;padding:14px;margin-bottom:10px}
.week-section h4{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--gld);margin-bottom:8px;font-weight:600}
.week-section .w-item{padding:4px 0;border-bottom:1px solid #f9f5ef;font-size:11px;display:flex;gap:8px;align-items:center}
.week-section .w-item:last-child{border-bottom:none}
.week-section .w-date{font-size:9px;color:#999;min-width:45px}
.week-section .w-name{flex:1}
.week-section .w-meta{font-size:9px;color:#888}
/* Closed day */
.closed-msg{background:var(--pink);border:1px solid rgba(92,26,26,0.15);border-radius:8px;padding:24px;text-align:center;color:var(--grn);font-family:var(--f);font-size:18px;margin-bottom:18px}
/* Notes */
.nt{background:#fff;border:1px solid #e8e0d4;border-radius:8px;padding:12px;margin-bottom:14px}
.nt label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#999;display:block;margin-bottom:3px}
.nt textarea{width:100%;padding:7px;border:1px solid #ddd;border-radius:5px;font-family:var(--s);font-size:11px;outline:none;resize:vertical;min-height:60px}
.nt textarea:focus{border-color:var(--gld)}
.sv{padding:8px 18px;background:var(--grn);color:#fff;border:none;border-radius:4px;font-size:10px;cursor:pointer;text-transform:uppercase}
.sv:hover{background:var(--grn2)}
.sm{position:fixed;bottom:20px;right:20px;background:var(--grn);color:var(--crm);padding:10px 16px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .3s;z-index:9999}
.sm.show{opacity:1}
</style>
</head>
<body>
<div class="tb"><a href="sommeliers.html">&larr; Back</a><h2>Petrus</h2><span></span></div>
<div class="pg">
<h1>Daily Log</h1>
<div class="dr">
  <input type="date" id="dp">
  <span class="dl" id="dl"></span>
  <button class="bt" onclick="goToday()">Today</button>
  <button class="wa-btn" onclick="share()" title="WhatsApp">📤</button>
</div>
<div id="summaryArea"></div>
<div class="nt" id="notesSection">
  <label>Notes</label>
  <textarea id="notesField" oninput="saveNotes()"></textarea>
</div>
<button class="sv" onclick="share()">Share on WhatsApp</button>
</div>
<div class="sm" id="sm"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script>
var U=null,TODAY=new Date().toISOString().slice(0,10);
var dp=document.getElementById('dp');dp.value=TODAY;dp.max=TODAY;
var stockItems=[],delivItems=[],wastItems=[],dutyItems=[],notes='';

// Block Sundays(0) and Mondays(1)
function isBlocked(dateStr){
  var d=new Date(dateStr+'T12:00:00');
  var day=d.getDay();
  return day===0||day===1;
}

function goToday(){dp.value=TODAY;load();}

// Validate date on change
dp.addEventListener('change',function(){
  if(isBlocked(dp.value)){
    var area=document.getElementById('summaryArea');
    area.innerHTML='<div class="closed-msg">Restaurant closed on Sundays &amp; Mondays</div>';
    document.getElementById('notesSection').style.display='none';
    return;
  }
  document.getElementById('notesSection').style.display='block';
  load();
});

auth.onAuthStateChanged(function(u){
  if(!u){window.location.href='index.html';return;}
  U=u;logAccess(u,'page_view','somm-orders.html');
  load();
});

function load(){
  var date=dp.value;
  var dd=new Date(date+'T12:00:00');
  document.getElementById('dl').textContent=dd.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  // Load all data for today
  Promise.all([
    db.collection('somm_stock').where('restocked','==',false).get(),
    db.collection('somm_deliveries').where('date','==',date).get(),
    db.collection('somm_wastages').where('date','==',date).get(),
    db.collection('somm_duties').where('done','==',false).get(),
    db.collection('somm_daily_notes').doc(date).get()
  ]).then(function(results){
    stockItems=[];results[0].forEach(function(doc){stockItems.push(doc.data());});
    delivItems=[];results[1].forEach(function(doc){delivItems.push(doc.data());});
    wastItems=[];results[2].forEach(function(doc){wastItems.push(doc.data());});
    dutyItems=[];results[3].forEach(function(doc){dutyItems.push(doc.data());});
    var noteDoc=results[4];
    notes=noteDoc.exists?noteDoc.data().text:'';
    document.getElementById('notesField').value=notes;
    render();
  }).catch(function(e){console.error(e);});
}

function render(){
  var h='<div class="summary-grid">';
  // Stock alerts
  h+='<div class="card"><div class="card-title">Stock Alerts</div>';
  h+='<div class="card-count">'+stockItems.length+'</div>';
  h+='<div class="card-sub">pending items</div>';
  if(stockItems.length>0){h+='<div class="card-list">';
    var show=stockItems.slice(0,5);
    for(var i=0;i<show.length;i++){var s=show[i];
      var tcls=s.tag==='86'?'tag-86':'tag-low';
      h+='<div><span class="name">'+s.name+'</span><span class="tag '+tcls+'">'+(s.tag==='86'?'86':'Low')+'</span></div>';
    }
    if(stockItems.length>5)h+='<div style="color:#999;font-size:9px">+'+(stockItems.length-5)+' more</div>';
    h+='</div>';}
  h+='</div>';

  // Deliveries today
  h+='<div class="card"><div class="card-title">Deliveries Today</div>';
  h+='<div class="card-count">'+delivItems.length+'</div>';
  h+='<div class="card-sub">received</div>';
  if(delivItems.length>0){h+='<div class="card-list">';
    var dshow=delivItems.slice(0,5);
    for(var d=0;d<dshow.length;d++){var di=dshow[d];
      var st=di.asInvoice?'<span class="tag tag-ok">✓</span>':di.changed?'<span class="tag tag-86">⚠</span>':'';
      h+='<div><span class="name">'+di.name+'</span>'+st+'</div>';
    }
    h+='</div>';}
  h+='</div>';

  // Wastages today
  h+='<div class="card"><div class="card-title">Wastages Today</div>';
  h+='<div class="card-count">'+wastItems.length+'</div>';
  h+='<div class="card-sub">logged</div>';
  if(wastItems.length>0){h+='<div class="card-list">';
    var wshow=wastItems.slice(0,5);
    for(var w=0;w<wshow.length;w++){h+='<div><span class="name">'+wshow[w].name+'</span><span style="font-size:9px;color:#888">'+wshow[w].qty+' '+wshow[w].unit+'</span></div>';}
    h+='</div>';}
  h+='</div>';

  // Duties pending
  h+='<div class="card"><div class="card-title">Duties Pending</div>';
  h+='<div class="card-count">'+dutyItems.length+'</div>';
  h+='<div class="card-sub">to do</div>';
  if(dutyItems.length>0){h+='<div class="card-list">';
    var dtshow=dutyItems.slice(0,5);
    for(var dt=0;dt<dtshow.length;dt++){h+='<div><span class="name">'+dtshow[dt].text+'</span><span style="font-size:9px;color:var(--grn)">'+(dtshow[dt].assignee||'')+'</span></div>';}
    h+='</div>';}
  h+='</div>';

  h+='</div>';
  document.getElementById('summaryArea').innerHTML=h;
}

var noteTimer=null;
function saveNotes(){
  if(noteTimer)clearTimeout(noteTimer);
  noteTimer=setTimeout(function(){
    var date=dp.value;
    var text=document.getElementById('notesField').value;
    db.collection('somm_daily_notes').doc(date).set({text:text,date:date,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).then(function(){msg('Saved');});
  },1000);
}

function share(){
  var date=dp.value;var dd=new Date(date+'T12:00:00');
  var ds=dd.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  var txt='*Petrus Sommeliers — '+ds+'*\n';
  if(stockItems.length){txt+='\n_Stock Alerts ('+stockItems.length+')_\n';stockItems.forEach(function(s){txt+='• '+s.name+' ['+s.tag+'] — '+s.author+'\n';});}
  if(delivItems.length){txt+='\n_Deliveries ('+delivItems.length+')_\n';delivItems.forEach(function(d){var l='• '+d.name+' x'+d.qty+' ['+d.supplier+']';if(d.changed)l+=' ⚠ '+d.changeType+': '+d.changeDetail;txt+=l+' — '+d.author+'\n';});}
  if(wastItems.length){txt+='\n_Wastages ('+wastItems.length+')_\n';wastItems.forEach(function(w){txt+='• '+w.name+' ('+w.qty+' '+w.unit+') — '+w.author+'\n';});}
  if(dutyItems.length){txt+='\n_Duties ('+dutyItems.length+')_\n';dutyItems.forEach(function(d){txt+='• '+d.text+(d.assignee?' → '+d.assignee:'')+'\n';});}
  var n=document.getElementById('notesField').value;
  if(n)txt+='\n*Notes:* '+n;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}

function msg(t){var el=document.getElementById('sm');el.textContent=t;el.className='sm show';setTimeout(function(){el.className='sm';},1800);}
</script>
</body>
</html>
