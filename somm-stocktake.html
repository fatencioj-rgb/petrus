<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stocktake — Petrus Sommeliers</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#5c1a1a;--green-dark:#2d0a0a;--gold:#b89650;--gold-light:#d4b87a;--cream:#faf7f1;--sans:'Inter',sans-serif;--serif:'Cormorant Garamond',serif}
body{font-family:var(--sans);background:var(--cream);color:#2c2c2c;min-height:100vh}
.top-bar{background:var(--green-dark);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.top-bar a{color:var(--gold);text-decoration:none;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.top-bar a:hover{color:#fff}
.top-bar h2{font-family:var(--serif);color:#fff;font-size:18px;margin:0}
.page{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
.page-title{font-family:var(--serif);font-size:28px;color:var(--green);margin-bottom:20px;text-align:center}

/* Tabs */
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.tab-btn{padding:10px 24px;border:2px solid var(--green);border-radius:6px;background:transparent;color:var(--green);font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
.tab-btn:hover{background:var(--green);color:#fff}
.tab-btn.active{background:var(--green);color:#fff}

/* Controls */
.controls{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px;padding:16px;background:#fff;border:1px solid #e8e0d4;border-radius:8px}
.ctrl-group{display:flex;flex-direction:column;gap:4px}
.ctrl-group label{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:#888;font-weight:500}
.ctrl-group select,.ctrl-group input[type="date"]{padding:8px 12px;border:1px solid #ddd;border-radius:5px;font-family:var(--sans);font-size:13px;outline:none}
.ctrl-group select:focus,.ctrl-group input[type="date"]:focus{border-color:var(--gold)}
.upload-area{margin-left:auto;display:flex;align-items:center;gap:8px}
.upload-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:#f5e8e8;color:var(--green);border:none;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;transition:background 0.2s}
.upload-btn:hover{background:#e8d4d4}
#csvFile{display:none}

/* Table */
.stock-table-wrap{background:#fff;border:1px solid #e8e0d4;border-radius:8px;overflow-x:auto;margin-bottom:20px;max-height:70vh;overflow-y:auto}
.stock-table{width:100%;border-collapse:collapse;min-width:800px}
.stock-table thead{background:#f5e8e8;position:sticky;top:0;z-index:2}
.stock-table th{padding:10px 10px;color:var(--green);font-size:9px;text-transform:uppercase;letter-spacing:0.8px;font-weight:600;text-align:left;white-space:nowrap}
.stock-table tbody tr{border-bottom:1px solid #f0ebe3;transition:background 0.1s}
.stock-table tbody tr:hover{background:#fdf9f3}
.stock-table td{padding:7px 10px;font-size:11px;vertical-align:middle}
.stock-table td.name-cell{font-weight:500;max-width:260px}
.stock-table td.num-cell{text-align:center;color:#666}
.stock-table .qty-input{width:58px;padding:6px 6px;border:1px solid #ddd;border-radius:4px;font-size:12px;font-family:var(--sans);text-align:center;outline:none;background:#fffef8}
.stock-table .qty-input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,150,80,0.18)}

/* Category separator */
.cat-row td{background:#f9f5ef;font-size:12px;font-weight:600;color:var(--green);padding:10px 12px}

/* Total column */
.total-header{background:var(--green) !important;color:#fff !important}
.total-cell{text-align:center;font-weight:700;color:var(--green);font-size:12px;background:#f9f5ef}

/* Lock button */
.loc-header-name{margin-bottom:6px;text-align:center;font-size:8px;line-height:1.3;white-space:nowrap}
.loc-header-lock{margin-bottom:4px;text-align:center}

/* Discontinued */
.disc-check{width:16px;height:16px;accent-color:#c0392b;cursor:pointer}
.disc-row td{opacity:0.4;text-decoration:line-through}
.lock-btn{display:inline-block;cursor:pointer;font-size:8px;padding:3px 7px;border-radius:4px;border:1px solid var(--green);color:var(--green);background:transparent;font-family:var(--sans);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;transition:all 0.2s;white-space:nowrap}
.lock-btn:hover{background:var(--green);color:#fff}
.lock-btn.is-locked{background:var(--green-dark);color:#fff;border-color:var(--green-dark)}
.lock-info{font-size:8px;font-weight:400;letter-spacing:0;text-transform:none;color:#999;margin-top:4px}
.qty-input.locked{background:#f0f0f0;color:#aaa;border-color:#e0e0e0;cursor:not-allowed}

/* Actions */
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.action-btn{padding:12px 28px;border:none;border-radius:6px;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
.btn-save{background:var(--green);color:#fff}
.btn-save:hover{background:var(--green-dark)}
.btn-update{background:var(--green);color:#fff}
.btn-update:hover{background:var(--green-dark)}
.btn-export{background:var(--green);color:#fff}
.btn-export:hover{background:var(--green-dark)}
.btn-print{background:var(--green);color:#fff}
.btn-print:hover{background:var(--green-dark)}
.btn-delete{background:#fff;color:#c0392b;border:1px solid #c0392b}
.btn-delete:hover{background:#c0392b;color:#fff}

/* Print styles */
@media print{
  body{background:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top-bar,.tabs,.controls,.upload-area,.actions,.status-msg,.info-bar,.search-bar,.saved-doc{display:none !important}
  .page{max-width:100%;padding:0;margin:0}
  .page-title{font-size:20px;margin-bottom:10px}
  .stock-table-wrap{border:none;overflow:visible;max-height:none}
  .stock-table{min-width:auto}
  .stock-table thead{background:#f5e8e8 !important}
  .stock-table th{font-size:8px;padding:6px 5px}
  .stock-table td{font-size:10px;padding:5px 5px}
  .stock-table tbody tr{border-bottom:1px solid #ccc}
  .stock-table .qty-input{border:1px solid #ccc;width:45px;padding:3px;font-size:10px}
  .cat-row td{font-size:10px;padding:6px 8px}
  .total-cell{font-size:10px}
}

/* Empty */
.empty-state{text-align:center;padding:60px 20px;color:#aaa}
.empty-state h3{font-family:var(--serif);font-size:22px;color:#999;margin-bottom:8px}
.empty-state p{font-size:13px}

/* Status */
.status-msg{position:fixed;bottom:20px;right:20px;background:var(--green);color:var(--cream);padding:10px 18px;border-radius:6px;font-size:12px;opacity:0;transition:opacity 0.3s;z-index:9999}
.status-msg.show{opacity:1}

/* Info bar */
.info-bar{font-size:11px;color:#888;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap}
.info-bar span{background:#fff;padding:4px 10px;border-radius:4px;border:1px solid #e8e0d4}

/* Search */
.search-bar{margin-bottom:16px;position:sticky;top:0;z-index:3;background:var(--cream);padding:8px 0}
.search-bar input{width:calc(100% - 50px);padding:10px 14px;border:1px solid #e8e0d4;border-radius:6px;font-family:var(--sans);font-size:13px;outline:none;background:#fff;display:inline-block}
.search-bar input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,150,80,0.12)}
.search-bar .done-btn{display:inline-block;width:44px;padding:10px 0;text-align:center;font-size:10px;font-weight:600;color:var(--green);cursor:pointer;vertical-align:top}

/* Saved document indicator */
.saved-doc{background:#fff;border:1px solid #e8e0d4;border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#555;display:flex;align-items:center;gap:8px}
.saved-doc-icon{color:#27ae60;font-size:10px}

@media(max-width:700px){
  .controls{flex-direction:column;align-items:stretch}
  .upload-area{margin-left:0;justify-content:center}
  .tab-btn{padding:8px 14px;font-size:10px}
}
</style>
</head>
<body>
<div class="top-bar">
  <a href="sommeliers.html">&larr; Back</a>
  <h2>Petrus</h2>
  <span></span>
</div>

<div class="page">
  <h1 class="page-title">Stocktake</h1>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tabWine" onclick="switchTab('wine')">Wine</button>
    <button class="tab-btn" id="tabBar" onclick="switchTab('bar')">Beverage</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="ctrl-group">
      <label>Month</label>
      <select id="monthSelect"></select>
    </div>
    <div class="ctrl-group">
      <label>Date</label>
      <input type="date" id="dateInput">
    </div>
    <div class="upload-area">
      <input type="file" id="csvFile" accept=".csv">
      <button class="upload-btn" onclick="document.getElementById('csvFile').click()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload CSV
      </button>
    </div>
  </div>

  <!-- Info -->
  <div class="info-bar" id="infoBar" style="display:none">
    <span id="infoCount"></span>
    <span id="infoMeta"></span>
  </div>

  <!-- Saved document indicator -->
  <div class="saved-doc" id="savedDoc" style="display:none">
    <span class="saved-doc-icon">●</span>
    <span id="savedDocInfo"></span>
  </div>

  <!-- Search -->
  <div class="search-bar" id="searchBar" style="display:none">
    <input type="text" id="searchInput" placeholder="Search by name, category..." oninput="filterTable()">
    <span class="done-btn" onclick="document.getElementById('searchInput').blur()">Done</span>
  </div>

  <!-- Table -->
  <div id="tableArea">
    <div class="empty-state">
      <h3>No items yet</h3>
      <p>Upload your Procure Wizard CSV to get started.</p>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions" id="actionsArea" style="display:none">
    <button class="action-btn btn-save" onclick="saveStocktake()">Save</button>
    <button class="action-btn btn-update" onclick="updateStocktake()">Update</button>
    <button class="action-btn btn-export" onclick="exportCSV()">Export CSV</button>
    <button class="action-btn btn-print" onclick="printTotal()">Print</button>
    <button class="action-btn btn-print" onclick="downloadPDF()">PDF</button>
    <button class="action-btn btn-print" onclick="downloadDiscontinuedPDF()">PDF Discontinued</button>
    <button class="action-btn btn-delete" onclick="deleteStocktake()">Delete</button>
  </div>
</div>

<div class="status-msg" id="statusMsg"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="auth.js"></script>
<script>
// ── Configuration per section ──
var SECTION_LOCATIONS = {
  wine: ['Downstairs Cellar','Main Cellar','Bar Wine Fridge','Premium Wine Fridge'],
  bar: ['Downstairs Cellar','Bar Shelves','Bar Under Till','Wine Fridge','Softs Fridge']
};

// ── State ──
var currentUser = null;
var currentTab = new URLSearchParams(window.location.search).get('tab') || 'wine';
var metaLine = '';
var headerLine = '';
var headers = [];
var rows = [];
var closeFC_idx = -1;
var closeSC_idx = -1;
var cat_idx = -1;
var name_idx = -1;
var hiddenCols = [];
var locationData = [];
var lockedCols = {};  // {locationName: {locked: true, by: 'Fiorella'} }
var docExists = false; // Whether a saved document exists in Firestore
var docInfo = {};      // {createdBy, date, updatedBy}
var discontinuedData = []; // Boolean per row — true = product discontinued

// Columns to hide visually (still exported in CSV)
var HIDDEN_HEADERS = ['pid','[e]stock type','[e]bin number','[e]pos','tertiary category','[e]close fc','[e]close sc'];

function getLocations(){
  return SECTION_LOCATIONS[currentTab] || [];
}

function buildHiddenCols(){
  hiddenCols = [];
  for(var h=0; h<headers.length; h++){
    var col = headers[h].trim().toLowerCase();
    if(HIDDEN_HEADERS.indexOf(col) > -1){
      hiddenCols.push(h);
    }
  }
}

function isHidden(colIdx){
  return hiddenCols.indexOf(colIdx) > -1;
}

// ── Auth & Roles ──
var READONLY_USERS = ['milena@petrus.local'];
var isReadOnly = false;

auth.onAuthStateChanged(function(user){
  if(!user){window.location.href='index.html';return;}
  currentUser = user;
  isReadOnly = READONLY_USERS.indexOf(user.email) > -1;
  logAccess(user,'page_view','somm-stocktake.html');
  // Set active tab UI on load
  document.getElementById('tabWine').classList.toggle('active', currentTab === 'wine');
  document.getElementById('tabBar').classList.toggle('active', currentTab === 'bar');
  initControls();
  if(isReadOnly){
    // Hide editing controls for read-only users
    document.querySelector('.controls').style.display = 'none';
    document.getElementById('searchBar').style.display = 'none';
  }
  loadStocktake();
});

function initControls(){
  var sel = document.getElementById('monthSelect');
  var now = new Date();
  for(var i=0; i<2; i++){
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var val = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    var label = d.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
    var opt = document.createElement('option');
    opt.value = val;
    opt.textContent = label;
    sel.appendChild(opt);
  }
  sel.addEventListener('change', function(){ loadStocktake(); });
  document.getElementById('dateInput').value = new Date().toISOString().slice(0,10);
}

function getSelectedMonth(){
  return document.getElementById('monthSelect').value;
}
function getSelectedDate(){
  return document.getElementById('dateInput').value;
}

// ── Tab Switching ──
function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabWine').classList.toggle('active', tab === 'wine');
  document.getElementById('tabBar').classList.toggle('active', tab === 'bar');
  // Update URL so refresh remembers the tab
  var url = new URL(window.location);
  url.searchParams.set('tab', tab);
  window.history.replaceState({}, '', url);
  // Reset and load data for this tab
  rows = []; headers = []; metaLine = ''; headerLine = ''; locationData = []; lockedCols = {};
  docExists = false; docInfo = {};
  updateDocIndicator();
  renderTable();
  loadStocktake();
}

// ── CSV Parsing ──
document.getElementById('csvFile').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    parseFullCSV(ev.target.result);
  };
  reader.readAsText(file, 'windows-1252');
  e.target.value = '';
});

function parseCSVLine(line){
  var result = [];
  var current = '';
  var inQuotes = false;
  for(var i=0; i<line.length; i++){
    var ch = line[i];
    if(ch === '"'){
      inQuotes = !inQuotes;
    } else if(ch === ',' && !inQuotes){
      result.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

function parseFullCSV(text){
  var lines = text.split(/\r?\n/);

  metaLine = lines[0] || '';
  headerLine = lines[1] || '';
  headers = parseCSVLine(headerLine);

  // Find key column indices
  closeFC_idx = -1; closeSC_idx = -1; cat_idx = -1; name_idx = -1;
  for(var h=0; h<headers.length; h++){
    var col = headers[h].trim().toLowerCase();
    if(col === '[e]close fc') closeFC_idx = h;
    if(col === '[e]close sc') closeSC_idx = h;
    if(col.indexOf('tertiary') > -1 || col.indexOf('category') > -1) cat_idx = h;
    if(col.indexOf('brand') > -1 || col.indexOf('description') > -1) name_idx = h;
  }
  buildHiddenCols();

  rows = [];
  for(var i=2; i<lines.length; i++){
    var line = lines[i].trim();
    if(!line) continue;
    if(line.endsWith(',')) line = line.slice(0,-1);
    var cells = parseCSVLine(line);
    rows.push(cells);
  }

  // Sort by category
  if(cat_idx > -1){
    rows.sort(function(a,b){
      var ca = (a[cat_idx]||'').toLowerCase();
      var cb = (b[cat_idx]||'').toLowerCase();
      if(ca < cb) return -1;
      if(ca > cb) return 1;
      return 0;
    });
  }

  initLocationData();
  renderTable();
  showStatus(rows.length + ' items loaded from CSV');
}

function initLocationData(){
  var locs = getLocations();
  locationData = [];
  discontinuedData = [];
  for(var i=0; i<rows.length; i++){
    var loc = {};
    for(var l=0; l<locs.length; l++){
      loc[locs[l]] = '';
    }
    locationData.push(loc);
    discontinuedData.push(false);
  }
}

function calcTotal(rowIdx){
  var locs = getLocations();
  var total = 0;
  for(var l=0; l<locs.length; l++){
    var v = parseFloat(locationData[rowIdx][locs[l]]);
    if(!isNaN(v)) total += v;
  }
  return total;
}

// ── Render ──
var searchTerm = '';

function filterTable(){
  searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  renderTable();
}

function renderTable(){
  var area = document.getElementById('tableArea');
  if(rows.length === 0){
    var emptyMsg = isReadOnly ? 'No stocktake data available yet.' : 'Upload your Procure Wizard CSV to get started.';
    area.innerHTML = '<div class="empty-state"><h3>No items yet</h3><p>' + emptyMsg + '</p></div>';
    document.getElementById('actionsArea').style.display = 'none';
    document.getElementById('infoBar').style.display = 'none';
    document.getElementById('searchBar').style.display = 'none';
    return;
  }

  // Read-only view for Milena: show only summary table with totals
  if(isReadOnly){
    document.getElementById('infoBar').style.display = 'flex';
    document.getElementById('infoCount').textContent = rows.length + ' products';
    document.getElementById('infoMeta').textContent = currentTab.toUpperCase();
    document.getElementById('searchBar').style.display = 'none';

    var html = '<div class="stock-table-wrap"><table class="stock-table"><thead><tr>';
    html += '<th>Brand & Description</th><th>Pack Size</th><th class="total-header">Total</th>';
    html += '</tr></thead><tbody>';
    var lastCat = '';
    for(var i=0; i<rows.length; i++){
      if(discontinuedData[i]) continue;
      var row = rows[i];
      var total = calcTotal(i);
      if(cat_idx > -1){
        var thisCat = (row[cat_idx]||'').trim();
        if(thisCat && thisCat !== lastCat){
          html += '<tr class="cat-row"><td colspan="3">' + escHtml(thisCat) + '</td></tr>';
          lastCat = thisCat;
        }
      }
      var name = name_idx > -1 ? (row[name_idx]||'').trim() : '';
      var pack = '';
      for(var c=0; c<headers.length; c++){
        if(headers[c].trim().toLowerCase() === 'pack size'){ pack = (row[c]||'').trim(); break; }
      }
      var totalStr = total > 0 ? String(total) : '-';
      html += '<tr><td class="name-cell">' + escHtml(name) + '</td><td class="num-cell">' + escHtml(pack) + '</td><td class="total-cell">' + totalStr + '</td></tr>';
    }
    html += '</tbody></table></div>';
    area.innerHTML = html;
    // Show only PDF button for read-only
    document.getElementById('actionsArea').style.display = 'flex';
    document.getElementById('actionsArea').innerHTML = '<button class="action-btn btn-save" onclick="downloadPDF()">PDF</button>';
    return;
  }

  var locs = getLocations();

  // Show search bar
  document.getElementById('searchBar').style.display = 'block';

  // Info bar
  document.getElementById('infoBar').style.display = 'flex';
  document.getElementById('infoCount').textContent = rows.length + ' products';
  document.getElementById('infoMeta').textContent = currentTab.toUpperCase() + ' — ' + (metaLine.replace('<-- Do not delete or edit','').replace(/,/g,' ').trim());

  var html = '<div class="stock-table-wrap"><table class="stock-table"><thead><tr>';
  // CSV visible headers
  var visibleCount = 0;
  for(var h=0; h<headers.length; h++){
    if(isHidden(h)) continue;
    html += '<th>' + escHtml(headers[h].trim()) + '</th>';
    visibleCount++;
  }
  // Discontinued column after product info
  html += '<th>X</th>';
  // Location headers with lock buttons
  for(var l=0; l<locs.length; l++){
    var isLocked = lockedCols[locs[l]] && lockedCols[locs[l]].locked;
    var lockClass = isLocked ? ' is-locked' : '';
    var lockLabel = isLocked ? 'Locked' : 'Lock';
    var lockInfo = isLocked ? '<div class="lock-info"><em>by</em> ' + escHtml(lockedCols[locs[l]].by || '') + '</div>' : '';
    html += '<th><div class="loc-header-name">' + escHtml(locs[l]).replace(/\s+/g,'<br>') + '</div><div class="loc-header-lock"><span class="lock-btn' + lockClass + '" onclick="toggleLock(\'' + locs[l].replace(/'/g,"\\'") + '\')">' + lockLabel + '</span></div>' + lockInfo + '</th>';
  }
  html += '<th class="total-header">Total</th>';
  var totalCols = visibleCount + locs.length + 2;
  html += '</tr></thead><tbody>';

  var lastCat = '';
  for(var i=0; i<rows.length; i++){
    var row = rows[i];

    // Filter by search term
    if(searchTerm){
      var matchText = ((row[name_idx]||'') + ' ' + (row[cat_idx]||'')).toLowerCase();
      var words = searchTerm.split(/\s+/);
      var allMatch = words.every(function(w){ return matchText.indexOf(w) > -1; });
      if(!allMatch) continue;
    }

    // Category separator
    if(cat_idx > -1){
      var thisCat = (row[cat_idx]||'').trim();
      if(thisCat && thisCat !== lastCat){
        html += '<tr class="cat-row"><td colspan="' + totalCols + '">' + escHtml(thisCat) + '</td></tr>';
        lastCat = thisCat;
      }
    }

    html += '<tr' + (discontinuedData[i] ? ' class="disc-row"' : '') + '>';
    for(var c=0; c<headers.length; c++){
      if(isHidden(c)) continue;
      var val = (row[c]||'').trim();
      if(c === name_idx){
        html += '<td class="name-cell">' + escHtml(val) + '</td>';
      } else {
        html += '<td class="num-cell">' + escHtml(val) + '</td>';
      }
    }
    // Discontinued checkbox
    var discChecked = discontinuedData[i] ? ' checked' : '';
    html += '<td style="text-align:center"><input type="checkbox" class="disc-check"' + discChecked + ' data-row="' + i + '" onchange="toggleDiscontinued(this)"></td>';
    // Location inputs
    for(var l=0; l<locs.length; l++){
      var locVal = locationData[i] ? (locationData[i][locs[l]] || '') : '';
      var isLocked = lockedCols[locs[l]] && lockedCols[locs[l]].locked;
      var disabledAttr = isLocked || discontinuedData[i] ? ' disabled' : '';
      var lockedClass = isLocked || discontinuedData[i] ? ' locked' : '';
      html += '<td><input class="qty-input' + lockedClass + '" type="number" min="0" step="0.5" value="' + escHtml(String(locVal)) + '" data-row="' + i + '" data-loc="' + locs[l] + '" onchange="setLocValue(this)"' + disabledAttr + '></td>';
    }
    // Total
    var total = calcTotal(i);
    var totalDisplay = total > 0 ? total : '';
    html += '<td class="total-cell">' + totalDisplay + '</td>';
    html += '</tr>';
  }

  html += '</tbody></table></div>';
  area.innerHTML = html;
  document.getElementById('actionsArea').style.display = 'flex';
}

function setLocValue(el){
  var r = parseInt(el.getAttribute('data-row'));
  var loc = el.getAttribute('data-loc');
  locationData[r][loc] = el.value;
  // Update [E]Close SC with total
  var total = calcTotal(r);
  if(closeSC_idx > -1){
    rows[r][closeSC_idx] = total > 0 ? String(total) : '';
  }
  // Update total cell without full re-render
  var tr = el.closest('tr');
  var totalCell = tr.querySelector('.total-cell');
  if(totalCell) totalCell.textContent = total > 0 ? total : '';
}

function toggleDiscontinued(el){
  var r = parseInt(el.getAttribute('data-row'));
  discontinuedData[r] = el.checked;
  renderTable();
}

function toggleLock(locName){
  var author = currentUser.displayName || currentUser.email.split('@')[0].replace(/\./g,' ');
  if(lockedCols[locName] && lockedCols[locName].locked){
    lockedCols[locName] = {locked: false, by: ''};
  } else {
    lockedCols[locName] = {locked: true, by: author};
  }
  // Save lock state to Firestore (only if doc exists)
  if(docExists){
    db.collection('somm_stocktake').doc(getDocId()).set({lockedCols: lockedCols, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true}).then(function(){
      showStatus(locName + (lockedCols[locName].locked ? ' locked' : ' unlocked'));
    }).catch(function(e){ console.error(e); });
  }
  renderTable();
}

function escHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Export CSV (same format as Procure Wizard — only total in [E]Close SC) ──
function exportCSV(){
  if(rows.length === 0){ showStatus('Nothing to export'); return; }

  var csvContent = metaLine + '\r\n' + headerLine + '\r\n';

  for(var i=0; i<rows.length; i++){
    var line = '';
    for(var c=0; c<rows[i].length; c++){
      var val = rows[i][c] || '';
      if(val.indexOf(',') > -1 || val.indexOf('"') > -1){
        val = '"' + val.replace(/"/g,'""') + '"';
      } else {
        val = '"' + val + '"';
      }
      line += val;
      if(c < rows[i].length - 1) line += ',';
    }
    line += ',';
    csvContent += line + '\r\n';
  }

  // Encode back to windows-1252 for Procure Wizard compatibility
  var bytes = new Uint8Array(csvContent.length);
  for(var b=0; b<csvContent.length; b++){
    bytes[b] = csvContent.charCodeAt(b) & 0xFF;
  }
  var blob = new Blob([bytes], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Petrus-Stocktake-' + currentTab + '-' + getSelectedMonth() + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showStatus('CSV exported ✓');
}

// ── Firestore Save / Load ──
function getDocId(){
  return 'stocktake_' + currentTab + '_' + getSelectedMonth();
}

function saveStocktake(){
  if(rows.length === 0){ showStatus('Nothing to save'); return; }
  var author = currentUser.displayName || currentUser.email.split('@')[0].replace(/\./g,' ');
  var id = getDocId();
  // Convert rows (array of arrays) to array of strings for Firestore
  var rowStrings = rows.map(function(r){ return r.join('|||'); });
  var payload = {
    section: currentTab,
    month: getSelectedMonth(),
    date: getSelectedDate(),
    metaLine: metaLine,
    headerLine: headerLine,
    headers: headers,
    rowStrings: rowStrings,
    locationData: locationData,
    discontinuedData: discontinuedData,
    lockedCols: lockedCols,
    createdBy: author,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  db.collection('somm_stocktake').doc(id).set(payload).then(function(){
    docExists = true;
    docInfo = {createdBy: author, date: getSelectedDate(), updatedBy: ''};
    updateDocIndicator();
    showStatus('Stocktake saved ✓');
  }).catch(function(e){
    console.error('Save error:', e);
    showStatus('Error: ' + e.message);
  });
}

function updateStocktake(){
  if(rows.length === 0){ showStatus('Nothing to update'); return; }
  var author = currentUser.displayName || currentUser.email.split('@')[0].replace(/\./g,' ');
  var rowStrings = rows.map(function(r){ return r.join('|||'); });
  var payload = {
    rowStrings: rowStrings,
    locationData: locationData,
    discontinuedData: discontinuedData,
    lockedCols: lockedCols,
    date: getSelectedDate(),
    updatedBy: author,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  db.collection('somm_stocktake').doc(getDocId()).set(payload, {merge:true}).then(function(){
    docInfo.updatedBy = author;
    docInfo.date = getSelectedDate();
    updateDocIndicator();
    showStatus('Stocktake updated ✓');
  }).catch(function(e){
    console.error(e);
    showStatus('Error updating: ' + e.message);
  });
}

function loadStocktake(){
  var id = getDocId();
  db.collection('somm_stocktake').doc(id).get().then(function(doc){
    if(doc.exists){
      var data = doc.data();
      metaLine = data.metaLine || '';
      headerLine = data.headerLine || '';
      headers = data.headers || [];
      // If headers is empty but headerLine exists, re-parse it
      if(headers.length === 0 && headerLine){
        headers = parseCSVLine(headerLine);
      }
      // Convert rowStrings back to arrays
      if(data.rowStrings && data.rowStrings.length > 0){
        rows = data.rowStrings.map(function(s){ return s.split('|||'); });
      } else {
        rows = [];
      }
      // Re-detect column indices
      closeFC_idx = -1; closeSC_idx = -1; cat_idx = -1; name_idx = -1;
      for(var h=0; h<headers.length; h++){
        var col = headers[h].trim().toLowerCase();
        if(col === '[e]close fc') closeFC_idx = h;
        if(col === '[e]close sc') closeSC_idx = h;
        if(col.indexOf('tertiary') > -1 || col.indexOf('category') > -1) cat_idx = h;
        if(col.indexOf('brand') > -1 || col.indexOf('description') > -1) name_idx = h;
      }
      buildHiddenCols();
      if(data.date) document.getElementById('dateInput').value = data.date;
      // Load location data
      if(data.locationData && data.locationData.length === rows.length){
        locationData = data.locationData;
      } else {
        initLocationData();
      }
      // Load discontinued data
      if(data.discontinuedData && data.discontinuedData.length === rows.length){
        discontinuedData = data.discontinuedData;
      } else {
        discontinuedData = rows.map(function(){ return false; });
      }
      // Load lock states
      lockedCols = data.lockedCols || {};
      // Mark document as existing
      docExists = true;
      docInfo = {createdBy: data.createdBy || '', date: data.date || '', updatedBy: data.updatedBy || ''};
      updateDocIndicator();
      renderTable();
      if(rows.length > 0) showStatus('Loaded ' + rows.length + ' items');
    } else {
      rows = []; headers = []; metaLine = ''; headerLine = '';
      locationData = [];
      lockedCols = {};
      docExists = false;
      docInfo = {};
      updateDocIndicator();
      renderTable();
    }
  }).catch(function(e){ console.error(e); });
}

function updateDocIndicator(){
  var el = document.getElementById('savedDoc');
  var infoEl = document.getElementById('savedDocInfo');
  if(docExists && rows.length > 0){
    el.style.display = 'flex';
    var text = currentTab.toUpperCase() + ' — ' + getSelectedMonth();
    if(docInfo.date) text += ' — saved ' + docInfo.date;
    if(docInfo.updatedBy) text += ' — last update by ' + docInfo.updatedBy;
    else if(docInfo.createdBy) text += ' — created by ' + docInfo.createdBy;
    infoEl.textContent = text;
  } else {
    el.style.display = 'none';
  }
  updateActionButtons();
}

function updateActionButtons(){
  var saveBtn = document.querySelector('.btn-save');
  var updateBtn = document.querySelector('.btn-update');
  if(saveBtn && updateBtn){
    if(docExists){
      saveBtn.style.display = 'none';
      updateBtn.style.display = 'inline-block';
    } else {
      saveBtn.style.display = 'inline-block';
      updateBtn.style.display = 'none';
    }
  }
}

// ── Print / PDF (total only — no location detail) ──
function buildTotalTable(){
  var html = '<html><head><meta charset="UTF-8">';
  html += '<style>body{font-family:Inter,sans-serif;padding:20px}h2{font-family:"Cormorant Garamond",serif;color:#5c1a1a;margin-bottom:4px}';
  html += 'table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#5c1a1a;color:#fff;padding:8px;font-size:10px;text-transform:uppercase;text-align:left}';
  html += 'td{padding:6px 8px;font-size:11px;border-bottom:1px solid #ddd}.total{font-weight:700;text-align:center}';
  html += '.cat-row td{background:#f5e8e8;font-weight:700;color:#5c1a1a;font-size:11px;padding:8px}</style></head><body>';
  html += '<h2>Petrus Stocktake \u2014 ' + currentTab.toUpperCase() + '</h2>';
  html += '<p style="font-size:11px;color:#888">' + getSelectedMonth() + ' \u2014 ' + getSelectedDate() + '</p>';
  html += '<table><thead><tr><th>Brand & Description</th><th>Pack Size</th><th>Total</th></tr></thead><tbody>';

  var lastCat = '';
  for(var i=0; i<rows.length; i++){
    if(discontinuedData[i]) continue;
    var row = rows[i];
    var total = calcTotal(i);

    if(cat_idx > -1){
      var thisCat = (row[cat_idx]||'').trim();
      if(thisCat && thisCat !== lastCat){
        html += '<tr class="cat-row"><td colspan="3">' + escHtml(thisCat) + '</td></tr>';
        lastCat = thisCat;
      }
    }
    var name = name_idx > -1 ? (row[name_idx]||'').trim() : '';
    var pack = '';
    for(var c=0; c<headers.length; c++){
      if(headers[c].trim().toLowerCase() === 'pack size'){ pack = (row[c]||'').trim(); break; }
    }
    var totalStr = total > 0 ? String(total) : '-';
    html += '<tr><td>' + escHtml(name) + '</td><td>' + escHtml(pack) + '</td><td class="total">' + totalStr + '</td></tr>';
  }
  html += '</tbody></table></body></html>';
  return html;
}

function printTotal(){
  var content = buildTotalTable();
  var win = window.open('','_blank');
  win.document.write(content);
  win.document.close();
  win.onload = function(){ win.print(); };
}

// Sanitize text for jsPDF (replace accented chars with ASCII equivalents)
function sanitizeForPDF(str){
  if(!str) return '';
  return str
    .replace(/[\u00E0\u00E1\u00E2\u00E3\u00E4\u00E5]/g, 'a')
    .replace(/[\u00C0\u00C1\u00C2\u00C3\u00C4\u00C5]/g, 'A')
    .replace(/[\u00E8\u00E9\u00EA\u00EB]/g, 'e')
    .replace(/[\u00C8\u00C9\u00CA\u00CB]/g, 'E')
    .replace(/[\u00EC\u00ED\u00EE\u00EF]/g, 'i')
    .replace(/[\u00CC\u00CD\u00CE\u00CF]/g, 'I')
    .replace(/[\u00F2\u00F3\u00F4\u00F5\u00F6]/g, 'o')
    .replace(/[\u00D2\u00D3\u00D4\u00D5\u00D6]/g, 'O')
    .replace(/[\u00F9\u00FA\u00FB\u00FC]/g, 'u')
    .replace(/[\u00D9\u00DA\u00DB\u00DC]/g, 'U')
    .replace(/\u00F1/g, 'n').replace(/\u00D1/g, 'N')
    .replace(/\u00E7/g, 'c').replace(/\u00C7/g, 'C')
    .replace(/\u00DF/g, 'ss')
    .replace(/[^\x20-\x7E]/g, '');
}

function downloadPDF(){
  if(rows.length === 0){ showStatus('Nothing to export'); return; }
  var { jsPDF } = window.jspdf;
  var doc = new jsPDF();

  // Title
  doc.setFontSize(16);
  doc.setTextColor(92, 26, 26);
  doc.text('Petrus Stocktake - ' + currentTab.toUpperCase(), 14, 20);
  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text(getSelectedMonth() + ' - ' + getSelectedDate(), 14, 27);

  // Build table data — exclude discontinued, show "-" for empty
  var tableRows = [];
  var lastCat = '';
  for(var i=0; i<rows.length; i++){
    if(discontinuedData[i]) continue;
    var row = rows[i];
    var total = calcTotal(i);

    if(cat_idx > -1){
      var thisCat = (row[cat_idx]||'').trim();
      if(thisCat && thisCat !== lastCat){
        tableRows.push([{content: sanitizeForPDF(thisCat), colSpan: 3, styles: {fillColor: [245,232,232], textColor: [92,26,26], fontStyle: 'bold'}}]);
        lastCat = thisCat;
      }
    }
    var name = name_idx > -1 ? sanitizeForPDF((row[name_idx]||'').trim()) : '';
    var pack = '';
    for(var c=0; c<headers.length; c++){
      if(headers[c].trim().toLowerCase() === 'pack size'){ pack = (row[c]||'').trim(); break; }
    }
    var totalStr = total > 0 ? String(total) : '-';
    tableRows.push([name, pack, totalStr]);
  }

  doc.autoTable({
    startY: 32,
    head: [['Brand & Description', 'Pack Size', 'Total']],
    body: tableRows,
    headStyles: {fillColor: [92, 26, 26], textColor: [255,255,255], fontSize: 8},
    bodyStyles: {fontSize: 8},
    columnStyles: {2: {halign: 'center', fontStyle: 'bold'}},
    margin: {left: 14, right: 14}
  });

  doc.save('Petrus-Stocktake-' + currentTab + '-' + getSelectedMonth() + '.pdf');
  showStatus('PDF downloaded');
}

function downloadDiscontinuedPDF(){
  if(rows.length === 0){ showStatus('Nothing to export'); return; }
  var discItems = [];
  for(var i=0; i<rows.length; i++){
    if(!discontinuedData[i]) continue;
    var row = rows[i];
    var name = name_idx > -1 ? sanitizeForPDF((row[name_idx]||'').trim()) : '';
    var cat = cat_idx > -1 ? sanitizeForPDF((row[cat_idx]||'').trim()) : '';
    var pack = '';
    for(var c=0; c<headers.length; c++){
      if(headers[c].trim().toLowerCase() === 'pack size'){ pack = (row[c]||'').trim(); break; }
    }
    discItems.push([name, cat, pack]);
  }
  if(discItems.length === 0){ showStatus('No discontinued items marked'); return; }

  var { jsPDF } = window.jspdf;
  var doc = new jsPDF();

  doc.setFontSize(16);
  doc.setTextColor(92, 26, 26);
  doc.text('Discontinued Items - ' + currentTab.toUpperCase(), 14, 20);
  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text(getSelectedMonth() + ' - ' + discItems.length + ' items to remove', 14, 27);

  doc.autoTable({
    startY: 32,
    head: [['Brand & Description', 'Category', 'Pack Size']],
    body: discItems,
    headStyles: {fillColor: [192, 57, 43], textColor: [255,255,255], fontSize: 8},
    bodyStyles: {fontSize: 8},
    margin: {left: 14, right: 14}
  });

  doc.save('Petrus-Discontinued-' + currentTab + '-' + getSelectedMonth() + '.pdf');
  showStatus('Discontinued PDF downloaded');
}

function deleteStocktake(){
  if(!confirm('Delete this stocktake? This cannot be undone.')) return;
  db.collection('somm_stocktake').doc(getDocId()).delete().then(function(){
    rows = []; headers = []; metaLine = ''; headerLine = '';
    locationData = []; lockedCols = {};
    docExists = false; docInfo = {};
    updateDocIndicator();
    renderTable();
    showStatus('Stocktake deleted');
  }).catch(function(e){
    console.error(e);
    showStatus('Error deleting');
  });
}

// ── Status ──
function showStatus(msg){
  var el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2500);
}
</script>
