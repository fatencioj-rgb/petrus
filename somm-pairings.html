<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Pairings — Petrus Sommeliers</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #5c1a1a; --green-dark: #2d0a0a;
  --gold: #b89650; --gold-light: #d4b87a; --cream: #faf7f1;
  --sans: 'Inter', sans-serif; --serif: 'Cormorant Garamond', serif;
}
body { font-family: var(--sans); background: var(--cream); color: #2c2c2c; min-height: 100vh; }
.top-bar { background: var(--green-dark); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
.top-bar a { color: var(--gold); text-decoration: none; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.top-bar a:hover { color: #fff; }
.top-bar h2 { font-family: var(--serif); color: #fff; font-size: 18px; margin: 0; }
.content { max-width: 1400px; margin: 32px auto; padding: 0 20px; }
.content > h1 { font-family: var(--serif); font-size: 32px; color: var(--green); margin-bottom: 8px; }
.content > .subtitle { font-size: 13px; color: #888; margin-bottom: 28px; }
.selectors { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.selectors select { padding: 10px 14px; border: 1px solid #d4b87a; border-radius: 6px; font-family: var(--sans); font-size: 13px; background: #fff; color: #333; cursor: pointer; outline: none; min-width: 160px; }
.selectors select:focus { border-color: var(--green); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
.btn { padding: 10px 20px; border-radius: 6px; font-family: var(--sans); font-size: 12px; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; border: none; }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { background: #a07e3a; }
.btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--green); }
.btn-outline:hover { background: var(--gold); color: #fff; }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: var(--green-dark); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
/* Split view */
.split-view { display: flex; gap: 24px; align-items: flex-start; }
.split-left { flex: 1; min-width: 0; position: sticky; top: 20px; }
.split-right { flex: 1; min-width: 0; max-height: 85vh; overflow-y: auto; }
/* Menu preview */
.menu-preview { background: #fff; border: 1px solid #e8e0d4; border-radius: 8px; padding: 48px 32px; min-height: 500px; text-align: center; }
.menu-logo { width: 50px; height: 50px; background: var(--green); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; }
.menu-logo span { color: var(--gold); font-family: var(--serif); font-size: 22px; font-weight: 700; }
.menu-title { font-family: var(--serif); font-size: 22px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: #1a1a1a; margin-bottom: 6px; }
.menu-subtitle { font-family: var(--sans); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 36px; }
.course-separator { font-size: 14px; color: #ccc; margin: 14px 0; user-select: none; }
.course-dish { font-family: var(--serif); font-size: 17px; font-weight: 600; color: #1a1a1a; line-height: 1.3; }
.course-desc { font-family: var(--serif); font-size: 15px; font-weight: 300; color: #333; margin-top: 2px; }
.course-wine { font-family: var(--serif); font-size: 13px; font-style: italic; color: var(--gold); margin-top: 6px; }
.menu-footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid #e8e0d4; }
.menu-footer .sig-name { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--green-dark); }
.menu-footer .sig-role { font-family: var(--sans); font-size: 9px; color: #888; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
/* Editor panel */
.editor-panel { background: #f5f0e8; border: 1px solid #e0d5c5; border-radius: 8px; padding: 20px; }
.editor-panel h3 { font-family: var(--serif); font-size: 20px; color: var(--green); margin-bottom: 16px; }
.editor-section { margin-bottom: 20px; }
.editor-section h4 { font-family: var(--sans); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.course-editor { margin-bottom: 12px; padding: 12px; background: #fff; border-radius: 6px; border: 1px solid #e8e0d4; }
.course-editor .dish-label { font-family: var(--serif); font-size: 14px; font-weight: 600; color: var(--green-dark); margin-bottom: 2px; }
.course-editor .desc-label { font-family: var(--serif); font-size: 12px; color: #666; font-style: italic; margin-bottom: 8px; }
.course-editor label { display: block; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: #999; margin-bottom: 2px; margin-top: 6px; }
.course-editor input { width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 4px; font-family: var(--sans); font-size: 12px; outline: none; margin-bottom: 4px; }
.course-editor input:focus { border-color: var(--gold); }
.wine-row-edit { display: flex; gap: 6px; flex-wrap: wrap; }
.wine-row-edit input { flex: 1; min-width: 70px; }
.wine-row-edit .vintage { flex: 0 0 55px; }
.meta-editor { margin-top: 16px; }
.meta-editor label { display: block; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: #999; margin-bottom: 2px; }
.meta-editor select { width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 4px; font-family: var(--sans); font-size: 12px; outline: none; margin-bottom: 8px; }
.meta-info { font-size: 10px; color: #999; font-style: italic; margin-top: 12px; padding-top: 8px; border-top: 1px solid #e8e0d4; }
.placeholder-msg { font-family: var(--serif); font-size: 18px; color: #aaa; padding: 80px 20px; text-align: center; }
.status-msg { position: fixed; bottom: 24px; right: 24px; background: var(--green); color: var(--cream); padding: 12px 20px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity 0.3s; z-index: 9999; }
.status-msg.show { opacity: 1; }
@media print {
  body { background: #fff !important; margin: 0; padding: 0; }
  .top-bar, .content > h1, .content > .subtitle, .selectors, .actions, .editor-panel, .status-msg, .split-right { display: none !important; }
  .content { max-width: 100%; margin: 0; padding: 0; }
  .split-view { display: block !important; }
  .split-left { position: static; }
  .menu-preview { border: none !important; border-radius: 0 !important; padding: 0 !important; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .menu-title { font-size: 20px; margin-bottom: 4px; }
  .menu-subtitle { margin-bottom: 28px; }
  .course-dish { font-size: 15px; }
  .course-desc { font-size: 13px; }
  .course-wine { font-size: 11px; }
  .course-separator { margin: 10px 0; }
  .menu-footer .sig-name { font-size: 13px; }
}
@media (max-width: 600px) {
  .selectors { flex-direction: column; }
  .selectors select { min-width: 100%; }
  .split-view { flex-direction: column; }
  .split-left { position: static; }
  .split-right { max-height: none; }
}
</style>
</head>
<body>
<div class="top-bar">
  <a href="sommeliers.html">&larr; Back</a>
  <h2>Petrus</h2>
  <span></span>
</div>
<div class="content">
  <h1>Wine Pairings</h1>
  <p class="subtitle">Select a menu and pairing type to edit wines for each course.</p>
  <div class="selectors">
    <select id="selMenu">
      <option value="">— Select Menu —</option>
      <option value="prestige">Prestige</option>
      <option value="discovery">Discovery</option>
      <option value="lunch">Lunch Menu</option>
      <option value="alc">ALC</option>
      <option value="kt">Kitchen Table</option>
    </select>
    <select id="selVariant">
      <option value="">— Variant —</option>
    </select>
    <select id="selWine">
      <option value="">— Pairing Type —</option>
    </select>
  </div>
  <div class="actions">
    <button class="btn btn-outline" id="btnLoad" disabled onclick="loadPairing()">Load</button>
    <button class="btn btn-gold" id="btnPrint" disabled onclick="doPrint('a4')">Print A4</button>
    <button class="btn btn-gold" id="btnPrintS" disabled onclick="doPrint('statement')">Print Statement</button>
    <button class="btn btn-green" id="btnSave" style="display:none" onclick="savePairing()">Save</button>
  </div>
  <div class="split-view" id="splitView" style="display:none;">
    <div class="split-left">
      <div class="menu-preview" id="menuPreview"></div>
    </div>
    <div class="split-right">
      <div class="editor-panel" id="editorPanel"></div>
    </div>
  </div>
  <div class="menu-preview" id="placeholder">
    <p class="placeholder-msg">Select a menu above to begin</p>
  </div>
</div>
<div class="status-msg" id="statusMsg"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script>
var U=null;
var VARIANTS_MAP={
  prestige:['normal','pescatarian','vegetarian','no-seafood'],
  discovery:['normal','pescatarian','vegetarian','no-seafood'],
  lunch:['normal','pescatarian','vegetarian','no-seafood'],
  alc:['normal','pescatarian','vegetarian','no-seafood'],
  kt:['normal']
};
var VARIANT_LABELS={normal:'Normal',pescatarian:'Pescatarian',vegetarian:'Vegetarian','no-seafood':'No Seafood'};
var WINES_MAP={
  prestige:['matching','connoisseur','indulgence'],
  discovery:['matching','connoisseur','indulgence'],
  lunch:['matching','connoisseur','indulgence'],
  alc:['matching','connoisseur','indulgence'],
  kt:['matching','connoisseur','indulgence','kt-matching']
};
var WINE_LABELS={matching:'Matching',connoisseur:'Connoisseur',indulgence:'Indulgence','kt-matching':'Kitchen Table Matching'};

var menuCourses=[];
var pairingWines={};
var pairingMeta={lastEditBy:'',lastEditDate:'',footerName:'',footerRole:'Sommelier'};

var selMenu=document.getElementById('selMenu');
var selVariant=document.getElementById('selVariant');
var selWine=document.getElementById('selWine');

auth.onAuthStateChanged(function(u){
  if(!u){window.location.href='index.html';return;}
  U=u;logAccess(u,'page_view','somm-pairings.html');
});

selMenu.addEventListener('change',function(){
  var m=selMenu.value;
  selVariant.innerHTML='<option value="">— Variant —</option>';
  selWine.innerHTML='<option value="">— Pairing Type —</option>';
  document.getElementById('btnLoad').disabled=true;
  if(!m)return;
  (VARIANTS_MAP[m]||[]).forEach(function(v){selVariant.innerHTML+='<option value="'+v+'">'+VARIANT_LABELS[v]+'</option>';});
  (WINES_MAP[m]||[]).forEach(function(w){selWine.innerHTML+='<option value="'+w+'">'+WINE_LABELS[w]+'</option>';});
  checkReady();
});
selVariant.addEventListener('change',checkReady);
selWine.addEventListener('change',checkReady);
function checkReady(){document.getElementById('btnLoad').disabled=!(selMenu.value&&selVariant.value&&selWine.value);}

function loadPairing(){
  var menu=selMenu.value,variant=selVariant.value,wine=selWine.value;
  var menuDocId=menu+'_'+variant;
  var pairingDocId=menu+'_'+variant+'_'+wine;

  document.getElementById('btnLoad').disabled=true;
  document.getElementById('btnLoad').textContent='Loading...';

  // Load menu courses
  db.collection('menus').doc(menuDocId).get().then(function(doc){
    if(doc.exists){
      menuCourses=doc.data().courses||[];
    }else{
      menuCourses=[];
    }
    // Load pairings
    return db.collection('somm_pairings').doc(pairingDocId).get();
  }).then(function(doc){
    if(doc.exists){
      var d=doc.data();
      pairingWines=d.wines||{};
      pairingMeta.lastEditBy=d.lastEditBy||'';
      pairingMeta.lastEditDate=d.lastEditDate||'';
      pairingMeta.footerName=d.footerName||'';
      pairingMeta.footerRole=d.footerRole||'Sommelier';
    }else{
      pairingWines={};
      pairingMeta={lastEditBy:'',lastEditDate:'',footerName:'',footerRole:'Sommelier'};
    }
    renderPreview();
    renderEditor();
    document.getElementById('splitView').style.display='flex';
    document.getElementById('placeholder').style.display='none';
    document.getElementById('btnPrint').disabled=false;
    document.getElementById('btnPrintS').disabled=false;
    document.getElementById('btnSave').style.display='inline-block';
    document.getElementById('btnLoad').disabled=false;
    document.getElementById('btnLoad').textContent='Load';
    showStatus('Loaded');
  }).catch(function(e){
    console.error(e);
    document.getElementById('btnLoad').disabled=false;
    document.getElementById('btnLoad').textContent='Load';
    showStatus('Error loading');
  });
}

function renderPreview(){
  var menuLabel=(selMenu.options[selMenu.selectedIndex]||{}).text||'';
  var wineLabel=(selWine.options[selWine.selectedIndex]||{}).text||'';
  var p=document.getElementById('menuPreview');
  var h='';
  h+='<div class="menu-logo"><span>P</span></div>';
  h+='<div class="menu-title">Petrus</div>';
  h+='<div class="menu-subtitle">'+menuLabel.toUpperCase()+' — '+wineLabel.toUpperCase()+'</div>';

  for(var i=0;i<menuCourses.length;i++){
    var c=menuCourses[i];
    var w=pairingWines[i]||{};
    if(i>0)h+='<div class="course-separator">~</div>';
    h+='<div class="course-block">';
    h+=c.dish?'<div class="course-dish">'+esc(c.dish)+'</div>':'';
    if(c.desc)h+='<div class="course-desc">'+esc(c.desc)+'</div>';
    var wineParts=[];
    if(w.producer)wineParts.push(w.producer);
    if(w.wine)wineParts.push(w.wine);
    if(w.region)wineParts.push(w.region);
    if(w.vintage)wineParts.push(w.vintage);
    if(wineParts.length)h+='<div class="course-wine">'+esc(wineParts.join(', '))+'</div>';
    h+='</div>';
  }

  var fn=pairingMeta.footerName;
  var fr=pairingMeta.footerRole;
  if(fn){
    h+='<div class="menu-footer"><div class="sig-name">'+esc(fn)+'</div><div class="sig-role">'+esc(fr)+'</div></div>';
  }
  p.innerHTML=h;
}

function renderEditor(){
  var panel=document.getElementById('editorPanel');
  var h='<h3>Wine Pairings</h3>';
  h+='<div class="editor-section"><h4>Courses</h4>';

  if(menuCourses.length===0){
    h+='<p style="color:#999;font-size:12px;">No menu found. Create it first in Operations → Menus.</p>';
  }else{
    for(var i=0;i<menuCourses.length;i++){
      var c=menuCourses[i];
      var w=pairingWines[i]||{producer:'',wine:'',region:'',vintage:''};
      h+='<div class="course-editor">';
      h+='<div class="dish-label">'+esc(c.dish||'Course '+(i+1))+'</div>';
      if(c.desc)h+='<div class="desc-label">'+esc(c.desc)+'</div>';
      h+='<div class="wine-row-edit">';
      h+='<input type="text" value="'+escAttr(w.producer)+'" placeholder="Producer" oninput="updWine('+i+',\'producer\',this.value)">';
      h+='<input type="text" value="'+escAttr(w.wine)+'" placeholder="Wine name" oninput="updWine('+i+',\'wine\',this.value)">';
      h+='<input type="text" value="'+escAttr(w.region)+'" placeholder="Region, Country" oninput="updWine('+i+',\'region\',this.value)">';
      h+='<input type="text" class="vintage" value="'+escAttr(w.vintage)+'" placeholder="Year" oninput="updWine('+i+',\'vintage\',this.value)">';
      h+='</div></div>';
    }
  }
  h+='</div>';

  // Signature
  h+='<div class="meta-editor">';
  h+='<h4 style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:10px">Signature</h4>';
  h+='<label>Name</label><select id="editFooterName" onchange="pairingMeta.footerName=this.value;renderPreview()">';
  h+='<option value="">— Select —</option>';
  h+='<option value="Fiorella Atencio"'+(pairingMeta.footerName==='Fiorella Atencio'?' selected':'')+'>Fiorella Atencio</option>';
  h+='<option value="Christian Holthausen"'+(pairingMeta.footerName==='Christian Holthausen'?' selected':'')+'>Christian Holthausen</option>';
  h+='<option value="Milena Butkovic"'+(pairingMeta.footerName==='Milena Butkovic'?' selected':'')+'>Milena Butkovic</option>';
  h+='</select>';
  h+='<label>Role</label><select id="editFooterRole" onchange="pairingMeta.footerRole=this.value;renderPreview()">';
  h+='<option value="Sommelier"'+(pairingMeta.footerRole==='Sommelier'?' selected':'')+'>Sommelier</option>';
  h+='<option value="Head Sommelier"'+(pairingMeta.footerRole==='Head Sommelier'?' selected':'')+'>Head Sommelier</option>';
  h+='<option value="Senior Sommelier"'+(pairingMeta.footerRole==='Senior Sommelier'?' selected':'')+'>Senior Sommelier</option>';
  h+='<option value="Assistant Sommelier"'+(pairingMeta.footerRole==='Assistant Sommelier'?' selected':'')+'>Assistant Sommelier</option>';
  h+='</select>';
  h+='</div>';

  if(pairingMeta.lastEditBy){
    h+='<div class="meta-info">Last edited by '+esc(pairingMeta.lastEditBy)+' — '+esc(pairingMeta.lastEditDate)+'</div>';
  }
  panel.innerHTML=h;
}

function updWine(i,field,val){
  if(!pairingWines[i])pairingWines[i]={producer:'',wine:'',region:'',vintage:''};
  pairingWines[i][field]=val;
  renderPreview();
}

function savePairing(){
  var menu=selMenu.value,variant=selVariant.value,wine=selWine.value;
  var pairingDocId=menu+'_'+variant+'_'+wine;
  var author=U.displayName||U.email.split('@')[0].replace(/\./g,' ');
  author=author.charAt(0).toUpperCase()+author.slice(1);
  var now=new Date();
  var dateStr=now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

  document.getElementById('btnSave').disabled=true;
  document.getElementById('btnSave').textContent='Saving...';

  db.collection('somm_pairings').doc(pairingDocId).set({
    menu:menu,variant:variant,wine:wine,
    wines:pairingWines,
    footerName:pairingMeta.footerName,
    footerRole:pairingMeta.footerRole,
    lastEditBy:author,
    lastEditDate:dateStr,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    pairingMeta.lastEditBy=author;
    pairingMeta.lastEditDate=dateStr;
    renderEditor();
    document.getElementById('btnSave').disabled=false;
    document.getElementById('btnSave').textContent='Save';
    showStatus('Saved ✓');
  }).catch(function(e){
    console.error(e);
    document.getElementById('btnSave').disabled=false;
    document.getElementById('btnSave').textContent='Save';
    showStatus('Error saving');
  });
}

function doPrint(size){
  var existing=document.getElementById('pairingPrintStyle');
  if(existing)existing.remove();
  var style=document.createElement('style');
  style.id='pairingPrintStyle';
  if(size==='statement')style.textContent='@page{size:5.5in 8.5in;margin:0.6in 0.5in}';
  else style.textContent='@page{size:A4;margin:0.8in 0.6in}';
  document.head.appendChild(style);
  setTimeout(function(){window.print();},200);
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showStatus(msg){var el=document.getElementById('statusMsg');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2500);}
</script>
</body>
</html>
