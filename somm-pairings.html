<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Pairings — Petrus Sommeliers</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--grn:#5c1a1a;--grn2:#2d0a0a;--gld:#b89650;--crm:#faf7f1;--pink:#f8e8e8;--s:'Inter',sans-serif;--f:'Cormorant Garamond',serif}
body{font-family:var(--s);background:var(--crm);color:#2c2c2c;min-height:100vh}
.tb{background:var(--grn2);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.tb a{color:var(--gld);text-decoration:none;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.tb h2{font-family:var(--f);color:#fff;font-size:18px}
.pg{max-width:900px;margin:0 auto;padding:20px 14px 60px}
.pg>h1{font-family:var(--f);font-size:26px;color:var(--grn);margin-bottom:14px}
/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:6px 14px;border:1px solid rgba(92,26,26,0.2);border-radius:14px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;background:var(--pink);color:var(--grn);transition:all .15s}
.tab:hover{background:#f0d4d4;border-color:var(--grn)}
.tab.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.sub-tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.stab{padding:4px 10px;border:1px solid #ddd;border-radius:10px;font-size:9px;cursor:pointer;background:#fff;color:#666}
.stab:hover{border-color:var(--gld);color:var(--grn)}
.stab.on{background:var(--gld);color:#fff;border-color:var(--gld)}
.wine-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.wtab{padding:4px 10px;border:1px solid rgba(92,26,26,0.15);border-radius:10px;font-size:9px;cursor:pointer;background:var(--pink);color:var(--grn)}
.wtab:hover{border-color:var(--grn)}
.wtab.on{background:var(--grn2);color:#fff;border-color:var(--grn2)}
/* Editor */
.box{background:#fff;border:1px solid #e8e0d4;border-radius:8px;padding:16px;margin-bottom:14px}
.course{border:1px solid #f0ebe5;border-radius:6px;padding:12px;margin-bottom:12px;background:#fdfbf8}
.course-dish{font-family:var(--f);font-size:15px;font-weight:600;color:var(--grn2)}
.course-desc{font-family:var(--f);font-size:12px;color:#555;font-style:italic;margin-top:2px}
.wine-fields{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed #e8e0d4}
.wine-fields input{padding:5px 8px;border:1px solid #ddd;border-radius:4px;font-size:11px;font-family:var(--s);outline:none;flex:1;min-width:80px}
.wine-fields input:focus{border-color:var(--gld)}
.wine-fields .vintage{flex:0 0 55px}
/* Footer config */
.footer-config{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.footer-config select{padding:5px 8px;border:1px solid #ddd;border-radius:4px;font-size:11px;font-family:var(--s)}
/* Actions */
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{padding:6px 14px;border:none;border-radius:4px;font-size:10px;cursor:pointer;font-family:var(--s);text-transform:uppercase;letter-spacing:.5px}
.btn-primary{background:var(--grn);color:#fff}
.btn-primary:hover{background:var(--grn2)}
.print-btn{padding:6px 14px;border:1px solid rgba(92,26,26,0.2);border-radius:4px;font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;background:var(--pink);color:var(--grn)}
.print-btn:hover{background:var(--grn);color:#fff}
.meta{font-size:9px;color:#999;font-style:italic;margin-top:8px}
.em{text-align:center;padding:20px;color:#ccc;font-size:11px}
/* Print */
.print-area{display:none}
.print-page{width:100%;background:white;padding:20mm 25mm;font-family:var(--f);text-align:center;page-break-after:always}
.print-page.statement{padding:12mm 18mm}
.print-logo{width:50px;height:50px;background:var(--grn);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.print-logo span{color:var(--gld);font-family:var(--f);font-size:22px;font-weight:700}
.print-title{font-family:var(--f);font-size:24px;color:var(--grn2);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
.print-subtitle{font-size:11px;color:var(--gld);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;font-family:var(--s);font-weight:600}
.print-course{margin-bottom:18px}
.print-dish{font-family:var(--f);font-size:15px;font-weight:700;color:var(--grn2);margin-bottom:2px}
.print-desc{font-family:var(--f);font-size:12px;color:#555;font-style:italic;margin-bottom:4px}
.print-wine{font-family:var(--f);font-size:10px;font-style:italic;color:var(--gld);letter-spacing:.3px}
.print-divider{color:#ccc;font-size:10px;margin:10px 0}
.print-footer{margin-top:30px;padding-top:14px;border-top:1px solid #e8e0d4}
.print-footer .name{font-family:var(--f);font-size:14px;color:var(--grn2);font-weight:600}
.print-footer .role{font-family:var(--s);font-size:9px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
@media print{
  body{background:white;padding:0;margin:0}
  .tb,.pg{display:none !important}
  .print-area{display:block !important}
  .print-area.active{display:block !important}
  @page{margin:0}
}
.sm{position:fixed;bottom:20px;right:20px;background:var(--grn);color:var(--crm);padding:10px 16px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .3s;z-index:9999}
.sm.show{opacity:1}
</style>
</head>
<body>
<div class="tb"><a href="sommeliers.html">&larr; Back</a><h2>Petrus</h2><span></span></div>
<div class="pg">
<h1>Wine Pairings</h1>
<div class="tabs" id="menuTabs"></div>
<div class="sub-tabs" id="variantTabs"></div>
<div class="wine-tabs" id="wineTabs"></div>
<div class="footer-config">
  <select id="footerName">
    <option value="">Signature...</option>
    <option value="Fiorella Atencio">Fiorella Atencio</option>
    <option value="Christian Holthausen">Christian Holthausen</option>
    <option value="Milena Butkovic">Milena Butkovic</option>
  </select>
  <select id="footerRole">
    <option value="Sommelier">Sommelier</option>
    <option value="Head Sommelier">Head Sommelier</option>
    <option value="Senior Sommelier">Senior Sommelier</option>
    <option value="Assistant Sommelier">Assistant Sommelier</option>
  </select>
</div>
<div class="actions" style="margin-bottom:14px">
  <button class="print-btn" onclick="printPairing('a4')">Print A4</button>
  <button class="print-btn" onclick="printPairing('statement')">Print Statement</button>
</div>
<div class="box" id="editorArea"><div class="em">Select a menu to load</div></div>
</div>
<div class="print-area" id="printArea"></div>
<div class="sm" id="sm"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script>
var U=null;
var MENU='prestige';
var VARIANT='normal';
var WINE='matching';

var MENUS=[{id:'prestige',label:'Prestige'},{id:'discovery',label:'Discovery'},{id:'lunch',label:'Lunch Menu'},{id:'alc',label:'ALC'},{id:'kt',label:'Kitchen Table'}];
var VARIANTS=[{id:'normal',label:'Normal'},{id:'pescatarian',label:'Pescatarian'},{id:'vegetarian',label:'Vegetarian'},{id:'no-seafood',label:'No Seafood'}];
var WINES=[{id:'matching',label:'Matching'},{id:'connoisseur',label:'Connoisseur'},{id:'indulgence',label:'Indulgence'},{id:'kt-matching',label:'KT Matching',onlyFor:'kt'}];

var menuCourses=[];  // from menus collection (read-only)
var pairingWines={}; // editable wines keyed by course index
var docMeta={lastEditBy:'',lastEditDate:''};

auth.onAuthStateChanged(function(u){
  if(!u){window.location.href='index.html';return;}
  U=u;logAccess(u,'page_view','somm-pairings.html');
  renderAllTabs();loadData();
});

function setMenu(m){MENU=m;VARIANT='normal';WINE='matching';renderAllTabs();loadData();}
function setVariant(v){VARIANT=v;renderAllTabs();loadData();}
function setWine(w){WINE=w;renderAllTabs();loadPairings();}

function renderAllTabs(){
  // Menu tabs
  var h='';
  MENUS.forEach(function(m){h+='<span class="tab'+(MENU===m.id?' on':'')+'" onclick="setMenu(\''+m.id+'\')">'+m.label+'</span>';});
  document.getElementById('menuTabs').innerHTML=h;
  // Variant tabs
  var vh='';
  VARIANTS.forEach(function(v){vh+='<span class="stab'+(VARIANT===v.id?' on':'')+'" onclick="setVariant(\''+v.id+'\')">'+v.label+'</span>';});
  document.getElementById('variantTabs').innerHTML=vh;
  // Wine tabs
  var wh='';
  WINES.forEach(function(w){
    if(w.onlyFor&&w.onlyFor!==MENU)return;
    wh+='<span class="wtab'+(WINE===w.id?' on':'')+'" onclick="setWine(\''+w.id+'\')">'+w.label+'</span>';
  });
  document.getElementById('wineTabs').innerHTML=wh;
}

function getMenuDocId(){return MENU+'_'+VARIANT;}
function getPairingDocId(){return MENU+'_'+VARIANT+'_'+WINE;}

function loadData(){
  // Load menu courses from menus collection
  var docId=getMenuDocId();
  db.collection('menus').doc(docId).get().then(function(doc){
    if(doc.exists){
      var d=doc.data();
      menuCourses=d.courses||[];
    }else{
      menuCourses=[];
    }
    loadPairings();
  }).catch(function(e){
    console.error('Error loading menu:',e);
    menuCourses=[];
    loadPairings();
  });
}

function loadPairings(){
  var docId=getPairingDocId();
  db.collection('somm_pairings').doc(docId).get().then(function(doc){
    if(doc.exists){
      var d=doc.data();
      pairingWines=d.wines||{};
      docMeta.lastEditBy=d.lastEditBy||'';
      docMeta.lastEditDate=d.lastEditDate||'';
      if(d.footerName)document.getElementById('footerName').value=d.footerName;
      if(d.footerRole)document.getElementById('footerRole').value=d.footerRole;
    }else{
      pairingWines={};
      docMeta={lastEditBy:'',lastEditDate:''};
    }
    renderEditor();
  }).catch(function(e){
    console.error('Error loading pairings:',e);
    pairingWines={};
    renderEditor();
  });
}

function renderEditor(){
  var area=document.getElementById('editorArea');
  if(menuCourses.length===0){
    area.innerHTML='<div class="em">No menu found for this combination. Create it first in Operations → Menus.</div>';
    return;
  }
  var h='';
  for(var i=0;i<menuCourses.length;i++){
    var c=menuCourses[i];
    var w=pairingWines[i]||{producer:'',wine:'',region:'',vintage:''};
    h+='<div class="course">';
    h+='<div class="course-dish">'+esc(c.dish||'')+'</div>';
    if(c.desc)h+='<div class="course-desc">'+esc(c.desc)+'</div>';
    h+='<div class="wine-fields">';
    h+='<input type="text" value="'+escAttr(w.producer)+'" placeholder="Producer" onchange="updateWine('+i+',\'producer\',this.value)">';
    h+='<input type="text" value="'+escAttr(w.wine)+'" placeholder="Wine name" onchange="updateWine('+i+',\'wine\',this.value)">';
    h+='<input type="text" value="'+escAttr(w.region)+'" placeholder="Region, Country" onchange="updateWine('+i+',\'region\',this.value)">';
    h+='<input type="text" class="vintage" value="'+escAttr(w.vintage)+'" placeholder="Year" onchange="updateWine('+i+',\'vintage\',this.value)">';
    h+='</div></div>';
  }
  h+='<div class="actions"><button class="btn btn-primary" onclick="save()">Save</button></div>';
  if(docMeta.lastEditBy){
    h+='<div class="meta">Last edited by '+esc(docMeta.lastEditBy)+' — '+esc(docMeta.lastEditDate)+'</div>';
  }
  area.innerHTML=h;
}

function updateWine(i,field,val){
  if(!pairingWines[i])pairingWines[i]={producer:'',wine:'',region:'',vintage:''};
  pairingWines[i][field]=val;
}

function save(){
  var author=U.displayName||U.email.split('@')[0].replace(/\./g,' ');
  author=author.charAt(0).toUpperCase()+author.slice(1);
  var now=new Date();
  var dateStr=now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  var footerName=document.getElementById('footerName').value;
  var footerRole=document.getElementById('footerRole').value;
  db.collection('somm_pairings').doc(getPairingDocId()).set({
    menu:MENU,variant:VARIANT,wine:WINE,
    wines:pairingWines,
    footerName:footerName,
    footerRole:footerRole,
    lastEditBy:author,
    lastEditDate:dateStr,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    docMeta.lastEditBy=author;docMeta.lastEditDate=dateStr;
    renderEditor();msg('Saved');
  });
}

function printPairing(size){
  var menuLabel=MENUS.find(function(m){return m.id===MENU;}).label;
  var wineLabel=WINES.find(function(w){return w.id===WINE;}).label;
  var footerName=document.getElementById('footerName').value||'';
  var footerRole=document.getElementById('footerRole').value||'Sommelier';

  var pageClass=size==='statement'?'print-page statement':'print-page';
  var h='<div class="'+pageClass+'">';
  h+='<div class="print-logo"><span>P</span></div>';
  h+='<div class="print-title">Petrus</div>';
  h+='<div class="print-subtitle">'+menuLabel.toUpperCase()+' — '+wineLabel.toUpperCase()+'</div>';

  for(var i=0;i<menuCourses.length;i++){
    var c=menuCourses[i];
    var w=pairingWines[i]||{};
    if(!c.dish&&!w.wine)continue;
    if(i>0)h+='<div class="print-divider">~</div>';
    h+='<div class="print-course">';
    if(c.dish)h+='<div class="print-dish">'+esc(c.dish)+'</div>';
    if(c.desc)h+='<div class="print-desc">'+esc(c.desc)+'</div>';
    var wineParts=[];
    if(w.producer)wineParts.push(w.producer);
    if(w.wine)wineParts.push(w.wine);
    if(w.region)wineParts.push(w.region);
    if(w.vintage)wineParts.push(w.vintage);
    if(wineParts.length)h+='<div class="print-wine">'+esc(wineParts.join(', '))+'</div>';
    h+='</div>';
  }

  if(footerName){
    h+='<div class="print-footer"><div class="name">'+esc(footerName)+'</div><div class="role">'+esc(footerRole)+'</div></div>';
  }
  h+='</div>';

  var area=document.getElementById('printArea');
  area.innerHTML=h;
  area.classList.add('active');

  var existing=document.getElementById('pairingPrintStyle');
  if(existing)existing.remove();
  var style=document.createElement('style');
  style.id='pairingPrintStyle';
  if(size==='statement')style.textContent='@page{size:5.5in 8.5in;margin:0}';
  else style.textContent='@page{size:A4;margin:0}';
  document.head.appendChild(style);

  setTimeout(function(){window.print();},300);
  setTimeout(function(){area.classList.remove('active');},1000);
}

function esc(s){if(!s)return '';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){if(!s)return '';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function msg(t){var el=document.getElementById('sm');el.textContent=t;el.className='sm show';setTimeout(function(){el.className='sm';},1800);}
</script>
</body>
</html>
