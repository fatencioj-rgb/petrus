<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Pairings — Petrus Sommeliers</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--grn:#5c1a1a;--grn2:#2d0a0a;--gld:#b89650;--crm:#faf7f1;--pink:#f8e8e8;--s:'Inter',sans-serif;--f:'Cormorant Garamond',serif}
body{font-family:var(--s);background:var(--crm);color:#2c2c2c;min-height:100vh}
.tb{background:var(--grn2);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.tb a{color:var(--gld);text-decoration:none;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.tb h2{font-family:var(--f);color:#fff;font-size:18px}
.pg{max-width:900px;margin:0 auto;padding:20px 14px 60px}
.pg>h1{font-family:var(--f);font-size:26px;color:var(--grn);margin-bottom:14px}
/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 14px;border:1px solid rgba(92,26,26,0.2);border-radius:14px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;background:var(--pink);color:var(--grn);transition:all .15s}
.tab:hover{background:#f0d4d4;border-color:var(--grn)}
.tab.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.sub-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.stab{padding:4px 10px;border:1px solid #ddd;border-radius:10px;font-size:9px;cursor:pointer;background:#fff;color:#666}
.stab:hover{border-color:var(--gld);color:var(--grn)}
.stab.on{background:var(--gld);color:#fff;border-color:var(--gld)}
/* Editor */
.box{background:#fff;border:1px solid #e8e0d4;border-radius:8px;padding:16px;margin-bottom:14px}
.course{border:1px solid #f0ebe5;border-radius:6px;padding:12px;margin-bottom:10px;background:#fdfbf8}
.course-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.course-num{font-family:var(--f);font-size:14px;color:var(--gld);font-weight:600;min-width:20px}
.course-fields{display:grid;gap:6px}
.course-fields input{padding:5px 8px;border:1px solid #ddd;border-radius:4px;font-size:11px;font-family:var(--s);outline:none;width:100%}
.course-fields input:focus{border-color:var(--gld)}
.course-fields .dish-name{font-weight:600;font-size:12px}
.wine-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;padding-top:6px;border-top:1px dashed #e8e0d4}
.wine-row input{flex:1;min-width:80px}
.wine-row .vintage{flex:0 0 60px}
.btn{padding:5px 14px;border:none;border-radius:4px;font-size:10px;cursor:pointer;font-family:var(--s);text-transform:uppercase;letter-spacing:.5px}
.btn-primary{background:var(--grn);color:#fff}
.btn-primary:hover{background:var(--grn2)}
.btn-sm{padding:3px 8px;font-size:8px;background:var(--pink);color:var(--grn);border:1px solid rgba(92,26,26,0.2);border-radius:3px;cursor:pointer}
.btn-sm:hover{background:var(--grn);color:#fff}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.meta{font-size:9px;color:#999;font-style:italic;margin-top:8px}
/* Print buttons */
.print-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.print-btn{padding:6px 14px;border:1px solid rgba(92,26,26,0.2);border-radius:4px;font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;background:var(--pink);color:var(--grn)}
.print-btn:hover{background:var(--grn);color:#fff}
/* Print styles */
.print-area{display:none}
.print-page{width:100%;background:white;padding:20mm 25mm;font-family:var(--f);text-align:center;page-break-after:always}
.print-page.statement{padding:10mm 15mm}
.print-logo{width:30px;height:30px;background:var(--grn);border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.print-logo span{color:var(--gld);font-family:var(--f);font-size:14px;font-weight:700}
.print-title{font-family:var(--f);font-size:22px;color:var(--grn2);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
.print-subtitle{font-size:11px;color:var(--gld);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;font-family:var(--s);font-weight:600}
.print-course{margin-bottom:16px}
.print-dish{font-family:var(--f);font-size:14px;font-weight:700;color:var(--grn2);margin-bottom:2px}
.print-desc{font-family:var(--f);font-size:11px;color:#555;font-style:italic;margin-bottom:3px}
.print-wine{font-family:var(--s);font-size:9px;color:var(--gld);letter-spacing:.3px}
.print-divider{color:#ccc;font-size:10px;margin:8px 0}
.print-footer{margin-top:24px;padding-top:12px;border-top:1px solid #e8e0d4}
.print-footer .name{font-family:var(--f);font-size:13px;color:var(--grn2);font-weight:600}
.print-footer .role{font-family:var(--s);font-size:9px;color:#888;letter-spacing:1px;text-transform:uppercase}
@media print{
  body{background:white;padding:0;margin:0}
  .tb,.pg>h1,.tabs,.sub-tabs,.box,.print-btns{display:none !important}
  .print-area{display:block !important}
  .print-area.active{display:block !important}
  @page{margin:0}
}
.sm{position:fixed;bottom:20px;right:20px;background:var(--grn);color:var(--crm);padding:10px 16px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .3s;z-index:9999}
.sm.show{opacity:1}
</style>
</head>
<body>
<div class="tb"><a href="sommeliers.html">&larr; Back</a><h2>Petrus</h2><span></span></div>
<div class="pg">
<h1>Wine Pairings</h1>
<div class="tabs" id="menuTabs"></div>
<div class="sub-tabs" id="wineTabs"></div>
<div class="print-btns">
  <button class="print-btn" onclick="printPairing('a4')">Print A4</button>
  <button class="print-btn" onclick="printPairing('statement')">Print Statement</button>
</div>
<div class="box" id="editorArea"></div>
</div>
<div class="print-area" id="printArea"></div>
<div class="sm" id="sm"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script>
var U=null;
var MENU='prestige';
var WINE='matching';
var MENUS=[{id:'prestige',label:'Prestige'},{id:'discovery',label:'Discovery'},{id:'lunch',label:'Lunch Menu'},{id:'alc',label:'ALC'},{id:'kt',label:'Kitchen Table'}];
var WINES=[{id:'matching',label:'Matching'},{id:'connoisseur',label:'Connoisseur'},{id:'indulgence',label:'Indulgence'},{id:'kt-matching',label:'KT Matching',onlyFor:'kt'}];
var courses=[];
var docMeta={lastEditBy:'',lastEditDate:''};

auth.onAuthStateChanged(function(u){
  if(!u){window.location.href='index.html';return;}
  U=u;logAccess(u,'page_view','somm-pairings.html');
  renderTabs();load();
});

function setMenu(m){MENU=m;WINE='matching';renderTabs();load();}
function setWine(w){WINE=w;renderTabs();load();}

function renderTabs(){
  var h='';
  MENUS.forEach(function(m){h+='<span class="tab'+(MENU===m.id?' on':'')+'" onclick="setMenu(\''+m.id+'\')">'+m.label+'</span>';});
  document.getElementById('menuTabs').innerHTML=h;
  var wh='';
  WINES.forEach(function(w){
    if(w.onlyFor&&w.onlyFor!==MENU)return;
    wh+='<span class="stab'+(WINE===w.id?' on':'')+'" onclick="setWine(\''+w.id+'\')">'+w.label+'</span>';
  });
  document.getElementById('wineTabs').innerHTML=wh;
}

function getDocId(){return MENU+'_'+WINE;}

function load(){
  db.collection('somm_pairings').doc(getDocId()).get().then(function(doc){
    if(doc.exists){
      var d=doc.data();
      courses=d.courses||[];
      docMeta.lastEditBy=d.lastEditBy||'';
      docMeta.lastEditDate=d.lastEditDate||'';
    }else{
      courses=[{dish:'',desc:'',producer:'',wine:'',region:'',vintage:''}];
      docMeta={lastEditBy:'',lastEditDate:''};
    }
    renderEditor();
  });
}

function renderEditor(){
  var h='';
  for(var i=0;i<courses.length;i++){
    var c=courses[i];
    h+='<div class="course"><div class="course-head"><span class="course-num">'+(i+1)+'</span><button class="btn-sm" onclick="removeCourse('+i+')" title="Remove">&times;</button></div>';
    h+='<div class="course-fields">';
    h+='<input type="text" class="dish-name" value="'+esc(c.dish)+'" placeholder="Dish name" onchange="updateCourse('+i+',\'dish\',this.value)">';
    h+='<input type="text" value="'+esc(c.desc)+'" placeholder="Description (ingredients, garnish)" onchange="updateCourse('+i+',\'desc\',this.value)">';
    h+='<div class="wine-row">';
    h+='<input type="text" value="'+esc(c.producer)+'" placeholder="Producer" onchange="updateCourse('+i+',\'producer\',this.value)">';
    h+='<input type="text" value="'+esc(c.wine)+'" placeholder="Wine name" onchange="updateCourse('+i+',\'wine\',this.value)">';
    h+='<input type="text" value="'+esc(c.region)+'" placeholder="Region, Country" onchange="updateCourse('+i+',\'region\',this.value)">';
    h+='<input type="text" class="vintage" value="'+esc(c.vintage)+'" placeholder="Year" onchange="updateCourse('+i+',\'vintage\',this.value)">';
    h+='</div></div></div>';
  }
  h+='<div class="actions">';
  h+='<button class="btn btn-primary" onclick="addCourse()">+ Add course</button>';
  h+='<button class="btn btn-primary" onclick="save()">Save</button>';
  h+='</div>';
  if(docMeta.lastEditBy){
    h+='<div class="meta">Last edited by '+docMeta.lastEditBy+' — '+docMeta.lastEditDate+'</div>';
  }
  document.getElementById('editorArea').innerHTML=h;
}

function updateCourse(i,field,val){courses[i][field]=val;}
function addCourse(){courses.push({dish:'',desc:'',producer:'',wine:'',region:'',vintage:''});renderEditor();}
function removeCourse(i){courses.splice(i,1);renderEditor();}

function save(){
  var author=U.displayName||U.email.split('@')[0].replace(/\./g,' ');
  author=author.charAt(0).toUpperCase()+author.slice(1);
  var now=new Date();
  var dateStr=now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  db.collection('somm_pairings').doc(getDocId()).set({
    menu:MENU,wine:WINE,
    courses:courses,
    lastEditBy:author,
    lastEditDate:dateStr,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    docMeta.lastEditBy=author;docMeta.lastEditDate=dateStr;
    renderEditor();msg('Saved');
  });
}

function printPairing(size){
  var menuLabel=MENUS.find(function(m){return m.id===MENU;}).label;
  var wineLabel=WINES.find(function(w){return w.id===WINE;}).label;
  var author=U.displayName||U.email.split('@')[0].replace(/\./g,' ');
  author=author.split(' ').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');

  var pageClass=size==='statement'?'print-page statement':'print-page';
  var h='<div class="'+pageClass+'">';
  h+='<div class="print-logo"><span>P</span></div>';
  h+='<div class="print-title">Petrus</div>';
  h+='<div class="print-subtitle">'+menuLabel.toUpperCase()+' — '+wineLabel.toUpperCase()+'</div>';

  for(var i=0;i<courses.length;i++){
    var c=courses[i];
    if(!c.dish&&!c.wine)continue;
    if(i>0)h+='<div class="print-divider">~</div>';
    h+='<div class="print-course">';
    if(c.dish)h+='<div class="print-dish">'+esc(c.dish)+'</div>';
    if(c.desc)h+='<div class="print-desc">'+esc(c.desc)+'</div>';
    if(c.wine||c.producer){
      var wineParts=[];
      if(c.producer)wineParts.push(c.producer);
      if(c.wine)wineParts.push(c.wine);
      if(c.region)wineParts.push(c.region);
      if(c.vintage)wineParts.push(c.vintage);
      h+='<div class="print-wine">'+esc(wineParts.join(', '))+'</div>';
    }
    h+='</div>';
  }

  h+='<div class="print-footer"><div class="name">'+esc(author)+'</div><div class="role">Sommelier</div></div>';
  h+='</div>';

  var area=document.getElementById('printArea');
  area.innerHTML=h;
  area.classList.add('active');

  // Set page size
  var existing=document.getElementById('pairingPrintStyle');
  if(existing)existing.remove();
  var style=document.createElement('style');
  style.id='pairingPrintStyle';
  if(size==='statement')style.textContent='@page{size:5.5in 8.5in;margin:0}';
  else style.textContent='@page{size:A4;margin:0}';
  document.head.appendChild(style);

  setTimeout(function(){window.print();},300);
  setTimeout(function(){area.classList.remove('active');},1000);
}

function esc(s){if(!s)return '';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function msg(t){var el=document.getElementById('sm');el.textContent=t;el.className='sm show';setTimeout(function(){el.className='sm';},1800);}
</script>
</body>
</html>
