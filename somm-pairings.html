<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Pairings — Petrus</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #5c1a1a; --green-dark: #2d0a0a;
  --gold: #b89650; --gold-light: #d4b87a; --cream: #faf7f1;
  --sans: 'Inter', sans-serif; --serif: 'Cormorant Garamond', serif;
}
body { font-family: var(--sans); background: var(--cream); color: #2c2c2c; min-height: 100vh; }
.top-bar { background: var(--green-dark); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
.top-bar a { color: var(--gold); text-decoration: none; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.top-bar a:hover { color: #fff; }
.top-bar h2 { font-family: var(--serif); color: #fff; font-size: 18px; margin: 0; }
.content { max-width: 1400px; margin: 32px auto; padding: 0 20px; }
.content > h1 { font-family: var(--serif); font-size: 32px; color: var(--green); margin-bottom: 8px; }
.content > .subtitle { font-size: 13px; color: #888; margin-bottom: 28px; }
.selectors { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; align-items: flex-start; padding-bottom: 50px; }
.selectors select { padding: 10px 14px; border: 1px solid #d4b87a; border-radius: 6px; font-family: var(--sans); font-size: 13px; background: #fff; color: #333; cursor: pointer; outline: none; min-width: 160px; }
.selectors select:focus { border-color: var(--green); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
.btn { padding: 10px 20px; border-radius: 6px; font-family: var(--sans); font-size: 12px; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; border: none; }
.btn-gold { background: var(--green); color: #fff; }
.btn-gold:hover { background: var(--green-dark); }
.btn-outline { background: transparent; border: 1px solid var(--green); color: var(--green); }
.btn-outline:hover { background: var(--green); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.size-choice { position: absolute; top: 100%; left: 0; margin-top: 4px; display: flex; flex-direction: column; gap: 4px; z-index: 100; }
.size-btn { padding: 8px 20px; width: 120px; border: 1px solid var(--green); border-radius: 4px; background: #fff; color: var(--green); font-family: var(--sans); font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; text-align: center; }
.size-btn:hover { background: var(--green); color: #fff; }
</style>
<style>
/* Preview */
.split-view { display: flex; gap: 24px; align-items: flex-start; }
.split-left { flex: 1; min-width: 0; position: sticky; top: 20px; }
.split-right { flex: 1; min-width: 0; }
.menu-preview { background: #fff; border: 1px solid #e8e0d4; border-radius: 8px; padding: 48px 32px; min-height: 500px; text-align: center; }
.preview-logo { display: block; width: 120px; height: auto; margin: 0 auto 20px; }
.menu-title { font-family: var(--serif); font-size: 18px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: #1a1a1a; margin-bottom: 6px; }
.menu-subtitle { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.menu-date { font-family: var(--serif); font-size: 12px; font-weight: 300; font-style: italic; color: #555; margin-bottom: 32px; }
.no-date-spacer { margin-bottom: 36px; }
.course-separator { font-size: 14px; color: #999; margin: 16px 0; user-select: none; }
.course-dish { font-family: var(--serif); font-size: 17px; font-weight: 600; color: #1a1a1a; line-height: 1.3; }
.course-desc { font-family: var(--serif); font-size: 15px; font-weight: 300; font-style: italic; color: #333; margin-top: 2px; }
.course-wine { font-family: var(--serif); font-size: 13px; font-style: italic; color: var(--gold); margin-top: 6px; }
.preview-footer { margin-top: 32px; }
.preview-footer .name { font-family: var(--serif); font-size: 14px; font-weight: 600; color: #1a1a1a; }
.preview-footer .role { font-family: var(--sans); font-size: 9px; color: #888; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
/* Editor */
.editor-panel { background: #f5f0e8; border: 1px solid #e0d5c5; border-radius: 8px; padding: 20px; display: none; }
.editor-panel h3 { font-family: var(--serif); font-size: 20px; color: var(--green); margin-bottom: 16px; }
.editor-section { margin-bottom: 20px; }
.editor-section h4 { font-family: var(--sans); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.course-editor { margin-bottom: 12px; padding: 12px; background: #fff; border-radius: 6px; border: 1px solid #e8e0d4; }
.course-editor label { display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #999; margin-bottom: 3px; }
.course-editor input { width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 4px; font-family: var(--sans); font-size: 13px; outline: none; margin-bottom: 6px; }
.course-editor input:focus { border-color: var(--gold); }
.wine-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; padding-top: 8px; border-top: 1px dashed #e8e0d4; }
.add-course-btn { width: 100%; padding: 10px; border: 2px dashed var(--gold); background: transparent; border-radius: 6px; color: var(--gold); font-size: 13px; cursor: pointer; margin-top: 8px; }
.add-course-btn:hover { background: rgba(184,150,80,0.08); }
.remove-course { float: right; background: none; border: none; color: #c0392b; font-size: 16px; cursor: pointer; }
.course-dish-label { font-family: var(--serif); font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; }
.course-desc-label { font-family: var(--serif); font-size: 12px; font-style: italic; color: #555; margin-bottom: 8px; }
.course-save-btn { margin-top: 6px; padding: 4px 12px; background: var(--green); color: #fff; border: none; border-radius: 4px; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; }
.course-save-btn:hover { background: var(--green-dark); }
.somm-selector { margin-top: 16px; padding-top: 12px; border-top: 1px solid #e0d5c5; }
.somm-selector h4 { font-family: var(--sans); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.somm-options { display: flex; gap: 8px; flex-wrap: wrap; }
.somm-opt { padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 11px; cursor: pointer; background: #fff; transition: all 0.15s; }
.somm-opt:hover { border-color: var(--gold); }
.somm-opt.active { background: var(--green); color: #fff; border-color: var(--green); }.meta-info { font-size: 11px; color: #888; font-style: italic; margin-top: 12px; padding-top: 10px; border-top: 1px solid #e0d5c5; }
.status-msg { position: fixed; bottom: 24px; right: 24px; background: var(--green); color: var(--cream); padding: 12px 20px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity 0.3s; z-index: 9999; }
.status-msg.show { opacity: 1; }
</style>
<style>
@media print {
  body { background: #fff !important; margin: 0; padding: 0; }
  .top-bar, .content > h1, .content > .subtitle, .selectors, .actions, .editor-panel, .status-msg, .split-right, #menuPreviewPlaceholder { display: none !important; }
  .content { max-width: 100%; margin: 0; padding: 0; }
  .split-view { display: block !important; }
  .split-left { position: static; }
  .menu-preview { border: none !important; border-radius: 0 !important; padding: 0 !important; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .preview-logo { width: 90px; margin-bottom: 14px; }
  .menu-title { font-size: 18px; margin-bottom: 4px; }
  .menu-subtitle { font-size: 9px; margin-bottom: 28px; }
  .course-dish { font-size: 15px; }
  .course-desc { font-size: 13px; }
  .course-wine { font-size: 11px; }
  .course-separator { margin: 12px 0; }
  .preview-footer .name { font-size: 12px; }
}
@media (max-width: 600px) {
  .selectors { flex-direction: column; }
  .selectors select { min-width: 100%; }
  .menu-preview { padding: 32px 16px; }
  .split-view { flex-direction: column; }
  .split-left { position: static; }
  .split-right { max-height: none; }
  .wine-fields { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="top-bar">
  <a href="sommeliers.html">&larr; Back</a>
  <h2>Petrus</h2>
  <span></span>
</div>
<div class="content">
  <h1>Wine Pairings</h1>
  <p class="subtitle">Select a menu and pairing to view, edit, or print for service.</p>
  <div class="selectors" style="align-items:center">
    <select id="menuType">
      <option value="">— Select Menu —</option>
      <option value="prestige">Prestige</option>
      <option value="discovery">Discovery</option>
      <option value="lunch">Lunch Menu</option>
      <option value="alc">À la Carte</option>
      <option value="kt">Kitchen Table</option>
    </select>
    <select id="menuDiet" style="display:none"><option value="regular">Regular</option></select>
    <select id="menuVariant"><option value="">— Pairing —</option></select>
    <button class="btn btn-outline" id="btnLoad" disabled onclick="loadMenu()">Load Menu</button>
    <div style="position:relative;display:inline-block">
      <button class="btn btn-gold" id="btnPrint" disabled onclick="showSizeChoice('print')">Print</button>
      <div class="size-choice" id="sizeChoicePrint" style="display:none">
        <button class="size-btn" onclick="execWithSize('statement')">Statement</button>
        <button class="size-btn" onclick="execWithSize('a4')">A4</button>
      </div>
    </div>
    <div style="position:relative;display:inline-block">
      <button class="btn btn-gold" id="btnPdf" disabled onclick="showSizeChoice('pdf')">Download</button>
      <div class="size-choice" id="sizeChoicePdf" style="display:none">
        <button class="size-btn" onclick="execWithSize('statement')">Statement</button>
        <button class="size-btn" onclick="execWithSize('a4')">A4</button>
      </div>
    </div>
    <div style="position:relative;display:inline-block">
      <button class="btn btn-gold" id="btnEmail" disabled onclick="showSizeChoice('email')">Email</button>
      <div class="size-choice" id="sizeChoiceEmail" style="display:none">
        <button class="size-btn" onclick="execWithSize('statement')">Statement</button>
        <button class="size-btn" onclick="execWithSize('a4')">A4</button>
      </div>
    </div>
    <button class="btn btn-gold" id="btnSave" style="display:none" onclick="saveMenu()">Save Changes</button>
    <button class="btn btn-outline" id="btnEdit" style="display:none" onclick="showEditor()">Edit</button>
    <button class="btn btn-outline" id="btnCloseEdit" style="display:none" onclick="hideEditor()">Close Editor</button>
  </div>
  <!-- List view (shown by default after load) -->
  <div id="listView" style="display:none">
    <div class="menu-preview" id="listPreview" style="max-width:600px;margin:0 auto"></div>
  </div>
  <!-- Edit view (hidden until Edit clicked) -->
  <div class="split-view" id="splitView" style="display:none;">
    <div class="split-left">
      <div class="menu-preview" id="menuPreview"></div>
    </div>
    <div class="split-right">
      <div class="editor-panel" id="editorPanel">
        <div class="date-selector" style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e0d5c5">
          <h4 style="font-family:var(--sans);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px">Date (optional)</h4>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <button id="dateToggle" class="somm-opt" onclick="toggleDate()" style="font-size:10px">Show Date</button>
            <input type="date" id="pairingDate" style="padding:6px 10px;border:1px solid #ddd;border-radius:4px;font-family:var(--sans);font-size:12px;outline:none;display:none" onchange="setDate(this.value)">
            <button id="dateClear" class="somm-opt" onclick="clearDate()" style="font-size:10px;display:none">Clear</button>
          </div>
        </div>
        <h3>Edit Pairing</h3>
        <div class="editor-section"><h4>Courses</h4><div id="courseEditors"></div>
          <button class="add-course-btn" onclick="addCourseEditor()">+ Add Course</button>
        </div>
        <div class="somm-selector">
          <h4>Sommelier</h4>
          <div class="somm-options" id="sommOptions"></div>
        </div>
        <div class="meta-info" id="metaInfo"></div>
      </div>
    </div>
  </div>
  <div class="menu-preview" id="menuPreviewPlaceholder">
    <p style="font-family:var(--serif);font-size:18px;color:#aaa;padding:80px 20px;">Select a menu above to begin</p>
  </div>
</div>
<div class="status-msg" id="statusMsg"></div>

<!-- Firebase + Auth -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
// ─── Config ─────────────────────────────────────────────────────
const MENU_CONFIG = {
  prestige:  { label:'PRESTIGE MENU', pairings:['matching','connoisseur','indulgence','3wines'], diets:['regular','pescatarian','vegetarian','noseafood'] },
  discovery: { label:'DISCOVERY MENU', pairings:['matching','connoisseur','indulgence','3wines'], diets:['regular','pescatarian','vegetarian','noseafood'] },
  lunch:     { label:'LUNCH MENU', pairings:['matching','connoisseur','indulgence','3wines'], diets:[] },
  alc:       { label:'À LA CARTE', pairings:['3wines'], diets:['regular','pescatarian','vegetarian'] },
  kt:        { label:'KITCHEN TABLE', pairings:['kt-matching','kt-connoisseur','kt-indulgence','kt-bespoke'], diets:['regular','pescatarian','vegetarian','noseafood'] }
};
const PAIRING_LABELS = {'matching':'Matching Pairing','connoisseur':'Connoisseur Pairing','indulgence':'Indulgence Pairing','3wines':'3 Wines Pairing','kt-matching':'Matching Wines','kt-connoisseur':'Connoisseur Wines','kt-indulgence':'Indulgence Wines','kt-bespoke':'Bespoke'};
const SIZE_LABELS = {'statement':'Statement (5.5 × 8.5 in)','a4':'A4 (21 × 29.7 cm)'};

let currentMenu = null;
let U = null;
let pendingAction = null; // 'print' or 'pdf'
const selType = document.getElementById('menuType');
const selVariant = document.getElementById('menuVariant');
const selDiet = document.getElementById('menuDiet');
const btnLoad = document.getElementById('btnLoad');
const btnPrint = document.getElementById('btnPrint');
const btnSave = document.getElementById('btnSave');

// ─── Auth ───────────────────────────────────────────────────────
auth.onAuthStateChanged(function(user) {
  if (!user) { window.location.href = 'index.html'; return; }
  U = user;
  logAccess(user, 'page_view', 'somm-pairings.html');
});

// ─── Selectors ──────────────────────────────────────────────────
selType.addEventListener('change', () => {
  const type = selType.value;
  selVariant.innerHTML = '<option value="">— Pairing —</option>';
  selDiet.style.display = 'none';
  btnLoad.disabled = true; btnPrint.disabled = true;
  if (!type) return;
  const cfg = MENU_CONFIG[type];
  cfg.pairings.forEach(p => { selVariant.innerHTML += `<option value="${p}">${PAIRING_LABELS[p]}</option>`; });
  // Show diet selector if menu has diets
  if (cfg.diets && cfg.diets.length > 0) {
    selDiet.innerHTML = '';
    const DIET_LABELS = {'regular':'Regular','pescatarian':'Pescatarian','vegetarian':'Vegetarian','noseafood':'No Seafood'};
    cfg.diets.forEach(d => { selDiet.innerHTML += `<option value="${d}">${DIET_LABELS[d]}</option>`; });
    selDiet.style.display = 'inline-block';
  }
  checkReady();
});
selVariant.addEventListener('change', checkReady);
selDiet.addEventListener('change', checkReady);
function checkReady() { btnLoad.disabled = !(selType.value && selVariant.value); }
</script>

<script>
// ─── LOAD ───────────────────────────────────────────────────────
async function loadMenu() {
  const type = selType.value, variant = selVariant.value;
  const diet = selDiet.value || 'regular';
  const docId = `${type}_${variant}`;
  // For Firestore, include diet in doc ID if not regular
  const firestoreId = diet === 'regular' ? docId : `${type}_${diet}_${variant}`;
  btnLoad.disabled = true; btnLoad.textContent = 'Loading...';

  let data = null;
  try { const doc = await db.collection('somm_pairings').doc(firestoreId).get(); if (doc.exists) data = doc.data(); } catch(e) { console.log('Firestore unavailable, using template'); }

  if (data) {
    currentMenu = { id: firestoreId, type, variant, diet, courses: data.courses || [], lastEditBy: data.lastEditBy || '', lastEditDate: data.lastEditDate || '', sommelier: data.sommelier || '', pairingDate: data.pairingDate || '', showDate: data.showDate || false };
  } else {
    // Try diet-specific template first, then fall back to regular
    const tplKey = diet === 'regular' ? docId : `${type}_${diet}_${variant}`;
    const tpl = TEMPLATES[tplKey] || TEMPLATES[docId];
    currentMenu = {
      id: firestoreId, type, variant, diet,
      courses: tpl ? JSON.parse(JSON.stringify(tpl)) : [{ dish:'', desc:'', producer:'', wine:'', region:'', vintage:'' }],
      lastEditBy: '', lastEditDate: '', sommelier: '', pairingDate: '', showDate: false
    };
  }
  // Set alcDiet for ALC
  if (type === 'alc') alcDiet = diet;

  renderPreview();
  renderEditor();
  renderListView();
  btnPrint.disabled = false;
  document.getElementById('btnPdf').disabled = false;
  document.getElementById('btnEmail').disabled = false;
  document.getElementById('btnEdit').style.display = 'inline-block';
  document.getElementById('btnSave').style.display = 'none';
  document.getElementById('btnCloseEdit').style.display = 'none';
  // Show list view, hide editor
  document.getElementById('listView').style.display = 'block';
  document.getElementById('splitView').style.display = 'none';
  document.getElementById('menuPreviewPlaceholder').style.display = 'none';
  btnLoad.disabled = false; btnLoad.textContent = 'Load Menu';
  showStatus('Pairing loaded');
}

// ─── RENDER PREVIEW ─────────────────────────────────────────────
const SOMMELIERS = [
  { name: 'Fiorella Atencio', role: 'Sommelier' },

];

function renderPreview() {
  if (!currentMenu) return;
  const p = document.getElementById('menuPreview');
  const menuLabel = MENU_CONFIG[currentMenu.type].label;
  const pairingLabel = PAIRING_LABELS[currentMenu.variant];

  // Get selected sommelier
  const somm = SOMMELIERS.find(s => s.name === currentMenu.sommelier) || SOMMELIERS[0];

  let h = `<img src="Petrus logo cmyk_01.jpg" alt="Petrus" class="preview-logo">`;
  h += `<div class="menu-title">${menuLabel}</div>`;
  h += `<div class="menu-subtitle">${pairingLabel}</div>`;
  if (currentMenu.showDate && currentMenu.pairingDate) {
    h += `<div class="menu-date">${formatDateFancy(currentMenu.pairingDate)}</div>`;
  } else {
    h += `<div class="no-date-spacer"></div>`;
  }

  (currentMenu.courses || []).forEach((c, i) => {
    if (i > 0) h += '<div class="course-separator">~</div>';
    h += '<div class="course-block">';
    h += c.dish ? `<div class="course-dish">${esc(c.dish)}</div>` : '<div class="course-dish" style="color:#ccc">· · ·</div>';
    if (c.desc) h += `<div class="course-desc">${esc(c.desc)}</div>`;
    if (c.wine || c.producer) {
      let parts = [];
      if (c.producer) parts.push(c.producer);
      if (c.wine) parts.push(c.wine);
      if (c.region) parts.push(c.region);
      if (c.vintage) parts.push(c.vintage);
      h += `<div class="course-wine">${esc(parts.join(', '))}</div>`;
    }
    if (c.wine2 || c.producer2) {
      let parts2 = [];
      if (c.producer2) parts2.push(c.producer2);
      if (c.wine2) parts2.push(c.wine2);
      if (c.region2) parts2.push(c.region2);
      if (c.vintage2) parts2.push(c.vintage2);
      h += `<div class="course-wine">${esc(parts2.join(', '))}</div>`;
    }
    h += '</div>';
  });

  h += `<div class="preview-footer"><div class="name">${esc(somm.name)}</div><div class="role">${somm.role}</div></div>`;
  p.innerHTML = h;
}

function buildWineLibrary() {
  const wines = [];
  const wineKeys = new Set();
  Object.values(TEMPLATES).forEach(courses => {
    courses.forEach(c => {
      if (c.producer || c.wine) {
        const label = [c.producer, c.wine, c.region, c.vintage].filter(Boolean).join(', ');
        if (!wineKeys.has(label)) {
          wineKeys.add(label);
          wines.push({ label, producer: c.producer||'', wine: c.wine||'', region: c.region||'', vintage: c.vintage||'' });
        }
      }
      if (c.producer2 || c.wine2) {
        const label2 = [c.producer2, c.wine2, c.region2, c.vintage2].filter(Boolean).join(', ');
        if (!wineKeys.has(label2)) {
          wineKeys.add(label2);
          wines.push({ label: label2, producer: c.producer2||'', wine: c.wine2||'', region: c.region2||'', vintage: c.vintage2||'' });
        }
      }
    });
  });
  return wines;
}

function buildLibrary() {
  const dishes = new Set();
  const wines = [];
  const wineKeys = new Set();
  Object.values(TEMPLATES).forEach(courses => {
    courses.forEach(c => {
      if (c.dish) dishes.add(c.dish);
      if (c.producer || c.wine) {
        const key = (c.producer||'') + '|' + (c.wine||'') + '|' + (c.region||'') + '|' + (c.vintage||'');
        if (!wineKeys.has(key)) {
          wineKeys.add(key);
          wines.push({ producer: c.producer||'', wine: c.wine||'', region: c.region||'', vintage: c.vintage||'' });
        }
      }
    });
  });
  return { dishes: [...dishes], wines };
}

function getDatalistsHTML() {

        <div><label>Wine Name</label><input type="text" value="${esc(c.wine2||'')}" oninput="upd2(${i},'wine2',this.value)"${dlWine}></div>
        <div><label>Region / Country</label><input type="text" value="${esc(c.region2||'')}" oninput="upd2(${i},'region2',this.value)"${dlRegion}></div>
        <div><label>Vintage</label><input type="text" value="${esc(c.vintage2||'')}" oninput="upd2(${i},'vintage2',this.value)"></div>

    // ALC or KT Bespoke: use dropdowns for dish and wine selection
    let dishHtml, wineHtml;
    if (useDropdowns) {
      // Dish dropdown grouped by type — for Bespoke show ALL diets combined
      let dishLib;
      if (isBespoke) {
        // Merge all diets into one grouped library
        dishLib = {};
        Object.values(DISH_LIBRARY).forEach(dietObj => {
          Object.keys(dietObj).forEach(cat => {
            if (!dishLib[cat]) dishLib[cat] = [];
            dietObj[cat].forEach(d => {
              if (!dishLib[cat].some(x => x.dish === d.dish && x.desc === d.desc)) {
                dishLib[cat].push(d);
              }
            });
          });

        dishLib = DISH_LIBRARY[alcDiet] || DISH_LIBRARY.regular;

        dishHtml += `<input type="text" value="${esc(c.desc)}" placeholder="Description" oninput="upd(${i},'desc',this.value)">`;
      }

      // Wine dropdown
      const wineLib = buildWineLibrary();
      const currentWineLabel = [c.producer, c.wine, c.region, c.vintage].filter(Boolean).join(', ');
      let wineOpts = '<option value="">— Select Wine —</option>';
      wineLib.forEach(w => {
        const sel = (w.label === currentWineLabel) ? ' selected' : '';
        wineOpts += `<option value="${esc(w.label)}"${sel}>${w.label}</option>`;
      });
      wineOpts += '<option value="__other__">— Other (manual) —</option>';
      wineHtml = `<label>Wine</label><select style="width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:4px;font-family:var(--sans);font-size:12px;margin-bottom:6px" onchange="selectWine(${i},this.value)">${wineOpts}</select>`;
      if (!isWineInLibrary(currentWineLabel) && (c.producer || c.wine)) {
        wineHtml += `<div class="wine-fields">
          <div><label>Producer</label><input type="text" value="${esc(c.producer)}" oninput="upd(${i},'producer',this.value)"></div>
          <div><label>Wine Name</label><input type="text" value="${esc(c.wine)}" oninput="upd(${i},'wine',this.value)"></div>
          <div><label>Region / Country</label><input type="text" value="${esc(c.region)}" oninput="upd(${i},'region',this.value)"></div>
          <div><label>Vintage</label><input type="text" value="${esc(c.vintage)}" oninput="upd(${i},'vintage',this.value)"></div>
        </div>`;
      }

      container.innerHTML += `<div class="course-editor">
        <button class="remove-course" onclick="removeCourse(${i})">&times;</button>
        ${dishHtml}
        ${wineHtml}
        ${wine2Html}
        <div style="margin-top:8px">${addWine2Btn}<button class="course-save-btn" onclick="saveMenu()">Save</button></div>
      </div>`;
    } else {
      container.innerHTML += `<div class="course-editor">
        <button class="remove-course" onclick="removeCourse(${i})">&times;</button>
        <div class="course-dish-label">${esc(c.dish) || '(empty dish)'}</div>
        <div class="course-desc-label">${esc(c.desc) || ''}</div>
        <div class="wine-fields">
          <div><label>Producer</label><input type="text" value="${esc(c.producer)}" oninput="upd(${i},'producer',this.value)"${dlProd}></div>
          <div><label>Wine Name</label><input type="text" value="${esc(c.wine)}" oninput="upd(${i},'wine',this.value)"${dlWine}></div>
          <div><label>Region / Country</label><input type="text" value="${esc(c.region)}" oninput="upd(${i},'region',this.value)"${dlRegion}></div>
          <div><label>Vintage</label><input type="text" value="${esc(c.vintage)}" oninput="upd(${i},'vintage',this.value)"></div>
        </div>
        ${wine2Html}
        <div style="margin-top:8px">${addWine2Btn}<button class="course-save-btn" onclick="saveMenu()">Save</button></div>
      </div>`;
    }

  if (useDropdowns) { container.insertAdjacentHTML('beforeend', getDatalistsHTML()); }

  // Sommelier selector
  const sommEl = document.getElementById('sommOptions');

  SOMMELIERS.forEach(s => {
    const active = currentMenu.sommelier === s.name ? ' active' : '';
    sommEl.innerHTML += `<div class="somm-opt${active}" onclick="selectSomm('${s.name}')">${s.name}<br><span style="font-size:9px;color:${active?'#ddd':'#888'}">${s.role}</span></div>`;

  const metaEl = document.getElementById('metaInfo');
  if (currentMenu.lastEditBy) {
    metaEl.textContent = 'Last edited by ' + currentMenu.lastEditBy + ' — ' + currentMenu.lastEditDate;
  } else {
    metaEl.textContent = '';
  }

  // Date input
  const dateInput = document.getElementById('pairingDate');
  const dateClear = document.getElementById('dateClear');
  const dateToggle = document.getElementById('dateToggle');
  if (dateInput) {
    dateInput.value = currentMenu.pairingDate || '';
    dateInput.style.display = currentMenu.showDate ? 'block' : 'none';
  }
  if (dateClear) {
    dateClear.style.display = currentMenu.showDate ? 'block' : 'none';
  }
  if (dateToggle) {
    dateToggle.textContent = currentMenu.showDate ? 'Hide Date' : 'Show Date';
    if (currentMenu.showDate) {
      dateToggle.style.background = 'var(--green)';
      dateToggle.style.color = '#fff';
      dateToggle.style.borderColor = 'var(--green)';
    } else {
      dateToggle.style.background = '#fff';
      dateToggle.style.color = '#333';
      dateToggle.style.borderColor = '#ddd';
    }
  }
}

  currentMenu.sommelier = name;
  renderPreview();
  renderEditor();

// ─── DATE FUNCTIONS ─────────────────────────────────────────────
function formatDateFancy(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  const day = d.getDate();
  const month = d.toLocaleDateString('en-GB', { month: 'long' });
  const year = d.getFullYear();
  return `${day} ${month} ${year}`;
}

function setDate(val) {
  currentMenu.pairingDate = val;
  renderPreview();
}

function toggleDate() {
  currentMenu.showDate = !currentMenu.showDate;
  renderPreview();
  renderEditor();
}

function clearDate() {
  currentMenu.pairingDate = '';
  currentMenu.showDate = false;
  document.getElementById('pairingDate').value = '';
  renderPreview();
  renderEditor();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function upd(i, f, v) { currentMenu.courses[i][f] = v; renderPreview(); }
function upd2(i, f, v) { currentMenu.courses[i][f] = v; renderPreview(); }
function addWine2(i) { currentMenu.courses[i].producer2=''; currentMenu.courses[i].wine2=''; currentMenu.courses[i].region2=''; currentMenu.courses[i].vintage2=''; renderEditor(); }
function addCourseEditor() { currentMenu.courses.push({dish:'',desc:'',producer:'',wine:'',region:'',vintage:''}); renderEditor(); }
function removeCourse(i) { currentMenu.courses.splice(i,1); renderEditor(); renderPreview(); }

// ALC helpers
function isDishInLibrary(dish, desc) {
  const dishLib = DISH_LIBRARY[alcDiet] || DISH_LIBRARY.regular;
  for (const cat of Object.values(dishLib)) {
    for (const d of cat) { if (d.dish === dish && d.desc === desc) return true; }
  }
  return false;
}

function setAlcDiet(diet) {
  alcDiet = diet;
  renderEditor();
}

function isWineInLibrary(label) {
  if (!label) return true;
  const wineLib = buildWineLibrary();
  return wineLib.some(w => w.label === label);
}

function selectDish(i, val) {
  if (val === '__other__') {
    currentMenu.courses[i].dish = '';
    currentMenu.courses[i].desc = '';
  } else if (val) {
    const parts = val.split('|||');
    currentMenu.courses[i].dish = parts[0] || '';
    currentMenu.courses[i].desc = parts[1] || '';
  }
  renderPreview();
  renderEditor();
}

function selectWine(i, val) {
  if (val === '__other__') {
    currentMenu.courses[i].producer = '';
    currentMenu.courses[i].wine = '';
    currentMenu.courses[i].region = '';
    currentMenu.courses[i].vintage = '';
  } else if (val) {
    const wineLib = buildWineLibrary();
    const found = wineLib.find(w => w.label === val);
    if (found) {
      currentMenu.courses[i].producer = found.producer;
      currentMenu.courses[i].wine = found.wine;
      currentMenu.courses[i].region = found.region;
      currentMenu.courses[i].vintage = found.vintage;
    }
  }
  renderPreview();
  renderEditor();
}

// ─── SAVE TO FIRESTORE ──────────────────────────────────────────
async function saveMenu() {
  if (!currentMenu) return;
  btnSave.disabled = true; btnSave.textContent = 'Saving...';
  const author = getAuthorName();
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) + ' ' + now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  try {
    await db.collection('somm_pairings').doc(currentMenu.id).set({
      menu: currentMenu.type,
      wine: currentMenu.variant,
      courses: currentMenu.courses,
      sommelier: currentMenu.sommelier || '',
      pairingDate: currentMenu.pairingDate || '',
      showDate: currentMenu.showDate || false,
      lastEditBy: author,
      lastEditDate: dateStr,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    currentMenu.lastEditBy = author;
    currentMenu.lastEditDate = dateStr;
    renderEditor();
    showStatus('Saved ✓');
  } catch(e) { console.error(e); showStatus('Error saving'); }
  btnSave.disabled = false; btnSave.textContent = 'Save Changes';
}

  // Hide all first
  document.getElementById('sizeChoicePdf').style.display = 'none';
  document.getElementById('sizeChoicePrint').style.display = 'none';
  document.getElementById('sizeChoiceEmail').style.display = 'none';
  pendingAction = action;
  if (action === 'pdf') {
    document.getElementById('sizeChoicePdf').style.display = 'flex';
  } else if (action === 'print') {
    document.getElementById('sizeChoicePrint').style.display = 'flex';
  } else if (action === 'email') {
    document.getElementById('sizeChoiceEmail').style.display = 'flex';
  }
}

function hideSizeChoice() {
  document.getElementById('sizeChoicePdf').style.display = 'none';
  document.getElementById('sizeChoicePrint').style.display = 'none';
  document.getElementById('sizeChoiceEmail').style.display = 'none';
  pendingAction = null;
}

function execWithSize(size) {
  const action = pendingAction;
  hideSizeChoice();
  if (action === 'print') printMenu(size);
  else if (action === 'pdf') downloadPdf(size);
  else if (action === 'email') emailPdf(size);
}

// Close dropdowns on outside click
document.addEventListener('click', function(e) {
  if (!e.target.closest('.size-choice') && !e.target.closest('#btnPrint') && !e.target.closest('#btnPdf') && !e.target.closest('#btnEmail')) {
    hideSizeChoice();
  }
});

function getFilename(size) {
  const menuLabel = MENU_CONFIG[currentMenu.type].label.replace(/\s+/g, '_');
  const pairingLabel = PAIRING_LABELS[currentMenu.variant].replace(/\s+/g, '_');
  const sizeLabel = size === 'statement' ? 'Statement' : 'A4';
  const now = new Date();
  const dd = String(now.getDate()).padStart(2,'0');
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const yy = String(now.getFullYear()).slice(2);
  return `${menuLabel}_${pairingLabel}_${sizeLabel}_${dd}${mm}${yy}`;
}

// ─── PRINT ──────────────────────────────────────────────────────
function printMenu(size) {
  let ps = document.getElementById('printSizeStyle');
  if (!ps) { ps = document.createElement('style'); ps.id = 'printSizeStyle'; document.head.appendChild(ps); }
  ps.textContent = size === 'statement' ? '@page{size:5.5in 8.5in;margin:0.6in 0.5in}' : '@page{size:A4;margin:20mm 25mm}';
  setTimeout(() => window.print(), 150);
}

// ─── PDF DOWNLOAD ───────────────────────────────────────────────
function downloadPdf(size) {
  const element = document.getElementById('menuPreview');
  const filename = getFilename(size) + '.pdf';

  // Save original styles
  const origStyle = element.style.cssText;

  // Temporarily adjust for PDF capture
  element.style.border = 'none';
  element.style.borderRadius = '0';
  element.style.boxShadow = 'none';
  element.style.background = '#fff';
  element.style.minHeight = 'auto';

  if (size === 'statement') {
    element.style.padding = '0.6in 0.2in 0.2in';
    element.style.fontSize = '26%';
    element.style.height = '8in';
    element.style.width = '5.5in';
    element.style.display = 'flex';
    element.style.flexDirection = 'column';
    element.style.alignItems = 'center';
    element.style.justifyContent = 'center';
  } else {
    element.style.padding = '15mm 20mm';
    element.style.height = '290mm';
    element.style.width = '210mm';
    element.style.display = 'flex';
    element.style.flexDirection = 'column';
    element.style.alignItems = 'center';
    element.style.justifyContent = 'center';
  }

  // Adjust internal spacing for PDF
  const logo = element.querySelector('.preview-logo');
  const subtitle = element.querySelector('.menu-subtitle');
  const spacer = element.querySelector('.no-date-spacer');
  const footer = element.querySelector('.preview-footer');
  const seps = element.querySelectorAll('.course-separator');

  const origLogo = logo ? logo.style.cssText : '';
  const origSub = subtitle ? subtitle.style.cssText : '';
  const origSpacer = spacer ? spacer.style.cssText : '';
  const origFooter = footer ? footer.style.cssText : '';
  const origSeps = []; seps.forEach(s => origSeps.push(s.style.cssText));
  const title = element.querySelector('.menu-title');
  const origTitle = title ? title.style.cssText : '';

  if (size === 'statement') {
    if (logo) { logo.style.width = '120px'; logo.style.marginBottom = '10px'; }
    if (title) { title.style.fontSize = '12px'; title.style.letterSpacing = '2px'; }
    if (spacer) spacer.style.marginBottom = '14px';
    if (footer) footer.style.marginTop = '38px';
    seps.forEach(s => { s.style.margin = '6px 0'; });
  } else {
    if (logo) { logo.style.width = '140px'; logo.style.marginBottom = '18px'; }
    if (spacer) spacer.style.marginBottom = '40px';
    if (footer) footer.style.marginTop = '44px';
    seps.forEach(s => { s.style.margin = '16px 0'; });
  }

  const opt = {
    margin: 0,
    filename: filename,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollY: 0 },
    jsPDF: { unit: size === 'statement' ? 'in' : 'mm', format: size === 'statement' ? [5.5, 8.5] : 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['avoid-all'] }
  };

  html2pdf().set(opt).from(element).save().then(function() {
    element.style.cssText = origStyle;
    if (logo) logo.style.cssText = origLogo;
    if (title) title.style.cssText = origTitle;
    if (subtitle) subtitle.style.cssText = origSub;
    if (spacer) spacer.style.cssText = origSpacer;
    if (footer) footer.style.cssText = origFooter;
    seps.forEach((s, i) => { s.style.cssText = origSeps[i] || ''; });
  });
  showStatus('Downloading PDF...');
}

// ─── EMAIL (download PDF + open mailto) ─────────────────────────
function emailPdf(size) {
  // Build mailto URL first
  const menuLabel = MENU_CONFIG[currentMenu.type].label;
  const pairingLabel = PAIRING_LABELS[currentMenu.variant];
  const somm = SOMMELIERS.find(s => s.name === currentMenu.sommelier) || SOMMELIERS[0];
  let subject = `${menuLabel} - ${pairingLabel}`;
  if (currentMenu.showDate && currentMenu.pairingDate) {
    subject += ` - ${formatDateFancy(currentMenu.pairingDate)}`;
  }
  const body = `Dear Guest,\n\nPlease find attached your wine pairing menu.\n\nKind regards,\n${somm.name}\n${somm.role}\nPetrus`;
  const mailtoUrl = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  // Open mailto immediately (before async PDF)
  window.open(mailtoUrl, '_blank');

  // Then download the PDF
  downloadPdf(size);
}

// ─── HELPERS ────────────────────────────────────────────────────
function getAuthorName() {
  if (!U) return '';
  var name = U.displayName || U.email.split('@')[0].replace(/\./g,' ');
  return name.split(' ').map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}

function showStatus(msg) { const el = document.getElementById('statusMsg'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2500); }
</script>
