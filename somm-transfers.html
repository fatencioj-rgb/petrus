<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfers — Petrus Sommeliers</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--grn:#5c1a1a;--grn2:#2d0a0a;--gld:#b89650;--crm:#faf7f1;--pink:#f8e8e8;--s:'Inter',sans-serif;--f:'Cormorant Garamond',serif}
body{font-family:var(--s);background:var(--crm);color:#2c2c2c;min-height:100vh}
.tb{background:var(--grn2);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.tb a{color:var(--gld);text-decoration:none;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.tb h2{font-family:var(--f);color:#fff;font-size:18px}
.pg{max-width:960px;margin:0 auto;padding:20px 14px 60px}
.pg>h1{font-family:var(--f);font-size:26px;color:var(--grn);margin-bottom:14px}
.box{background:#fff;border:1px solid #e8e0d4;border-radius:8px;padding:14px;margin-bottom:14px}
.box h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gld);margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:var(--grn2);color:#fff;padding:7px 8px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.tbl td{padding:6px 8px;border-bottom:1px solid #f5f0ea}
.tbl tr:hover td{background:#fdf9f2}
.fields{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.fields input,.fields select{padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:11px;font-family:var(--s);outline:none;flex:1;min-width:0}
.fields input[type="number"]{flex:0 0 50px}
.fields select{flex:0 0 auto}
.fields input:focus{border-color:var(--gld)}
.btn-add{padding:6px 18px;background:var(--grn);color:#fff;border:none;border-radius:4px;font-size:10px;cursor:pointer;text-transform:uppercase}
.btn-add:hover{background:var(--grn2)}
.s-remove{background:none;border:none;color:#ccc;font-size:12px;cursor:pointer}
.s-remove:hover{color:#c0392b}
.em{text-align:center;padding:14px;color:#ccc;font-size:11px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 14px;border:1px solid rgba(92,26,26,0.2);border-radius:14px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;background:var(--pink);color:var(--grn)}
.tab.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.sm{position:fixed;bottom:20px;right:20px;background:var(--grn);color:var(--crm);padding:10px 16px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .3s;z-index:9999}
.sm.show{opacity:1}
</style>
</head>
<body>
<div class="tb"><a href="sommeliers.html">&larr; Back</a><h2>Petrus</h2><span></span></div>
<div class="pg">
<h1>Transfers</h1>
<div class="tabs" style="margin-bottom:14px">
  <span class="tab on">Kitchen</span>
</div>
<div id="listArea"></div>
<div id="addArea"></div>
</div>
<div class="sm" id="sm"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script>
var U=null,items=[];
var DESTINATIONS=['Kitchen'];
var KITCHEN_STAFF=['Lucie Pajean','Oscar Nute','Akshay Ramakant','Maksymilian Dziedzic','Sacha Brown','Airto Krisch','Meg Igglesden','Jack Brett','Manjit Kang','Max Proudfoot','Samara Jordan','Reanna Bryan','Luke Belfield','Orson Vergnaud'];
var PRODUCTS=['Bacardi 8y','Blandy\'s Madeira','Cockburn\'s Port','Prosecco','Jules Brandy','Pernod','White wine','Red wine','Vin Jaune','Noilly Prat','Luxardo Kirsch','Grenadine','Briottet Fraise de Bois'];

auth.onAuthStateChanged(function(u){
  if(!u){window.location.href='index.html';return;}
  U=u;logAccess(u,'page_view','somm-transfers.html');
  loadItems();
});

function loadItems(){
  var today=new Date().toISOString().slice(0,10);
  db.collection('somm_transfers').where('date','==',today).get().then(function(snap){
    items=[];snap.forEach(function(doc){items.push({id:doc.id,data:doc.data()});});
    render();
  });
}

function render(){
  // List
  var h='<div class="box">';
  if(items.length===0){h+='<div class="em">No transfers today</div>';}
  else{
    h+='<table class="tbl"><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Unit</th><th>Given to</th><th>Delivered by</th><th></th></tr></thead><tbody>';
    for(var i=0;i<items.length;i++){var it=items[i].data;var id=items[i].id;
      h+='<tr><td>'+it.date+'</td><td>'+it.name+'</td><td>'+it.qty+'</td><td>'+it.unit+'</td><td>'+(it.receivedBy||'—')+'</td><td>'+it.author+'</td>';
      h+='<td><button class="s-remove" onclick="removeItem(\''+id+'\')">&times;</button></td></tr>';
    }
    h+='</tbody></table>';
  }
  h+='</div>';
  document.getElementById('listArea').innerHTML=h;

  // Add form
  var a='<div class="box"><h3>Add transfer</h3><div class="fields">';
  a+='<input type="date" id="t_date" value="'+new Date().toISOString().slice(0,10)+'" onchange="checkDay(this)" style="width:110px;flex:0 0 110px">';
  a+='<select id="t_name" onchange="toggleTransOther()" style="flex:0 0 auto"><option value="">Product...</option>';
  for(var p=0;p<PRODUCTS.length;p++){a+='<option value="'+PRODUCTS[p]+'">'+PRODUCTS[p]+'</option>';}
  a+='<option value="__other">Other...</option></select>';
  a+='<input type="text" id="t_name_other" placeholder="Other product..." style="display:none;flex:1">';
  a+='<input type="number" id="t_qty" placeholder="Qty" min="0">';
  a+='<select id="t_unit"><option value="ml">ml</option><option value="btl">btl</option><option value="uni">uni</option><option value="cl">cl</option></select>';
  a+='<select id="t_received"><option value="">Given to...</option>';
  for(var t=0;t<KITCHEN_STAFF.length;t++){a+='<option value="'+KITCHEN_STAFF[t]+'">'+KITCHEN_STAFF[t]+'</option>';}
  a+='</select>';
  a+='</div><button class="btn-add" onclick="addItem()">Add</button></div>';
  document.getElementById('addArea').innerHTML=a;
}

function addItem(){
  var nameEl=document.getElementById('t_name');
  var name=nameEl?nameEl.value:'';
  if(name==='__other')name=(document.getElementById('t_name_other')||{}).value||'';
  if(!name){msg('Product required');return;}
  var author=U.displayName||U.email.split('@')[0].replace(/\./g,' ');
  author=author.charAt(0).toUpperCase()+author.slice(1);
  var item={
    date:(document.getElementById('t_date')||{}).value||new Date().toISOString().slice(0,10),
    destination:'Kitchen',
    name:name,
    qty:(document.getElementById('t_qty')||{}).value||'',
    unit:(document.getElementById('t_unit')||{}).value||'ml',
    receivedBy:(document.getElementById('t_received')||{}).value||'',
    author:author,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  };
  db.collection('somm_transfers').add(item).then(function(){
    loadItems();msg('Added');
  }).catch(function(e){console.error(e);msg('Error');});
}

function removeItem(id){
  db.collection('somm_transfers').doc(id).delete().then(function(){loadItems();msg('Removed');});
}
function toggleTransOther(){var s=document.getElementById('t_name'),o=document.getElementById('t_name_other');if(s&&o)o.style.display=s.value==='__other'?'inline-block':'none';}
function checkDay(el){var d=new Date(el.value+'T12:00:00').getDay();if(d===0||d===1){msg('Closed on Sun/Mon');el.value=new Date().toISOString().slice(0,10);}}
function msg(t){var el=document.getElementById('sm');el.textContent=t;el.className='sm show';setTimeout(function(){el.className='sm';},1800);}
</script>
</body>
</html>
