<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine — Petrus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --wine:#5c1a1a; --wine-soft:#7d3030;
  --bg:#fdf6f8; --bg-soft:#fbeef1; --surface:#ffffff;
  --text:#3a2226; --border:rgba(92,26,26,0.18);
  --serif:'Cormorant Garamond','Georgia',serif; --sans:'Inter','Segoe UI',sans-serif;
}
body { font-family:var(--sans); background:var(--bg); color:var(--text); min-height:100vh; }
.back-link { display:inline-block; color:var(--wine-soft); text-decoration:none; font-size:12px; letter-spacing:1px; text-transform:uppercase; opacity:0.7; }
.back-link:hover { opacity:1; }
.container { max-width:1000px; margin:0 auto; padding:32px 24px 80px; }
.section { margin-bottom:56px; }
.section-title { font-family:var(--serif); font-size:34px; color:var(--wine); margin-bottom:6px; }
.section-sub { color:var(--wine-soft); opacity:0.85; font-size:14px; margin-bottom:24px; }

.tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.tab { background:transparent; border:1px solid var(--border); border-radius:20px; color:var(--wine-soft); font-family:var(--sans); font-size:12px; letter-spacing:0.5px; padding:8px 16px; cursor:pointer; transition:all 0.2s; }
.tab:hover { border-color:var(--wine); color:var(--wine); }
.tab.active { background:var(--wine); border-color:var(--wine); color:#fff; font-weight:600; }
.wn-search { width:100%; max-width:360px; display:block; margin-bottom:24px; padding:10px 14px; border:1px solid var(--border); border-radius:20px; background:var(--surface); color:var(--text); font-family:var(--sans); font-size:13px; outline:none; }
.wn-search:focus { border-color:var(--wine); }
.wn-search::placeholder { color:var(--wine-soft); opacity:0.6; }

.type-subhead { font-family:var(--serif); font-size:24px; color:var(--wine); margin:30px 0 14px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.type-subhead:first-child { margin-top:0; }

.wine-grid { display:block; }
.wine-grid-inner { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
.wine-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 4px 18px rgba(92,26,26,0.06); cursor:pointer; transition:transform .15s, box-shadow .15s; }
.wine-card:hover { transform:translateY(-2px); box-shadow:0 8px 26px rgba(92,26,26,0.14); }
.wine-media-wrap { position:relative; }
.wine-media { width:100%; height:180px; background:var(--bg-soft) center/cover no-repeat; position:relative; }
.wine-media.empty { display:flex; align-items:center; justify-content:center; }
.wine-media.empty::after { content:'PETRUS'; font-family:var(--serif); letter-spacing:4px; color:rgba(92,26,26,0.28); font-size:18px; }
.wine-type-badge { position:absolute; top:10px; left:10px; background:rgba(255,255,255,0.92); border:1px solid var(--border); color:var(--wine); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; padding:4px 10px; border-radius:12px; }
.wine-edit-btn { position:absolute; top:10px; right:10px; z-index:3; width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,0.92); color:var(--wine); font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(92,26,26,0.18); }
.wine-edit-btn:hover { background:#fff; border-color:var(--wine); }
.wine-body { padding:18px; display:flex; flex-direction:column; gap:8px; }
.wine-name { font-family:var(--serif); font-size:20px; color:var(--wine); line-height:1.25; }
.wine-meta { font-size:12.5px; color:var(--text); opacity:0.85; }
.wine-meta b { color:var(--wine); font-weight:600; }
.wine-pairtag { font-size:12px; color:var(--wine-soft); background:var(--bg-soft); border:1px solid var(--border); border-radius:12px; padding:3px 10px; width:fit-content; }

/* Info table + prose inside the modal */
.w-table { width:100%; border-collapse:collapse; margin:6px 0 10px; }
.w-table td { padding:4px 0; font-size:13px; vertical-align:top; }
.w-table td:first-child { font-weight:600; width:34%; color:var(--wine); }
.w-h4 { font-size:12px; text-transform:uppercase; letter-spacing:0.8px; color:var(--wine); margin:16px 0 6px; padding-bottom:3px; border-bottom:1px solid var(--border); }
.w-prose { font-size:13.5px; line-height:1.55; color:var(--text); opacity:0.92; white-space:pre-wrap; }

/* Modal */
.wine-modal-overlay { position:fixed; inset:0; z-index:1000; background:rgba(58,34,38,0.55); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
.wine-modal-overlay.open { display:flex; }
.wine-modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(58,34,38,0.4); overflow:hidden; position:relative; animation:winePop .18s ease-out; }
@keyframes winePop { from { opacity:0; transform:translateY(12px) scale(0.98); } to { opacity:1; transform:none; } }
.wine-modal .wine-media { height:300px; }
.wine-modal .wine-body { padding:24px; }
.wine-modal .wine-name { font-size:28px; }
.wine-modal-close { position:absolute; top:12px; right:12px; z-index:2; width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,0.92); color:var(--wine); font-size:18px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.wine-modal-close:hover { background:#fff; border-color:var(--wine); }

@media (max-width:600px) { .section-title { font-size:26px; } }
</style>
</head>
<body>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px;">
    <a class="back-link" href="winelist.html">&larr; Back</a>
    <a href="wine-editor.html" id="editorLink" style="display:none;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--wine-soft);opacity:0.7;text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:7px 14px;" onmouseover="this.style.opacity=1;this.style.borderColor='var(--wine)'" onmouseout="this.style.opacity=0.7;this.style.borderColor='var(--border)'">✎ Edit wines</a>
  </div>

  <section class="section">
    <h2 class="section-title" id="wn-section-title">Wine</h2>
    <p class="section-sub" id="wn-section-sub">Every wine, with tasting notes. Filter by section below.</p>
    <div class="tabs" id="wn-tabs"></div>
    <input type="search" id="wn-search" class="wn-search" placeholder="Search a wine…" oninput="renderWines()" aria-label="Search a wine">
    <div class="wine-grid" id="wn-grid"></div>
  </section>
</div>

<!-- Wine detail pop-up -->
<div class="wine-modal-overlay" id="wine-modal-overlay" onclick="if(event.target===this) closeWineModal()">
  <div class="wine-modal" id="wine-modal" role="dialog" aria-modal="true">
    <button class="wine-modal-close" onclick="closeWineModal()" aria-label="Close">&times;</button>
    <div id="wine-modal-content"></div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<script>
const SECTIONS = [
  { id:'all',      label:'All wines' },
  { id:'byglass',  label:'By the Glass' },
  { id:'pairings', label:'Pairings' },
];
const SECTION_LABEL = { byglass:'By the Glass', pairings:'Pairings' };
const TYPE_ORDER = ['Champagne','Sparkling','White','Rosé','Orange','Red','Sweet / Dessert','Fortified'];
function typeRank(t){ const i = TYPE_ORDER.indexOf((t||'').trim()); return i<0 ? TYPE_ORDER.length : i; }

const WN_EDITORS = ['fiorella@petrus.local','milena@petrus.local','orson@petrus.local'];
let canEdit = false;
let WINES = [];
let selected = 'all';
let currentList = [];

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fixImg(path){
  if(!path) return '';
  if(/^data:/i.test(path)) return path;
  if(/^https?:\/\//i.test(path)) return path;
  return path.replace(/^\.?\//,'');
}
function firstImage(w){ return (w && Array.isArray(w.images) && w.images.length) ? fixImg(w.images[0]) : ''; }

function winesForSection(sectionId){
  const visible = WINES.filter(w => !w.hidden);
  let list = (sectionId === 'all')
    ? visible.slice()
    : visible.filter(w => Array.isArray(w.sections) && w.sections.indexOf(sectionId) >= 0);
  return list.sort((a,b) => typeRank(a.type) - typeRank(b.type) || (a.order||0) - (b.order||0));
}

function renderTabs(){
  const tabs = document.getElementById('wn-tabs');
  tabs.innerHTML = SECTIONS.map(s =>
    `<button class="tab${s.id===selected?' active':''}" onclick="selectSection('${s.id}')">${esc(s.label)}</button>`
  ).join('');
}
function selectSection(id){ selected = id; renderTabs(); renderWines(); }

function wineMediaHtml(w){
  const img = firstImage(w);
  const imgUrl = /^data:/i.test(img) ? img : encodeURI(img);
  return img
    ? `<div class="wine-media" style="background-image:url('${imgUrl}')"><span class="wine-type-badge">${esc(w.type||'')}</span></div>`
    : `<div class="wine-media empty"><span class="wine-type-badge">${esc(w.type||'')}</span></div>`;
}

// Short meta line for the card.
function cardMeta(w){
  const bits = [w.region, w.vintage].filter(Boolean).map(esc);
  return bits.length ? `<div class="wine-meta">${bits.join(' · ')}</div>` : '';
}

function renderWines(){
  const grid = document.getElementById('wn-grid');
  const title = document.getElementById('wn-section-title');
  const sub = document.getElementById('wn-section-sub');
  const searchBox = document.getElementById('wn-search');
  const q = (searchBox ? searchBox.value : '').trim().toLowerCase();

  if(title) title.textContent = selected==='all' ? 'Wine' : (SECTION_LABEL[selected]||'Wine');
  if(sub) sub.textContent = selected==='pairings'
      ? 'Wines paired with our dishes.'
      : 'Every wine, with tasting notes. Filter by section below.';

  let list;
  if(q){
    // Search across the whole wine list.
    list = WINES.filter(w => !w.hidden).filter(w =>
      (w.name||'').toLowerCase().includes(q) ||
      (w.producer||'').toLowerCase().includes(q) ||
      (w.region||'').toLowerCase().includes(q) ||
      (w.grapes||'').toLowerCase().includes(q)
    ).sort((a,b)=>typeRank(a.type)-typeRank(b.type)||(a.order||0)-(b.order||0));
  } else {
    list = winesForSection(selected);
  }

  if(!list.length){
    currentList = [];
    grid.innerHTML = q ? `<p style="opacity:.6">No wines match “${esc(q)}”.</p>` : '<p style="opacity:.6">No wines in this section yet.</p>';
    return;
  }

  currentList = [];
  const pushCard = (w) => {
    const i = currentList.length;
    currentList.push(w);
    const pencil = canEdit ? `<button class="wine-edit-btn" title="Edit this wine" onclick="editWineFromCard(event, ${i})" aria-label="Edit wine">✎</button>` : '';
    const pairtag = (selected==='pairings' && w.pairDishName) ? `<div class="wine-pairtag">Paired with ${esc(w.pairDishName)}</div>` : '';
    return `<article class="wine-card" onclick="openWineModal(${i})">
      <div class="wine-media-wrap">${wineMediaHtml(w)}${pencil}</div>
      <div class="wine-body">
        <div class="wine-name">${esc(w.name||'')}</div>
        ${cardMeta(w)}
        ${pairtag}
      </div>
    </article>`;
  };
  const gridBlock = (arr) => `<div class="wine-grid-inner">${arr.map(pushCard).join('')}</div>`;

  // Group by type with sub-headings (unless searching, which is flat).
  let html = '';
  if(q){
    html = gridBlock(list);
  } else {
    const types = [...new Set(list.map(w => (w.type||'').trim()))].sort((a,b)=>typeRank(a)-typeRank(b));
    types.forEach(t => {
      const items = list.filter(w => (w.type||'').trim() === t);
      if(!items.length) return;
      html += `<h3 class="type-subhead">${esc(t || 'Other')}</h3>` + gridBlock(items);
    });
  }
  grid.innerHTML = html;
}

/* ── Modal ── */
function wineBodyHtml(w){
  const rows = [
    ['Producer', w.producer],
    ['Appellation', w.appellation],
    ['Region, Country', w.region],
    ['Vintage', w.vintage],
    ['Alcohol', w.alcohol],
    ['Style', w.style],
    ['Grape Varieties', w.grapes],
  ].filter(([,v]) => v && String(v).trim());
  const table = rows.length
    ? `<table class="w-table">${rows.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>` : '';
  const proseBlock = (title, text) => (text && String(text).trim())
    ? `<div class="w-h4">${esc(title)}</div><div class="w-prose">${esc(text)}</div>` : '';
  const pair = (Array.isArray(w.sections) && w.sections.indexOf('pairings')>=0 && w.pairDishName)
    ? `<div class="wine-pairtag" style="margin-bottom:8px;">Paired with ${esc(w.pairDishName)}${w.pairNote?(' — '+esc(w.pairNote)):''}</div>` : '';
  return `
    <div class="wine-name">${esc(w.name||'')}</div>
    ${pair}
    ${table}
    ${proseBlock('The Producer', w.producerText)}
    ${proseBlock('Viticulture', w.viticulture)}
    ${proseBlock('Winemaking', w.winemaking)}
    ${proseBlock('Tasting Notes', w.tasting)}
    ${proseBlock('Vintage', w.vintageNote)}`;
}
function openWineModal(i){
  const w = currentList[i];
  if(!w) return;
  document.getElementById('wine-modal-content').innerHTML =
    wineMediaHtml(w) + `<div class="wine-body">${wineBodyHtml(w)}</div>`;
  document.getElementById('wine-modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeWineModal(){
  document.getElementById('wine-modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', (e) => { if(e.key==='Escape') closeWineModal(); });

function editWineFromCard(ev, i){
  ev.stopPropagation();
  const w = currentList[i];
  if(!w) return;
  window.location.href = 'wine-editor.html' + (w.id ? ('?edit=' + encodeURIComponent(w.id)) : '');
}

/* ── Data load ── */
function loadWines(){
  return db.collection('wines').get()
    .then(snap => {
      WINES = snap.docs.map(doc => Object.assign({ id: doc.id }, doc.data()))
        .sort((a,b) => (a.order||0) - (b.order||0));
      renderTabs(); renderWines();
    })
    .catch(err => {
      document.getElementById('wn-grid').innerHTML =
        '<p style="opacity:.6">Could not load wines: ' + esc(err && err.message) + '</p>';
    });
}

auth.onAuthStateChanged((user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  if (typeof logAccess === 'function') logAccess(user, 'page_view', 'wine-btg.html');
  canEdit = WN_EDITORS.indexOf(user.email) >= 0;
  const el = document.getElementById('editorLink');
  if(el) el.style.display = canEdit ? 'inline-block' : 'none';
  renderTabs();
  loadWines();
});
</script>
</body>
</html>
