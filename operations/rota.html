<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota — Petrus</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1F3864;--blue:#2F5597;--line:#9BB7D9;--band:#DDEBF7;--closed:#EDEDED;
  --holiday:#E2EFDA;--closing:#FCE4D6;--sick:#F4CCCC;--tbc:#E7E0F2;--agency:#FFF2CC;
  --gold:#BF9000;--grey:#8C8C8C;--under:#FFEB9C;--underT:#9C5700;--over:#FFC7CE;--overT:#9C0006;
  --font:Calibri,Carlito,'Segoe UI',Arial,sans-serif;
}
html,body{background:#fff}
body{font-family:var(--font);color:var(--navy);font-size:13px;line-height:1.3}
button,input,select{font-family:var(--font)}

/* top bar (guard.js adds the Logout link into the empty span) */
.top-bar{background:var(--navy);padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
.top-bar a{color:#fff;text-decoration:none;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.top-bar a:hover{opacity:1}

.page{max-width:1500px;margin:0 auto;padding:18px 20px 60px}
.title{font-size:26px;font-weight:700;color:var(--navy);letter-spacing:.5px}
.subtitle{font-size:14px;color:var(--blue);margin:2px 0 4px}
.status{font-size:12px;font-style:italic;color:var(--blue);margin-bottom:10px}
.status.ro{color:#c00000}

/* buttons */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 14px}
.btn{border:0;border-radius:4px;padding:6px 12px;font-size:12px;font-weight:700;color:#fff;background:var(--navy);cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.blue{background:var(--blue)}
.btn.gold{background:var(--gold)}
.btn.green{background:#25D366}
.btn.grey{background:var(--grey)}
.btn.light{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.home{background:#4AC9CC;padding:0;height:26px;width:88px;display:inline-flex;align-items:center;justify-content:center}
.btn.home img{height:20px;display:block}
.gap{width:10px}

/* ---------- INDEX ---------- */
.index-wrap{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start}
.cal{min-width:520px}
.cal table{border-collapse:collapse;width:100%}
.cal .month td{font-size:16px;font-weight:700;color:var(--navy);padding:16px 0 4px;border-bottom:2px solid var(--navy);text-align:left}
.cal .dow td{font-size:11px;color:var(--grey);text-align:center;padding:4px 0}
.cal .wk td{text-align:center;padding:5px 4px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.cal .wk:hover td{background:#f3f8fd}
.cal .wk td.wn{font-weight:700;color:var(--navy);width:62px}
.cal .wk td.d{width:44px;color:#000}
.cal .wk td.d.off{color:#bebebe}
.cal .wk td.d.mon{background:var(--gold);color:#fff;font-weight:700}
.cal .wk td.h{width:90px}
.cal .wk td.note{width:100px;font-size:11px;font-style:italic;color:var(--grey)}
.cal .wk.now td{background:var(--band);font-weight:700}
.cal .wk.now td.note{color:var(--blue)}

.team-box h3{font-size:16px;font-weight:700;color:var(--navy);margin:16px 0 6px}
.tt{border-collapse:collapse}
.tt th{background:var(--navy);color:#fff;font-size:12px;padding:4px 6px;text-align:left}
.tt td{border-bottom:1px solid var(--line);padding:2px 4px;font-size:13px}
.tt td.c{text-align:center}
.tt tr.inactive td{color:#b4b4b4}
.tt input,.tt select{border:1px solid transparent;background:transparent;font-size:13px;color:inherit;padding:2px 3px;width:100%}
.tt input:hover,.tt select:hover{border-color:var(--line)}
.tt input:focus,.tt select:focus{outline:none;border-color:var(--blue);background:#fff}
.tt .w-name{width:150px}.tt .w-team{width:130px}.tt .w-role{width:150px}.tt .w-s{width:62px}.tt .w-t{width:84px}.tt .w-n{width:56px}.tt .w-d{width:128px}
.tt input[type=date]{font-size:12px}
.tt .del{border:0;background:none;color:#c00000;cursor:pointer;font-size:15px;padding:0 4px;opacity:.5}
.tt .del:hover{opacity:1}
.hint{font-size:11px;font-style:italic;color:var(--grey);margin-top:6px;max-width:560px}

/* ---------- WEEK ---------- */
.week-wrap{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.scroll{overflow-x:auto;max-width:100%}
table.rota{border-collapse:collapse;table-layout:fixed;font-size:13px}
table.rota td,table.rota th{height:20px;padding:0 3px;text-align:center;white-space:nowrap;overflow:hidden;border:0}
table.rota .nm{text-align:left;padding-left:8px}
table.rota col.c-n{width:150px}
table.rota col.c-s,table.rota col.c-e{width:56px}
table.rota col.c-d{width:12px}
table.rota col.c-h{width:64px}
/* frame + lines (Excel style, no gridlines) */
.frame{border:2px solid var(--navy)}
table.rota tr.r td,table.rota tr.r th{border-bottom:1px solid var(--line)}
table.rota .ds{border-left:1px solid var(--blue)}
table.rota .hs{border-left:2px solid var(--navy)}
table.rota tr.hdr th{background:var(--navy);color:#fff;font-weight:700;height:24px}
table.rota tr.hdr th.monopen{background:var(--gold)}
table.rota tr.band td{background:var(--band);font-weight:700}
table.rota tr.lbl td.nm{font-weight:700}
table.rota tr.sp td{height:6px;border-bottom:1px solid var(--line)}
table.rota tr.team td{background:var(--band);font-weight:700;border-top:1px solid var(--blue)}
table.rota tr.tot td{background:var(--band);font-weight:700;border-top:2px solid var(--navy)}
table.rota td.cl{background:var(--closed)!important;color:var(--grey)}
table.rota td.closedlbl{font-style:italic;font-weight:400}
table.rota td.ag{background:var(--agency)}
table.rota td.k-hol{background:var(--holiday)}
table.rota td.k-sick{background:var(--sick)}
table.rota td.k-tbc{background:var(--tbc)}
table.rota td.k-close{background:var(--closing)}
table.rota td.u{background:var(--under);color:var(--underT);font-weight:700}
table.rota td.o{background:var(--over);color:var(--overT);font-weight:700}
table.rota td.dash{color:var(--blue);padding:0}
table.rota td.txt{text-align:left;padding-left:4px}
table.rota input.t{width:100%;height:19px;border:1px solid transparent;background:transparent;text-align:center;font-size:13px;color:var(--navy);padding:0}
table.rota td.txt input.t{text-align:left}
table.rota input.t:hover{border-color:var(--line)}
table.rota input.t:focus{outline:none;border-color:var(--blue);background:#fff}
.credit{font-size:8px;letter-spacing:.6px;color:#7887a0;text-align:right;padding-top:3px}
.below{margin-top:14px}
table.rota.paid td{font-weight:700;background:var(--band)}
table.rota.who td{vertical-align:top;text-align:left;padding:3px 6px;font-size:11.5px;line-height:1.35;white-space:normal;height:auto;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
table.rota.who th{background:var(--navy);color:#fff;height:22px;font-size:12px}
table.rota.who td.lab{border-left:0}
table.rota.who td.lab b{display:block;font-size:12.5px;color:var(--navy)}
table.rota.who td.lab span{color:var(--blue);font-size:11px}
table.rota.who td.nobody{background:var(--over);color:var(--overT);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:11.5px;margin-top:14px}
.legend b{margin-right:6px}
.legend i{display:inline-block;width:34px;height:13px;border:1px solid var(--line);vertical-align:middle;margin-right:5px}
.panel{width:300px}
.panel .ph{background:var(--navy);color:#fff;font-weight:700;text-align:center;padding:4px;font-size:12px}
.panel .lab{font-weight:700;font-size:12px;margin-top:10px}
.panel .over{color:var(--overT)}.panel .under{color:var(--underT)}
.panel .box{padding:6px 8px;min-height:44px;font-size:12px;white-space:pre-line}
.panel .box.over{background:#FFEBEE}.panel .box.under{background:#FFF7D6}
.panel .note{font-size:10.5px;font-style:italic;color:var(--grey);margin-top:12px}

/* ---------- dialogs / toast ---------- */
.dlg-overlay{position:fixed;inset:0;background:rgba(15,25,45,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:9000;padding:20px}
.dlg-overlay.open{display:flex}
.dlg{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:20px 22px;max-width:440px;width:100%}
.dlg h3{font-size:20px;color:var(--navy);margin-bottom:4px}
.dlg p{font-size:13px;color:#445;margin-bottom:14px;white-space:pre-line}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.dlg .months{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.toast{position:fixed;right:18px;top:60px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .25s;z-index:9500;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:#c00000}
.closed-page{position:fixed;inset:0;z-index:9800;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.closed-page h2{font-size:26px;color:var(--navy);margin-bottom:14px;max-width:560px}
.closed-page a{color:var(--blue);font-size:13px}
.loading{padding:40px;text-align:center;color:var(--grey)}

/* ---------- print ---------- */
#printRoot{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#printRoot .sheet{width:1040px;height:710px;overflow:hidden;page-break-after:always;break-after:page;position:relative;background:#fff}
#printRoot .sheet:last-child{page-break-after:auto;break-after:auto}
#printRoot .inner{transform-origin:0 0}
#printRoot .pcred{position:absolute;top:0;right:0;text-align:right;z-index:2;line-height:1.35}
#printRoot .pcred .pd{font-size:10px;color:var(--blue)}
#printRoot .pcred .pc{font-size:8px;font-weight:700;letter-spacing:.8px;color:var(--navy)}
#printRoot .ptitle{font-size:24px;font-weight:700;color:var(--navy)}
#printRoot .psub{font-size:13px;color:var(--blue);margin:2px 0 10px}
#printRoot table.sum{border-collapse:collapse;font-size:12px;margin-top:10px}
#printRoot table.sum th{background:var(--navy);color:#fff;padding:4px 10px}
#printRoot table.sum td{border-bottom:1px solid var(--line);padding:3px 10px;text-align:center}
#printRoot table.sum td.nm{text-align:left}
#printRoot table.sum td.b{font-weight:700}
</style>
</head>
<body>

<div class="top-bar">
  <a href="../operations.html">&larr; Back</a>
  <span></span>
</div>

<div class="page" id="app"><div class="loading">Loading the rota…</div></div>

<div id="printRoot"></div>

<datalist id="timeList"></datalist>
<datalist id="roleList">
  <option value="General Manager"><option value="Restaurant Manager"><option value="Assistant Manager"><option value="Maître d'">
  <option value="Head Sommelier"><option value="Sommelier"><option value="Commis Sommelier">
  <option value="Chef de Rang"><option value="Commis"><option value="Runner"><option value="Receptionist"><option value="Agency">
</datalist>

<!-- generic dialog -->
<div class="dlg-overlay" id="dlg">
  <div class="dlg">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div id="dlgExtra"></div>
    <div class="acts" id="dlgActs"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../auth.js"></script>
<script src="../guard.js"></script>
<script>
/* =====================================================================
   PETRUS ROTA (web) — same rules as the Excel rota.
   Index: calendar (click a week) + Team table.  Week: one week, editable.
   Paid hours: 30 min unpaid break for every 6 h worked. Holiday/Sick/TBC = 0 h.
   Edit: Fiorella only for now (Milena view only until Fiorella says).  View: Operations team.
   ===================================================================== */
(function(){
'use strict';

var EDITORS = ['fiorella@petrus.local'];               // full access (Index, team table, WhatsApp)
var WEEK_EDITORS = ['milena@petrus.local'];            // weeks only: no Index, no team table, no WhatsApp; opens from Operations
var VIEWERS = EDITORS.concat(WEEK_EDITORS, ['orson@petrus.local','liza@petrus.local']);
var DEFAULT_START = '2026-11-09';
var CREDIT = 'AUTOMATION \u00B7 FIORELLA ATENCIO';
var HOME_URL = 'https://gordonramsayhome.workvivo.com/';
var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];

var CFG = db.collection('rota2_config').doc('main');
var CFG_PUBLIC = db.collection('rota2_config').doc('public');   // team list WITHOUT min/max hours (for the staff view)
var WEEKS = db.collection('rota2_weeks');

var S = { user:null, canEdit:false, cfg:null, weeks:{}, view:'index', mon:null, unsub:null, pendingRender:false };

/* ---------------------------------------------------------------- dates */
function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var w=(x.getDay()+6)%7; return addDays(x,-w); }
function today(){ var t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function isoWeek(d){ var x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); var day=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day); var y0=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return Math.ceil(((x-y0)/86400000+1)/7); }
function fmtDay(d){ return DAYS[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()]; }
function fmtDM(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function dayClosed(k,monOpen){ return k===6 || (k===0 && !monOpen); }
function periodStart(){ return parseYmd((S.cfg && S.cfg.start) || DEFAULT_START); }
function periodEnd(){
  var t=today(), e=new Date(t.getFullYear(), t.getMonth()+3, 0);       // end of the month after next
  var min=new Date(2026,11,31);
  return e<min?min:e;
}

/* ---------------------------------------------------------------- times */
// minutes 0..1440 or null
function tMin(v){
  if (v===null || v===undefined) return null;
  var s=String(v).trim(); if(!s) return null;
  var m=s.match(/^(\d{1,2})[:.h]?(\d{2})?$/);
  if(!m) return null;
  var h=+m[1], mi=m[2]?+m[2]:0;
  if (s.length<=2 && m[2]===undefined) { mi=0; }
  if(h>24||mi>59) return null;
  if(h===24 && mi>0) return null;
  return h*60+mi;
}
function isTime(v){ return tMin(v)!==null; }
function fmtT(m){ m=m%1440; return pad(Math.floor(m/60))+':'+pad(m%60); }
function normValue(v){
  var s=String(v||'').trim(); if(!s) return '';
  var low=s.toLowerCase();
  if(low==='h'||low==='hol'||low==='holiday'||low==='holidays') return 'Holiday';
  if(low==='s'||low==='sick') return 'SICK';
  if(low==='tbc') return 'TBC';
  var m=tMin(s); if(m!==null) return fmtT(m);
  return s;
}
function isWord(v,w){ return String(v||'').trim().toLowerCase()===w.toLowerCase(); }
// paid minutes for one shift
function paidMin(s,e){
  var a=tMin(s), b=tMin(e); if(a===null||b===null) return 0;
  var d=(b%1440)-(a%1440); if(d<0) d+=1440;
  var breaks=Math.floor((d/60+1e-6)/6);
  return d-breaks*30;
}
function fmtH(m,blankZero){ if(!m && blankZero) return ''; m=Math.round(m||0); return Math.floor(m/60)+':'+pad(m%60); }
// 0 Opening, 1 Lunch, 2 Dinner, 3 Closing
function staffMatch(cat,s,e){
  var a=tMin(s); if(a===null) return false;
  var st=a%1440, b=tMin(e), hasE=b!==null, raw=hasE?b%1440:0, en=hasE?(raw<=180?raw+1440:raw):0;
  if(cat===0) return st>=540 && st<=630;
  if(cat===1) return (st>=660&&st<=900) || (st<660 && hasE && en>=780);
  if(cat===2) return (st>=960&&st<=1080) || (st<960 && hasE && en>=1260);
  return hasE && raw<=180;
}
function countL(s){ var a=tMin(s); return a!==null && a<=780; }
function countD(e){ var b=tMin(e); return b!==null && (b>1200 || b<=180); }
function isClosingEnd(e){ var b=tMin(e); return b!==null && (b%1440)<=180; }

/* ---------------------------------------------------------------- helpers */
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(msg,err){ var t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(toast._t); toast._t=setTimeout(function(){t.className='toast'+(err?' err':'');},err?4000:1400); }
function stamp(){ return { updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: (S.user&&S.user.email)||'' }; }
function blank14(){ var a=[]; for(var i=0;i<14;i++) a.push(''); return a; }

function dialog(title,text,buttons,extraHtml){
  var o=document.getElementById('dlg');
  o.querySelector('.dlg').style.maxWidth='';
  document.getElementById('dlgTitle').textContent=title;
  document.getElementById('dlgText').textContent=text||'';
  document.getElementById('dlgExtra').innerHTML=extraHtml||'';
  var acts=document.getElementById('dlgActs'); acts.innerHTML='';
  (buttons||[{label:'OK',cls:''}]).forEach(function(b){
    var el=document.createElement(b.href?'a':'button');
    el.className='btn '+(b.cls||''); el.textContent=b.label;
    if(b.href){ el.href=b.href; el.target='_blank'; el.rel='noopener'; el.style.textDecoration='none'; }
    el.onclick=function(){ closeDialog(); if(b.fn) b.fn(); };
    acts.appendChild(el);
  });
  o.classList.add('open');
}
function closeDialog(){ document.getElementById('dlg').classList.remove('open'); }
function confirmDlg(title,text,okLabel,fn){ dialog(title,text,[{label:'Cancel',cls:'light'},{label:okLabel||'OK',fn:fn}]); }
document.getElementById('dlg').addEventListener('click',function(e){ if(e.target.id==='dlg') closeDialog(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(document.getElementById('dlg').classList.contains('open')){ closeDialog(); e.preventDefault(); } } });

// time list (drop-down)
(function(){ var dl=document.getElementById('timeList'), h=''; ['Holiday','SICK','TBC'].forEach(function(w){h+='<option value="'+w+'">';}); for(var m=540;m<=1440;m+=15){ h+='<option value="'+fmtT(m)+'">'; } dl.innerHTML=h; })();

/* ---------------------------------------------------------------- config */
function cfgTeam(){ return (S.cfg && S.cfg.team) || []; }
function teamOrderList(){
  var list=((S.cfg&&S.cfg.teamOrder)||[]).slice().sort(function(a,b){ return (num(a.order,999))-(num(b.order,999)); }).map(function(t){return String(t.team||'').toUpperCase();}).filter(Boolean);
  cfgTeam().forEach(function(p){ var t=String(p.team||'OTHER').toUpperCase(); if(list.indexOf(t)<0) list.push(t); });
  return list;
}
function num(v,d){ var n=parseFloat(v); return isNaN(n)?d:n; }
function personByName(name){ var n=String(name||'').trim().toUpperCase(); var r=null; cfgTeam().forEach(function(p){ if(!r && String(p.name||'').trim().toUpperCase()===n) r=p; }); return r; }

/* ---------------------------------------------------------------- week model */
function weekDoc(monStr){ return S.weeks[monStr] || null; }
function buildModel(monStr){
  var doc=weekDoc(monStr) || {}, e=doc.e||{}, used={}, seq={};
  var model={ mon:parseYmd(monStr), monStr:monStr, monOpen:!!doc.mondayOpen,
              info:{covers:(doc.info&&doc.info.covers)||blank14(), tables:(doc.info&&doc.info.tables)||blank14(), kt:(doc.info&&doc.info.kt)||blank14()},
              sections:[], exists:!!weekDoc(monStr) };
  var stored=Object.keys(e).map(function(k){ return {key:k, d:e[k]}; });
  var sunStr=ymd(addDays(parseYmd(monStr),6));
  var teams=teamOrderList();
  stored.forEach(function(s){ var p=personByName(s.d.name), t=p?String(p.team||'OTHER').toUpperCase():String(s.d.team||'OTHER').toUpperCase(); s.team=t; if(teams.indexOf(t)<0) teams.push(t); });
  teams.forEach(function(team){
    var sec={team:team, rows:[]};
    cfgTeam().filter(function(p){ return String(p.team||'OTHER').toUpperCase()===team && p.active!==false
                                       && !(p.start && String(p.start) > sunStr); })   // not started yet: shown from the week of their start date
      .map(function(p,i){ return {p:p,i:i}; })
      .sort(function(a,b){ return (num(a.p.order,999)-num(b.p.order,999)) || (a.i-b.i); })
      .forEach(function(x){
        var nm=String(x.p.name).trim(), K=nm.toUpperCase(); seq[K]=(seq[K]||0)+1;
        var key=nm+'#'+seq[K], v=(e[key]&&e[key].v)||blank14(); used[key]=true;
        sec.rows.push(makeRow(key,nm,team,seq[K],v,x.p));
      });
    stored.forEach(function(s){                    // saved this week but not active now: kept so nothing disappears
      if(used[s.key] || s.team!==team) return;
      if(!(s.d.v||[]).some(function(x){return String(x||'').trim();})) return;
      used[s.key]=true;
      sec.rows.push(makeRow(s.key,s.d.name,team,s.d.seq||1,s.d.v,personByName(s.d.name)||{}));
    });
    if(sec.rows.length) model.sections.push(sec);
  });
  return model;
}
function makeRow(key,name,team,seq,v,p){
  v=(v||blank14()).slice(); while(v.length<14) v.push('');
  var hours=0, off=0;
  for(var k=0;k<7;k++){ hours+=paidMin(v[2*k],v[2*k+1]); }
  v.forEach(function(x){ if(isWord(x,'Holiday')||isWord(x,'SICK')) off++; });
  var mn=num(p&&p.min,0), mx=num(p&&p.max,0), minEff=mn>0?Math.max(0,mn-mn/5*off):0;
  return { key:key, name:name, team:team, seq:seq, v:v, agency:String((p&&p.type)||'').toLowerCase()==='agency',
           hours:hours, min:minEff, max:mx>0?mx:0,
           under: mn>0 && hours < minEff*60-0.01, over: mx>0 && hours > mx*60+0.01 };
}

function loadCfg(){

    S.cfg = s.exists ? s.data() : { start:DEFAULT_START, team:[], teamOrder:[] };
  });
}
function loadRange(){
  var a=ymd(mondayOf(periodStart())), b=ymd(periodEnd());
  return WEEKS.where('monday','>=',a).where('monday','<=',b).get().then(function(q){
    q.forEach(function(d){ S.weeks[d.id]=d.data(); });
  });
}
function loadWeek(monStr){
  return WEEKS.doc(monStr).get().then(function(d){ if(d.exists) S.weeks[monStr]=d.data(); else delete S.weeks[monStr]; return S.weeks[monStr]; });
}
function watchWeek(monStr){
  if(S.unsub){ S.unsub(); S.unsub=null; }
  S.unsub = WEEKS.doc(monStr).onSnapshot(function(d){
    if(d.metadata && d.metadata.hasPendingWrites) return;
    if(d.exists) S.weeks[monStr]=d.data(); else delete S.weeks[monStr];
    if(S.view==='week' && S.mon===monStr){
      if(isEditing()) S.pendingRender=true; else renderWeek();
    }
  }, function(){});
}
function isEditing(){ var a=document.activeElement; return a && a.classList && a.classList.contains('t'); }
document.addEventListener('focusout',function(){ setTimeout(function(){ if(S.pendingRender && !isEditing()){ S.pendingRender=false; if(S.view==='week') renderWeek(true); } },0); });

/* ---------------------------------------------------------------- saving */
function ensureWeekLocal(monStr){
  if(!S.weeks[monStr]) S.weeks[monStr]={ monday:monStr, mondayOpen:false, info:{covers:blank14(),tables:blank14(),kt:blank14()}, e:{} };
  var w=S.weeks[monStr]; w.info=w.info||{covers:blank14(),tables:blank14(),kt:blank14()}; w.e=w.e||{};
  return w;
}
function saveCell(monStr,row,idx,value){
  var w=ensureWeekLocal(monStr), cur=(w.e[row.key]&&w.e[row.key].v)||blank14();
  cur=cur.slice(); while(cur.length<14) cur.push(''); cur[idx]=value;
  w.e[row.key]={name:row.name, team:row.team, seq:row.seq, v:cur};
  var patch={ monday:monStr, e:{} }; patch.e[row.key]=w.e[row.key];
  return write(monStr, patch, true);
}
function saveInfo(monStr,field,idx,value){
  var w=ensureWeekLocal(monStr), arr=(w.info[field]||blank14()).slice(); while(arr.length<14) arr.push(''); arr[idx]=value; w.info[field]=arr;
  var patch={ monday:monStr, info:{} }; patch.info[field]=arr;
  return write(monStr, patch, true);
}
function write(monStr,data,merge){
  var d=Object.assign({},data,stamp());
  return WEEKS.doc(monStr).set(d,{merge:!!merge}).then(function(){ toast('Saved'); }).catch(function(err){ toast('Could not save: '+(err&&err.message||err),true); });
}
// copy of the team for the staff view: names, teams, order and type only (no min/max hours)
function publicCfg(d){
  return Object.assign({ start:d.start||DEFAULT_START,
    team:(d.team||[]).map(function(p){ return { name:p.name, team:p.team, active:p.active!==false, type:p.type||'Staff', order:p.order, start:p.start||'' }; }),
    teamOrder:(d.teamOrder||[]).map(function(t){ return { team:t.team, order:t.order }; }) }, stamp());
}
var cfgTimer=null;
function saveCfgSoon(){
  clearTimeout(cfgTimer);
  cfgTimer=setTimeout(function(){
    var d=Object.assign({ start:S.cfg.start||DEFAULT_START, team:S.cfg.team||[], teamOrder:S.cfg.teamOrder||[] }, stamp());
    CFG.set(d).then(function(){ toast('Team saved'); return CFG_PUBLIC.set(publicCfg(d)); })
       .catch(function(err){ toast('Could not save the team: '+(err&&err.message||err),true); });
  },400);
}

function colgroup(withHours){
  var c='<colgroup><col class="c-n">'; for(var k=0;k<7;k++) c+='<col class="c-s"><col class="c-d"><col class="c-e">'; if(withHours) c+='<col class="c-h">'; return c+'</colgroup>';
}
// main table. opts.print: no HOURS column, text instead of inputs, ends at TOTAL FOH + credit
function rotaTable(m,opts){
  var H=!opts.print, E=opts.edit&&!opts.print, k, h='', r, sec, cid=0;
  function dayCls(k,base){ return (base||'')+(dayClosed(k,m.monOpen)?' cl':'')+' ds'; }
  h+='<table class="rota frame">'+colgroup(H);
  // DATE
  h+='<tr class="hdr r"><th class="nm">DATE</th>';
  for(k=0;k<7;k++) h+='<th colspan="3" class="ds'+(k===0&&m.monOpen?' monopen':'')+'">'+fmtDay(addDays(m.mon,k))+'</th>';
  if(H) h+='<th class="hs">HOURS</th>'; h+='</tr>';
  // SERVICE
  h+='<tr class="band r"><td class="nm">SERVICE</td>';
  for(k=0;k<7;k++){ if(dayClosed(k,m.monOpen)) h+='<td colspan="3" class="'+dayCls(k,'closedlbl')+'">closed</td>'; else h+='<td class="ds">L</td><td></td><td>D</td>'; }
  if(H) h+='<td class="hs"></td>'; h+='</tr>';
  // COVERS / TABLES / KT
  [['COVERS','covers'],['TABLES','tables'],['KT','kt']].forEach(function(x){
    h+='<tr class="lbl r"><td class="nm">'+x[0]+'</td>';
    for(k=0;k<7;k++){
      var cl=dayClosed(k,m.monOpen);
      for(var j=0;j<2;j++){
        var v=infoNum((m.info[x[1]]||[])[2*k+j]), cls=(cl?' cl':'')+(j===0?' ds':'');
        var cell = (E&&!cl) ? '<input class="t" data-info="'+x[1]+'" data-i="'+(2*k+j)+'" data-cell="i-'+x[1]+'-'+(2*k+j)+'" value="'+esc(v)+'" inputmode="numeric">' : esc(v);
        h+='<td class="'+cls+'">'+cell+'</td>'; if(j===0) h+='<td class="'+(cl?'cl':'')+'"></td>';
      }
    }
    if(H) h+='<td class="hs"></td>'; h+='</tr>';
  });
  h+=spacer(m,H);
  // teams
  var totL=[0,0,0,0,0,0,0], totD=[0,0,0,0,0,0,0], totH=0, rowIdx=0;
  m.sections.forEach(function(sec){
    var L=[0,0,0,0,0,0,0], D=[0,0,0,0,0,0,0], sh=0;
    sec.rows.forEach(function(r){ for(var k=0;k<7;k++){ if(countL(r.v[2*k])) L[k]++; if(countD(r.v[2*k+1])) D[k]++; } sh+=r.hours; });
    h+='<tr class="team r"><td class="nm">'+esc(sec.team)+'</td>';
    for(k=0;k<7;k++){ var cl=dayClosed(k,m.monOpen)?' cl':''; h+='<td class="ds'+cl+'">'+(L[k]||'')+'</td><td class="'+cl+'"></td><td class="'+cl+'">'+(D[k]||'')+'</td>'; totL[k]+=L[k]; totD[k]+=D[k]; }
    if(H) h+='<td class="hs">'+fmtH(sh,true)+'</td>'; h+='</tr>';
    totH+=sh;
    sec.rows.forEach(function(r){
      h+='<tr class="r"><td class="nm'+(r.agency?' ag':'')+'">'+esc(r.name)+'</td>';
      for(k=0;k<7;k++){
        var s=r.v[2*k], e=r.v[2*k+1], cl=dayClosed(k,m.monOpen), kc='';
        if(!cl){ if(isWord(s,'Holiday')) kc=' k-hol'; else if(isWord(s,'SICK')) kc=' k-sick'; else if(isWord(s,'TBC')||isWord(e,'TBC')) kc=' k-tbc'; else if(isClosingEnd(e)) kc=' k-close'; }
        var base=(cl?' cl':'')+kc, wide=!isTime(s) && String(s||'').trim() && !String(e||'').trim();
        if(wide && !E){ h+='<td colspan="3" class="ds txt'+base+'">'+esc(s)+'</td>'; continue; }
        if(wide && E){
          h+='<td colspan="3" class="ds txt'+base+'">'+inp(r,2*k,s,rowIdx,2*k)+'</td>'; continue;
        }
        h+='<td class="ds'+base+'">'+(E&&!cl?inp(r,2*k,s,rowIdx,2*k):esc(s))+'</td>';
        h+='<td class="dash'+base+'">'+(String(e||'').trim()?'-':'')+'</td>';
        h+='<td class="'+base.trim()+'">'+(E&&!cl?inp(r,2*k+1,e,rowIdx,2*k+1):esc(e))+'</td>';
      }
      if(H) h+='<td class="hs'+(r.over?' o':(r.under?' u':''))+'">'+fmtH(r.hours,true)+'</td>';
      h+='</tr>'; rowIdx++;
    });
  });
  h+=spacer(m,H);
  // TOTAL FOH
  h+='<tr class="tot"><td class="nm">TOTAL FOH</td>';
  for(k=0;k<7;k++){ var cl=dayClosed(k,m.monOpen)?' cl':''; h+='<td class="ds'+cl+'">'+(totL[k]||'')+'</td><td class="'+cl+'"></td><td class="'+cl+'">'+(totD[k]||'')+'</td>'; }
  if(H) h+='<td class="hs">'+fmtH(totH,true)+'</td>'; h+='</tr>';
  h+='</table>';
  if(!opts.print) h+='<div class="credit" style="width:'+(150+7*124+64)+'px">'+CREDIT+'</div>';   // printed sheets carry it in the header
  m.totH=totH;
  return h;
}
function inp(r,idx,v,rowIdx,colIdx){
  return '<input class="t" list="timeList" data-key="'+esc(r.key)+'" data-i="'+idx+'" data-r="'+rowIdx+'" data-c="'+colIdx+'" data-cell="p-'+rowIdx+'-'+colIdx+'" value="'+esc(v)+'" autocomplete="off">';
}
function spacer(m,H){

// covers / tables / KT saved earlier as a time by mistake ("13:00", "06:00") -> show the number typed (13, 6)
function infoNum(v){
  var s=String(v===undefined||v===null?'':v).trim(), m=s.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return s;
  return m[2]==='00' ? String(+m[1]) : String(+m[1])+m[2];
}

function act(a){
  if(S.staff && ['prev','next','thisweek'].indexOf(a)<0) return;      // staff: only move between weeks
  if(S.noIndex && ['addp','addt','wa'].indexOf(a)>=0) return;          // week editors: no team table, no WhatsApp
  if(a==='index') return goIndex();
  if(a==='thisweek'){ var m=mondayOf(today()); if(m<mondayOf(periodStart())) m=mondayOf(periodStart()); return openWeek(ymd(m)); }
  if(a==='prev'){ var p=addDays(parseYmd(S.mon),-7); if(p<mondayOf(periodStart())) return toast('This is the first week of the rota.'); return openWeek(ymd(p)); }
  if(a==='next') return openWeek(ymd(addDays(parseYmd(S.mon),7)));
  if(a==='print') return printWeek(false);
  if(a==='home'){ var w=window.open(HOME_URL,'_blank','noopener'); if(!w) location.href=HOME_URL; return; }
  if(a==='copy') return copyPrevious();
  if(a==='monday') return mondayToggle();

}

/* ---------------------------------------------------------------- WhatsApp */
// Message for one day (start time only in Opening, and in Lunch for people not already in Opening).
function waText(t){
  var mon=ymd(mondayOf(t)), k=(t.getDay()+6)%7, m=buildModel(mon);
  if(t<periodStart()) return {error:'Today ('+fmtDM(t)+') is before the start of the rota.'};
  if(dayClosed(k,m.monOpen)) return {error:'Today ('+DAYS[k]+' '+fmtDM(t)+') the restaurant is closed — nothing to send.'};
  var L=whoLists(m,k), heads=['Opening','Lunch','Dinner','Closing'], txt='*Today\'s Rota '+fmtDM(t)+'*\n', any=false;
  for(var c=0;c<4;c++){
    txt+='\n*'+heads[c]+'*\n';
    if(L[c].length){ any=true; L[c].forEach(function(r){
      var s=r.v[2*k], showT=(c===0)||(c===1 && !staffMatch(0,s,r.v[2*k+1]));
      txt+='\u2022 '+r.name+(showT?' '+fmtT(tMin(s)):'')+'\n';
    }); }
    else txt+=(c===0||c===3)?'\u26A0\uFE0F NOBODY\n':'-\n';
  }
  if(!any) return {error:'There are no shifts for today ('+DAYS[k]+' '+fmtDM(t)+') yet.'};
  return {text:txt};
}
// Same lists as the text, as data for the image card.
function waData(t){
  var mon=ymd(mondayOf(t)), k=(t.getDay()+6)%7, m=buildModel(mon);
  if(t<periodStart()) return {error:'Today ('+fmtDM(t)+') is before the start of the rota.'};
  if(dayClosed(k,m.monOpen)) return {error:'Today ('+DAYS[k]+' '+fmtDM(t)+') the restaurant is closed — nothing to send.'};
  var L=whoLists(m,k), lists=[], any=false;
  for(var c=0;c<4;c++){
    if(L[c].length) any=true;
    lists.push(L[c].map(function(r){
      var s=r.v[2*k], showT=(c===0)||(c===1 && !staffMatch(0,s,r.v[2*k+1]));
      return { name:r.name, team:r.team, time: showT ? fmtT(tMin(s)) : '' };
    }));
  }
  if(!any) return {error:'There are no shifts for today ('+DAYS[k]+' '+fmtDM(t)+') yet.'};
  // covers / tables / KT for lunch (index 2k) and dinner (2k+1)
  function svc(j){
    var cv=infoNum((m.info.covers||[])[2*k+j]), tb=infoNum((m.info.tables||[])[2*k+j]), kt=infoNum((m.info.kt||[])[2*k+j]);
    if(!cv && !tb && !kt) return '';
    var parts=[]; if(cv) parts.push(cv+'C'); if(tb) parts.push(tb+'T'); if(kt) parts.push(kt+'KT');
    return parts.join(' / ');
  }
  return { date:t, k:k, lists:lists, lunch:svc(0), dinner:svc(1) };
}

// Short team label + colours for the pill shown next to each name on the WhatsApp card.
function teamTag(team){
  var t=String(team||'').toUpperCase().trim(), map={
    'MANAGEMENT':['MGMT','#1F3864','#FFFFFF'], 'MANAGER':['MGMT','#1F3864','#FFFFFF'],
    'CDR':['CDR','#2F5597','#FFFFFF'], 'CDR/COMMIS':['CDR','#2F5597','#FFFFFF'],
    'COMMIS':['COMMIS','#BDD7EE','#1F3864'],
    'SOMMELIERS':['SOMM','#7B2C3B','#FFFFFF'], 'SOMMELIER':['SOMM','#7B2C3B','#FFFFFF'],
    'RECEPTION':['REC','#BF9000','#FFFFFF'] };
  var v=map[t] || [t.slice(0,6)||'TEAM','#E7E6E6','#1F3864'];
  return { label:v[0], bg:v[1], fg:v[2] };
}
// Image card for WhatsApp: today's date, Opening / Lunch / Dinner / Closing in a 2x2 grid.
function drawCard(d){
  var FONT='Calibri, Carlito, "Segoe UI", Arial, sans-serif', NAVY='#1F3864', BLUE='#2F5597', LINE='#9BB7D9', BAND='#DDEBF7';
  var heads=['OPENING','LUNCH','DINNER','CLOSING'], W=1080, P=48, G=24, CW=(W-2*P-G)/2, LH=50, HH=70, TOP=206;
  var grid=[[0,1],[2,3]];
  var rowH=grid.map(function(r){ return HH+22+Math.max(1,d.lists[r[0]].length,d.lists[r[1]].length)*LH+18; });
  var H=TOP+rowH[0]+G+rowH[1]+84;
  var c=document.createElement('canvas'); c.width=W; c.height=H;
  var x=c.getContext('2d');
  function rr(px,py,w,h,r,top){ x.beginPath(); if(x.roundRect){ x.roundRect(px,py,w,h,top?[r,r,0,0]:r); } else { x.rect(px,py,w,h); } }
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  // header
  x.fillStyle=NAVY; x.fillRect(0,0,W,172);
  x.fillStyle='#fff'; x.font='bold 58px '+FONT; x.textBaseline='alphabetic'; x.fillText('PETRUS \u00B7 ROTA',P,84);
  var dt=d.date;
  x.fillStyle=BAND; x.font='34px '+FONT;
  x.fillText('TODAY  \u00B7  '+DAYS[d.k]+' '+dt.getDate()+' '+MONTHS[dt.getMonth()]+' '+dt.getFullYear(),P,138);
  // covers / tables / KT, top right
  x.textAlign='right';
  [['Lunch',d.lunch,78],['Dinner',d.dinner,128]].forEach(function(s){
    var val=s[1]||'-';
    x.font='bold 32px '+FONT; x.fillStyle='#fff'; x.fillText(val,W-P,s[2]);
    var vw=x.measureText(val).width;
    x.font='28px '+FONT; x.fillStyle=BAND; x.fillText(s[0]+'  ',W-P-vw,s[2]);
  });
  x.textAlign='left';
  // cards
  var y=TOP;
  grid.forEach(function(r,ri){
    r.forEach(function(ci,j){
      var bx=P+j*(CW+G), by=y, bh=rowH[ri], L=d.lists[ci];
      x.fillStyle=BAND; rr(bx,by,CW,HH,16,true); x.fill();
      x.strokeStyle=LINE; x.lineWidth=2; rr(bx,by,CW,bh,16,false); x.stroke();
      x.fillStyle=NAVY; x.font='bold 36px '+FONT; x.textAlign='left'; x.fillText(heads[ci],bx+26,by+47);
      x.fillStyle=BLUE; x.font='bold 30px '+FONT; x.textAlign='right'; x.fillText(L.length?String(L.length):'',bx+CW-26,by+46);
      x.textAlign='left';
      if(!L.length){
        if(ci===0||ci===3){
          x.fillStyle='#FFC7CE'; rr(bx+20,by+HH+18,CW-40,LH,10,false); x.fill();
          x.fillStyle='#9C0006'; x.font='bold 32px '+FONT; x.fillText('NOBODY',bx+36,by+HH+18+35);
        } else { x.fillStyle='#8C8C8C'; x.font='32px '+FONT; x.fillText('-',bx+26,by+HH+22+34); }
      } else {
        L.forEach(function(p,i){
          var ly=by+HH+22+i*LH+34;
          if(i>0){ x.strokeStyle='#E3ECF7'; x.lineWidth=1; x.beginPath(); x.moveTo(bx+22,ly-36); x.lineTo(bx+CW-22,ly-36); x.stroke(); }
          // team pill first (fixed width so all names line up), then the name
          var tg=teamTag(p.team), PW=92, px0=bx+24, py0=ly-25;
          x.fillStyle=tg.bg; rr(px0,py0,PW,30,15,false); x.fill();
          x.font='bold 19px '+FONT; x.fillStyle=tg.fg; x.textAlign='center'; x.fillText(tg.label,px0+PW/2,py0+21);
          x.fillStyle=NAVY; x.font='34px '+FONT; x.textAlign='left'; x.fillText(p.name,px0+PW+14,ly);
          if(p.time){ x.fillStyle=BLUE; x.font='32px '+FONT; x.textAlign='right'; x.fillText(p.time,bx+CW-26,ly); x.textAlign='left'; }
        });
      }
    });
    y+=rowH[ri]+G;
  });
  // credit
  x.fillStyle='#7887A0'; x.font='bold 20px '+FONT; x.textAlign='right';
  x.fillText(CREDIT,W-P,H-36);
  return c;
}

// Every printed sheet: credit top-right under the print date, outside the scaled part (never shrinks or gets cut).

function weekSheet(monStr){

function fitSheets(){
  var root=document.getElementById('printRoot'), prev=root.style.cssText;
  root.style.cssText='display:block;position:absolute;left:-10000px;top:0';
  root.querySelectorAll('.sheet').forEach(function(sh){
    var inner=sh.querySelector('.inner'); inner.style.transform=''; inner.style.width='';
    var w=inner.scrollWidth, h=inner.scrollHeight, s=Math.min(1, 1040/w, 710/h); s=Math.max(s,0.45);
    if(s<1){ inner.style.transform='scale('+s+')'; inner.style.width=(1040/s)+'px'; }
  });
  root.style.cssText=prev;
}
function doPrint(title,after){
  var old=document.title; document.title=title;

  window.addEventListener('afterprint',fin,{once:true});

}

function exportMonth(first){
  var y=first.getFullYear(), mo=first.getMonth(), mons=[], wk=mondayOf(periodStart());
  while(wk<=periodEnd()){ var tue=addDays(wk,1); if(tue.getFullYear()===y && tue.getMonth()===mo) mons.push(ymd(wk)); wk=addDays(wk,7); }
  if(!mons.length) return dialog('Export month PDF','There are no weeks of '+MONTHS_L[mo]+' '+y+' in the rota.');
  Promise.all(mons.map(loadWeek)).then(function(){
    var html=mons.map(weekSheet).join('');
    // paid hours summary
    var people={}, order=[];
    mons.forEach(function(ms,i){ buildModel(ms).sections.forEach(function(s){ s.rows.forEach(function(r){ if(!r.hours && !(r.v||[]).some(function(x){return String(x||'').trim();})) return; if(!people[r.key]){ people[r.key]={name:r.name,h:[]}; order.push(r.key);} people[r.key].h[i]=r.hours; }); }); });
    var t='<div class="ptitle">PETRUS &middot; Paid hours &middot; '+MONTHS_L[mo]+' '+y+'</div><div class="psub">30 min unpaid break for every 6 h worked</div><table class="sum"><tr><th style="text-align:left">Name</th>'+mons.map(function(ms){var d=parseYmd(ms);return '<th>Wk '+isoWeek(d)+'<br>'+addDays(d,1).getDate()+' '+MONTHS[addDays(d,1).getMonth()]+'</th>';}).join('')+'<th>Total</th></tr>';
    order.forEach(function(k){ var p=people[k], tot=0; t+='<tr><td class="nm">'+esc(p.name)+'</td>'+mons.map(function(ms,i){ var v=p.h[i]||0; tot+=v; return '<td>'+(v?fmtH(v):'-')+'</td>'; }).join('')+'<td class="b">'+fmtH(tot)+'</td></tr>'; });
    t+='</table>';
    html+=sheetHtml(t);
    document.getElementById('printRoot').innerHTML=html;
    doPrint('Petrus Rota - '+MONTHS_L[mo]+' '+y,null);
  }).catch(function(err){ toast('Could not load the month: '+(err&&err.message||err),true); });
}
window.addEventListener('beforeprint',function(){
  var root=document.getElementById('printRoot');
  if(!root.innerHTML && S.view==='week' && S.mon){ root.innerHTML=weekSheet(S.mon); fitSheets(); }   // Ctrl+P on a week
});
window.addEventListener('afterprint',function(){ setTimeout(function(){ document.getElementById('printRoot').innerHTML=''; },300); });

/* ---------------------------------------------------------------- start */
function closedPage(msg){
  document.getElementById('app').innerHTML='';
  var d=document.createElement('div'); d.className='closed-page';
  d.innerHTML='<h2>'+esc(msg)+'</h2><a href="../operations.html">&larr; Back to Operations</a>';
  document.body.appendChild(d);
}
var started=false;
auth.onAuthStateChanged(function(user){
  if(!user || started) return;
  var email=String(user.email||'').toLowerCase();
  if(email.indexOf('guest')===0) return closedPage('The rota is only available for the Petrus team.');
  started=true;
  S.user=user; S.isOwner=(email==='fiorella@petrus.local');
  S.canEditTeam=EDITORS.indexOf(email)>=0;                                   // team table / team order
  S.noIndex=WEEK_EDITORS.indexOf(email)>=0;                                  // Milena: weeks only
  S.canEdit=S.canEditTeam || S.noIndex;                                      // hours, covers, copy week, Monday on/off
  S.staff=VIEWERS.indexOf(email)<0;                  // rest of the team: timetable only, read only
  if(S.staff){ var back=document.querySelector('.top-bar a'); if(back) back.href='../index.html'; }
  loadCfg().then(S.staff?null:loadRange).then(function(){
    var h=(location.hash||'').replace('#','');
    if(/^\d{4}-\d{2}-\d{2}$/.test(h)) openWeek(ymd(mondayOf(parseYmd(h))));
    else if(S.staff || S.noIndex) act('thisweek');
    else renderIndex();
  }).catch(function(err){
    document.getElementById('app').innerHTML='<div class="loading">Could not load the rota: '+esc(err&&err.message||err)+'</div>';
  });
});

window.__rota = { S:S, waText:waText, waData:waData, drawCard:drawCard, paidMin:paidMin, staffMatch:staffMatch, buildModel:buildModel, weekSheet:weekSheet, fitSheets:fitSheets, openWeek:openWeek, renderIndex:renderIndex };
})();
</script>
</body>
</html>
